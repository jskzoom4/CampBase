<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>캠프베이스</title>
<meta name="theme-color" content="#2f6f4f">
<meta name="description" content="캠핑 준비물·장비·후기를 내 계정에 기록하는 캠핑 노트">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="캠프베이스">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    /* 색 규칙(CLAUDE.md "화면 규칙"): accent(앰버)는 만들기/추가 버튼에만, 진행률·태그·배지는 중립(회색), 완료는 good(초록).
       글자 대비는 WCAG AA(4.5:1) 이상이 되도록 고른 값 — --brand-text/--good-text는 글자용, --brand/--good/--bad-solid는 칠하는 배경용. */
    --brand:#2f6f4f; --brand-text:#2f6f4f; --brand-dark:#1f4d36; --accent:#ad5f0c; --on-accent:#ffffff;
    --good:#237d48; --good-text:#1d6b3d; --warn:#c98a2c; --bad:#b5452f; --bad-solid:#b5452f;
    --bg:#f7f6f2; --surface:#ffffff; --surface-2:#f0eee7; --border:#e4e1d8; --text:#1f2420; --text-dim:#63675f;
    --radius:14px; --tabbar-h:62px; --safe-bottom:env(safe-area-inset-bottom, 0px);
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#141815; --surface:#1c211d; --surface-2:#232821; --border:#333a32; --text:#eceae3; --text-dim:#9aa199;
      --brand:#357a57; --brand-text:#5fae86; --brand-dark:#2c6a4b; --accent:#e3a54f; --on-accent:#141815;
      --good:#24814c; --good-text:#4cc27d; --bad:#e06a57; --bad-solid:#b5452f;
    }
  }
  :root[data-theme="dark"]{
    --bg:#141815; --surface:#1c211d; --surface-2:#232821; --border:#333a32; --text:#eceae3; --text-dim:#9aa199;
    --brand:#357a57; --brand-text:#5fae86; --brand-dark:#2c6a4b; --accent:#e3a54f; --on-accent:#141815;
    --good:#24814c; --good-text:#4cc27d; --bad:#e06a57; --bad-solid:#b5452f;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:"Work Sans","Apple SD Gothic Neo","Malgun Gothic",sans-serif;}
  .disp{font-family:"Fraunces",serif;}
  .num{font-family:"JetBrains Mono",monospace;}
  button, input, select, textarea{font-family:inherit;color:inherit;}
  #app{display:flex;height:100vh;overflow:hidden;}

  /* ---- sidebar ---- */
  #sidebar{width:216px;min-width:216px;background:var(--surface);border-right:1px solid var(--border);
    display:flex;flex-direction:column;padding:16px 12px;}
  .brand{display:flex;align-items:center;gap:9px;padding:6px 8px 18px;}
  .brand-badge{width:30px;height:30px;border-radius:9px;background:var(--brand);color:#fff;
    display:flex;align-items:center;justify-content:center;flex:none;}
  .brand-badge svg{width:18px;height:18px;}
  .brand-name{font-family:"Fraunces",serif;font-weight:700;font-size:16px;}
  .brand-sub{font-size:10.5px;color:var(--text-dim);}
  nav#nav{display:flex;flex-direction:column;gap:2px;}
  .nav-item{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:9px;
    color:var(--text-dim);cursor:pointer;border:1px solid transparent;font-size:14px;font-weight:500;
    transition:background .12s ease,color .12s ease;}
  .nav-item svg{width:18px;height:18px;flex:none;}
  .nav-item:hover{background:var(--surface-2);color:var(--text);}
  .nav-item.active{background:var(--brand);color:#fff;}
  .nav-spacer{flex:1;}
  .nav-foot{font-size:11px;color:var(--text-dim);padding:10px 10px 2px;line-height:1.5;}
  .dot-status{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--good);margin-right:5px;position:relative;top:-1px;}
  .dot-status.local{background:var(--warn);}
  .dot-status.err{background:var(--bad);}

  /* ---- main ---- */
  #main-wrap{flex:1;min-width:0;display:flex;flex-direction:column;}
  #topbar{display:flex;align-items:center;gap:14px;padding:16px 26px;border-bottom:1px solid var(--border);
    background:var(--bg);position:sticky;top:0;z-index:5;}
  #topbar h2{margin:0;font-size:21px;}
  #main{--main-pt:22px;flex:1;overflow-y:auto;padding:var(--main-pt) 26px 60px;}
  .section-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:16px;flex-wrap:wrap;}
  .section-head h1{font-size:20px;margin:0 0 4px;}
  .section-desc{font-size:12.5px;color:var(--text-dim);margin:0;line-height:1.5;}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;}
  .grid{display:grid;gap:14px;}
  .empty{color:var(--text-dim);font-size:13px;padding:18px 4px;text-align:center;}

  .btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--surface);
    color:var(--text);border-radius:9px;padding:8px 13px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;}
  .btn svg{width:15px;height:15px;}
  .btn:hover{background:var(--surface-2);}
  .btn-accent{background:var(--accent);border-color:var(--accent);color:var(--on-accent);}
  .btn-accent:hover{background:var(--accent);filter:brightness(1.08);}
  .btn-primary{background:var(--brand);border-color:var(--brand);color:#fff;}
  .btn-ghost{background:transparent;}
  .btn-sm{padding:6px 10px;font-size:12px;}
  .btn-danger{color:var(--bad);}
  .btn-danger-solid{background:var(--bad-solid);border-color:var(--bad-solid);color:#fff;}
  .btn-danger-solid:hover{opacity:.9;}

  .tag{display:inline-block;background:var(--surface-2);color:var(--text-dim);border-radius:6px;padding:2px 8px;font-size:11px;font-weight:600;}

  /* ---- home ---- */
  .stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:6px;}
  .stat-card{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;}
  .stat-card h3{margin:0;font-size:13.5px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:3px;}
  .stat-card .legend{display:flex;flex-direction:column;gap:3px;width:100%;font-size:11.5px;color:var(--text-dim);}
  .legend-row{display:flex;align-items:center;gap:6px;}
  .legend-dot{width:8px;height:8px;border-radius:50%;flex:none;}
  .legend-row .lv{flex:1;text-align:left;}
  .stat-card .big-num{font-family:"JetBrains Mono",monospace;font-size:22px;font-weight:700;}
  .stat-bars{display:none;flex-direction:column;gap:2px;width:100%;}
  .bar-row{display:grid;grid-template-columns:minmax(64px, 30%) 1fr 28px;align-items:center;gap:8px;min-height:30px;padding:2px 4px;margin:0 -4px;font-size:12.5px;}
  .bar-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text);}
  .bar-track{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;}
  .bar-fill{display:block;height:100%;border-radius:99px;}
  .bar-num{text-align:right;color:var(--text-dim);}
  .home-cat-link{cursor:pointer;border-radius:6px;transition:background .12s ease;}
  .legend-row.home-cat-link{padding:3px 4px;margin:0 -4px;}
  .home-cat-link:hover{background:var(--surface-2);color:var(--brand-text);}
  .chev-mini{width:12px!important;height:12px!important;opacity:.6;}

  /* ---- forms/modal ---- */
  /* 모달 = [본문(안쪽만 스크롤)] + [고정 버튼 바(.modal-foot)]. 높이는 키보드를 뺀 실제 보이는 화면(--vvh) 기준 */
  .modal-backdrop{position:fixed;left:0;right:0;top:var(--vvt, 0px);height:var(--vvh, 100dvh);background:rgba(20,24,20,.5);display:flex;align-items:center;justify-content:center;
    padding:20px;z-index:50;}
  .modal{background:var(--surface);border-radius:16px;padding:0;width:100%;max-width:440px;max-height:min(88vh, calc(var(--vvh, 100dvh) - 40px));
    display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.3);}
  .modal-body{flex:1 1 auto;min-height:0;overflow-y:auto;padding:22px;overscroll-behavior:contain;}
  .modal-foot{flex:none;display:flex;justify-content:flex-end;gap:8px;padding:12px 22px 14px;border-top:1px solid var(--border);background:var(--surface);}
  .modal h3{margin:0 0 14px;font-size:17px;}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:12px;font-weight:600;color:var(--text-dim);margin-bottom:5px;}
  .field input, .field select, .field textarea{width:100%;padding:9px 10px;border:1px solid var(--border);
    border-radius:9px;background:var(--bg);font-size:13.5px;}
  .field textarea{resize:vertical;min-height:64px;}
  .field-row{display:flex;gap:10px;}
  .field-row .field{flex:1;}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;}
  .seg-group{display:flex;gap:6px;flex-wrap:wrap;}
  .seg-btn{padding:7px 12px;border-radius:8px;border:1px solid var(--border);background:var(--bg);font-size:12.5px;cursor:pointer;}
  .seg-btn.active{background:var(--brand);border-color:var(--brand);color:#fff;}
  .form-subhead{font-size:12px;font-weight:700;color:var(--text-dim);margin:16px 0 8px;padding-top:12px;border-top:1px solid var(--border);}

  /* ---- lists ---- */
  .list-row{display:flex;align-items:flex-start;gap:10px;padding:12px 4px;border-bottom:1px solid var(--border);}
  .list-row:last-child{border-bottom:none;}
  .list-row .name{font-weight:700;font-size:14px;}
  .list-row .meta{font-size:12px;color:var(--text-dim);margin-top:2px;}
  .list-row .notes{font-size:12.5px;color:var(--text-dim);margin-top:4px;line-height:1.5;}
  .list-row .row-actions{display:flex;gap:6px;flex:none;}
  .icon-btn{background:none;border:none;padding:4px;cursor:pointer;color:var(--text-dim);border-radius:6px;}
  .icon-btn:hover{background:var(--surface-2);color:var(--text);}
  .icon-btn svg{width:16px;height:16px;}

  .banner{display:flex;align-items:flex-start;gap:10px;background:var(--surface-2);border:1px solid var(--border);
    border-radius:10px;padding:10px 12px;font-size:12.5px;color:var(--text-dim);margin-bottom:14px;}
  .banner svg{width:16px;height:16px;flex:none;margin-top:1px;}

  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(10px);background:var(--text);
    color:var(--bg);padding:10px 16px;border-radius:9px;font-size:13px;opacity:0;pointer-events:none;
    transition:opacity .18s ease, transform .18s ease;z-index:80;border-left:3px solid transparent;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .toast.fail{border-left-color:var(--bad);}
  .toast.ok{border-left-color:var(--good);}
  .toast.has-action.show{pointer-events:auto;display:flex;align-items:center;gap:12px;}
  .toast-undo{background:none;border:1px solid currentColor;color:inherit;font-weight:700;font-size:12.5px;cursor:pointer;
    padding:5px 10px;border-radius:7px;flex:none;}
  /* ---- 새 버전 안내 (APK) ---- */
  #update-banner{display:none;align-items:center;gap:10px;padding:9px 16px;font-size:13px;
    background:color-mix(in srgb, var(--brand) 14%, var(--surface));border-bottom:1px solid var(--border);}
  #update-banner.show{display:flex;}
  #update-banner .spacer{flex:1;}
  #update-banner svg{width:16px;height:16px;flex:none;color:var(--brand-text);}
  /* ---- 캠핑 일정 ---- */
  .trip-bar{margin-bottom:12px;}
  .trip-chips .seg-btn{display:inline-flex;align-items:center;gap:5px;height:36px;padding:0 12px;box-sizing:border-box;line-height:1;}
  .trip-chips svg{width:14px;height:14px;}
  .trip-new-chip{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600;}
  /* ---- 일정 패널(일정 카드 + 준비물) ---- */
  .trip-panel{padding:0;margin-bottom:16px;}
  .trip-panel-head{position:sticky;top:calc(-1 * var(--main-pt));z-index:6;display:flex;align-items:center;gap:8px;padding:12px 10px 4px 16px;
    background:var(--surface);border-radius:var(--radius) var(--radius) 0 0;transition:padding .15s ease, box-shadow .15s ease;}
  .trip-panel-head.stuck{padding:6px 10px 6px 16px;border-radius:0;border-bottom:1px solid var(--border);box-shadow:0 6px 14px rgba(0,0,0,.10);}
  .tp-title{flex:1;min-width:0;display:flex;align-items:center;gap:7px;font-weight:700;font-size:15.5px;}
  .tp-title svg{width:17px;height:17px;color:var(--brand-text);flex:none;}
  .tp-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .tp-mini{display:none;flex:none;font-size:12.5px;font-weight:600;color:var(--text-dim);white-space:nowrap;}
  .trip-panel-head.stuck .tp-mini{display:inline;}
  .trip-panel-head.stuck .trip-phase, .trip-panel-head.stuck .trip-reviewed{display:none;}
  .tp-meta-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 16px;font-size:12.5px;color:var(--text-dim);}
  .tp-where{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .avatar-stack{display:inline-flex;flex:none;padding-left:6px;}
  .avatar-stack .mini-avatar{margin-left:-6px;box-shadow:0 0 0 2px var(--surface);}
  .trip-panel .trip-progress{padding:8px 16px 0;}
  .trip-panel .trip-bar-track{height:5px;}
  .tp-tools{display:flex;align-items:center;gap:8px;padding:10px 16px 12px;}
  .tp-tools .seg-group{flex:1;min-width:0;flex-wrap:nowrap;overflow-x:auto;}
  .tp-add-list{flex:none;}
  .seg-sm .seg-btn{padding:5px 10px;font-size:12px;}
  .panel-list{padding:8px 12px 10px 16px;border-top:1px solid var(--border);}
  .panel-list > h3{margin-bottom:4px;}
  .panel-list.checklist-group{margin-bottom:0;}
  .tp-empty{border-top:1px solid var(--border);padding:16px;display:flex;flex-direction:column;align-items:center;gap:10px;font-size:13px;color:var(--text-dim);text-align:center;}
  .tp-empty-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;}
  .section-desc.one-line{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .cl-filter-row{margin-bottom:16px;}
  @media (prefers-reduced-motion: reduce){ .trip-panel-head{transition:none;} }
  .trip-card{margin-bottom:16px;}
  .trip-phase{flex:none;}
  .trip-phase.ongoing{background:color-mix(in srgb, var(--brand) 18%, transparent);color:var(--brand-text);}

  .trip-progress{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--text-dim);flex-wrap:wrap;}
  .trip-bar-track{flex:1;min-width:120px;height:7px;border-radius:99px;background:var(--surface-2);overflow:hidden;}
  .trip-bar-track span{display:block;height:100%;background:var(--good);border-radius:99px;}
  .trip-progress b{color:var(--text);}

  .trip-reviewed svg{width:12px;height:12px;vertical-align:-1px;}
  .trip-tag{display:inline-flex;align-items:center;gap:3px;font-family:"Work Sans",sans-serif;font-size:11px;vertical-align:middle;}
  .trip-tag svg{width:11px;height:11px;}
  .tpl-manage-head{font-size:11.5px;font-weight:700;color:var(--text-dim);margin:12px 0 2px;}
  .tpl-name-input{flex:1;min-width:0;padding:7px 9px;border:1px solid var(--border);border-radius:8px;background:var(--bg);font-size:13px;}
  .next-trip-wrap{margin-bottom:18px;display:flex;flex-direction:column;gap:8px;}
  .next-trip-card{display:flex;align-items:center;gap:14px;cursor:pointer;
    background:linear-gradient(120deg, color-mix(in srgb, var(--brand) 14%, var(--surface)), var(--surface));}
  .next-trip-card:hover{border-color:var(--brand);}
  .next-trip-icon{width:42px;height:42px;border-radius:12px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;flex:none;}
  .next-trip-icon svg{width:22px;height:22px;}
  .next-trip-label{font-size:11.5px;font-weight:700;color:var(--text-dim);display:flex;align-items:center;gap:6px;}
  .next-trip-label svg{width:11px!important;height:11px!important;}
  .next-trip-title{font-family:"Fraunces",serif;font-weight:700;font-size:17px;margin-top:2px;}
  .next-trip-line{font-size:12.5px;color:var(--text-dim);margin-top:3px;}
  .next-trip-review{display:flex;align-items:center;gap:8px;padding:10px 14px;border:1px dashed var(--border);border-radius:12px;
    font-size:13px;cursor:pointer;background:var(--surface);}
  .next-trip-review svg{width:15px;height:15px;color:var(--brand-text);flex:none;}
  .next-trip-review span{flex:1;}
  .next-trip-review:hover{border-color:var(--brand);}
  /* ---- 그룹 후기 공유 ---- */
  .share-tag{display:inline-flex;align-items:center;gap:3px;font-family:"Work Sans",sans-serif;font-size:11px;vertical-align:middle;margin-left:4px;}
  .share-tag svg{width:11px;height:11px;}
  .share-chip{display:inline-flex;align-items:center;gap:5px;}
  .share-chip svg{width:14px;height:14px;}
  .camp-view-chip{display:inline-flex;align-items:center;gap:5px;}
  .camp-view-chip svg{width:14px;height:14px;}
  .review-grid{grid-template-columns:repeat(auto-fill,minmax(260px,1fr));}
  .review-card{cursor:pointer;display:flex;flex-direction:column;gap:10px;}
  .review-card:hover{border-color:var(--brand);}
  .review-card .name{font-weight:700;font-size:14.5px;}
  .review-card .meta{font-size:12px;color:var(--text-dim);}
  .review-avg{flex:none;font-size:14px;font-weight:700;}
  .review-star{color:var(--text-dim);}
  .review-summary{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
  .review-authors{margin-left:auto;display:inline-flex;gap:2px;}
  .review-actions{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;}
  .review-actions:empty{display:none;}
  /* ---- Gear 위쪽 정리 + 선택 모드 액션 바(3-3) ---- */
  .gear-head-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .btn.active-toggle{background:var(--brand);border-color:var(--brand);color:#fff;}
  .gear-cat-row{margin-bottom:16px;}
  .gear-row[data-action="gear-pick"]{cursor:pointer;border-radius:10px;}
  .gear-row[data-action="gear-pick"]:hover{background:var(--surface-2);}
  .gear-row.picked{background:color-mix(in srgb, var(--brand) 9%, transparent);}
  .pick-box{width:24px;height:24px;flex:none;border-radius:7px;border:2px solid var(--border);display:inline-flex;align-items:center;justify-content:center;margin:8px 2px 0 6px;}
  .gear-row.picked .pick-box{background:var(--brand);border-color:var(--brand);color:#fff;}
  .pick-box svg{width:15px;height:15px;}
  .select-bar{position:fixed;z-index:35;left:calc(50% + 108px);transform:translateX(-50%);bottom:20px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;
    justify-content:center;width:max-content;max-width:calc(100% - 248px);background:var(--surface);border:1px solid var(--border);border-radius:14px;
    padding:8px 10px;box-shadow:0 10px 30px rgba(0,0,0,.18);}
  .select-count{font-size:13px;font-weight:600;padding:0 6px;}
  .select-bar .btn[disabled]{opacity:.5;cursor:default;}
  body.gear-selecting #main{padding-bottom:120px;}
  @media (max-width:820px){
    .select-bar{left:12px;right:12px;transform:none;max-width:none;width:auto;bottom:calc(var(--tabbar-h) + var(--safe-bottom) + 10px);}
    body.gear-selecting #main{padding-bottom:calc(var(--tabbar-h) + var(--safe-bottom) + 120px);}
  }
  /* ---- Cooking 접기/펼치기(3-4) ---- */
  .recipe-grid{grid-template-columns:repeat(auto-fill,minmax(300px,1fr));align-items:start;}
  .recipe-card{padding:0;}
  .recipe-head{display:flex;align-items:center;gap:10px;width:100%;min-height:56px;padding:12px 12px 12px 16px;border:none;background:none;
    text-align:left;cursor:pointer;border-radius:var(--radius);color:var(--text);}
  .recipe-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;}

/* ---- 저장소: Firebase Firestore / 로그인: Firebase Auth(구글) ----
 * 로그인한 사람마다 개인 공간 users/{uid}/... 에 저장한다.
 * 앱의 나머지 코드는 예전(claude.ai) 저장 인터페이스
 *   db.collection(name).onSnapshot/doc(id).set/delete/get, db.doc(path)...
 * 를 그대로 쓰고, makeFirestoreAdapter(fs, fdb, base)가 경로 앞에 base('users/{uid}')를 붙여
 * Firestore 호출로 바꿔준다. (base가 ''이면 최상위 = 예전 공유 저장소, 가져오기에만 사용)
 * 로그인 상태는 웹 SDK(auth) 하나만 본다. APK는 네이티브 구글 로그인 → idToken으로 웹 SDK에 로그인.
 * 설정값(firebase-config.js)이 비어 있으면 '미리보기 모드'(로그인·저장 없음)로 동작. */

function normalizeHomeWidgets(raw){
  const w = (raw && typeof raw==='object') ? {...raw} : {};
  if(w.nextTrip===undefined && typeof w.location==='boolean') w.nextTrip = w.location;
  delete w.location;
  return {...DEFAULT_HOME_WIDGETS, ...w};
}

function firebaseConfigured(){
  const c = window.FIREBASE_CONFIG;
  if(!c || !c.apiKey || !c.projectId) return false;
  return !/붙여넣|YOUR_|PASTE|여기에/i.test(String(c.apiKey) + String(c.projectId));
}
// APK(Capacitor) 안에서 열렸는지. 웹(GitHub Pages)에서는 window.Capacitor가 없음.
function isNativeApp(){
  const C = window.Capacitor;
  if(!C) return false;
  return typeof C.isNativePlatform === 'function' ? !!C.isNativePlatform() : true;
}
function nativeAuthPlugin(){
  const C = window.Capacitor;
  return (C && C.Plugins && C.Plugins.FirebaseAuthentication) || null;
}
async function loadFirebaseModules(bases){
  if(window.__FIREBASE_MODULES__) return {...window.__FIREBASE_MODULES__, base:'injected'}; // 테스트용 주입
  let lastErr;
  for(const base of bases){
    try{
      const app = await import(base + 'firebase-app.js');
      const firestore = await import(base + 'firebase-firestore.js');
      const auth = await import(base + 'firebase-auth.js');
      return {app, firestore, auth, base};
    }catch(e){ lastErr = e; }
  }
  throw lastErr || new Error('Firebase SDK를 불러오지 못했어요');
}
function buildFirebase(mods){
  const appMod = mods.app, fs = mods.firestore, authMod = mods.auth;
  const apps = appMod.getApps ? appMod.getApps() : [];
  const app = apps.length ? apps[0] : appMod.initializeApp(window.FIREBASE_CONFIG);
  let fdb;
  try{
    fdb = fs.initializeFirestore(app, {
      ignoreUndefinedProperties: true,
      // 캠핑장처럼 신호가 약한 곳에서도 열리고, 체크한 내용은 연결되면 자동 동기화
      localCache: fs.persistentLocalCache({ tabManager: fs.persistentMultipleTabManager() }),
    });
  }catch(e){
    fdb = fs.getFirestore(app);
  }
  let auth;
  if(isNativeApp()){
    // APK: 팝업 로그인을 쓰지 않으므로(구글이 WebView 로그인을 막음) 팝업 도우미 없이
    // 로그인 상태만 기기(IndexedDB)에 보관 → 다시 열어도 로그인 유지
    try{ auth = authMod.initializeAuth(app, { persistence: [authMod.indexedDBLocalPersistence, authMod.browserLocalPersistence] }); }
    catch(e){ auth = authMod.getAuth(app); }
  }else{
    auth = authMod.getAuth(app);   // 웹: 기본값이 로그인 유지(IndexedDB) + 팝업 로그인 지원
  }
  // 테스트 전용(tests/emulator-e2e.test.js): Firebase 에뮬레이터로 연결. 실제 앱에서는 설정되지 않음.
  const emu = window.__FIREBASE_EMULATOR__;
  if(emu){
    fs.connectFirestoreEmulator(fdb, emu.host, emu.firestorePort);
    authMod.connectAuthEmulator(auth, 'http://' + emu.host + ':' + emu.authPort, { disableWarnings: true });
  }
  return {fs, fdb, auth, authMod};
}
async function connectFirebase(){
  // APK에는 SDK가 앱 안(vendor/)에 들어 있어 오프라인 첫 실행도 가능. 웹에서는 CDN 사용.
  let mods = await loadFirebaseModules(['./vendor/firebase/', FIREBASE_CDN]);
  try{ return buildFirebase(mods); }
  catch(e){
    if(mods.base !== FIREBASE_CDN && mods.base !== 'injected'){
      mods = await loadFirebaseModules([FIREBASE_CDN]);
      return buildFirebase(mods);
    }
    throw e;
  }
}
function makeFirestoreAdapter(fs, fdb, base){
  const full = p => base ? base + '/' + p : p;
  const wrapQuery = snap => ({ empty: snap.empty, fromCache: !!(snap.metadata && snap.metadata.fromCache), docs: snap.docs.map(d=>({ id: d.id, data: ()=>d.data() })) });
  const wrapDoc = snap => ({ exists: snap.exists(), data: ()=>snap.data() });
  function listen(ref, isDoc, cb, errCb){
    let first = true, prevJson = null;
    return fs.onSnapshot(ref, { includeMetadataChanges: true }, snap=>{
      setOnlineStatus(!(snap.metadata && snap.metadata.fromCache));
      if(isDoc){
        const json = JSON.stringify(snap.exists() ? snap.data() : null);
        if(first || json !== prevJson){ first = false; prevJson = json; cb(wrapDoc(snap)); }
      }else if(first || snap.docChanges().length > 0){
        first = false; cb(wrapQuery(snap));
      }
    }, errCb);
  }
  const docApi = d => ({
    set: data => fs.setDoc(d, data),
    update: data => fs.updateDoc(d, data),   // 일부 필드만 변경('members.uid' 같은 경로, arrayUnion 등 사용 가능)
    delete: () => fs.deleteDoc(d),
    get: () => fs.getDoc(d).then(wrapDoc),
    onSnapshot: (cb, errCb) => listen(d, true, cb, errCb),
  });
  const queryApi = q => ({
    onSnapshot: (cb, errCb) => listen(q, false, cb, errCb),
    get: () => fs.getDocs(q).then(wrapQuery),
  });
  return {
    collection(name){
      const path = full(name);
      const ref = fs.collection(fdb, path);
      return {
        onSnapshot: (cb, errCb) => listen(ref, false, cb, errCb),
        doc: id => docApi(fs.doc(fdb, path, id)),
        get: () => fs.getDocs(ref).then(wrapQuery),
        // 조건 조회. 예) where('memberUids','array-contains', uid)
        where: (field, op, value) => queryApi(fs.query(ref, fs.where(field, op, value))),
        // 앞에서 n개만(있는지 확인용)
        limit: n => queryApi(fs.query(ref, fs.limit(n))),
      };
    },
    doc: path => docApi(fs.doc(fdb, full(path))),
    // update()에 쓰는 특수 값
    arrayUnion: (...v) => fs.arrayUnion(...v),
    arrayRemove: (...v) => fs.arrayRemove(...v),
    deleteField: () => fs.deleteField(),
  };
}
let _offlineTimer = null;
function setOnlineStatus(isOnline){
  if(isOnline){
    if(_offlineTimer){ clearTimeout(_offlineTimer); _offlineTimer = null; }
    if(!state.online){ state.online = true; updateStatus(); }
  }else if(state.online && !_offlineTimer){
    // 앱을 막 열었을 때 잠깐 캐시로 먼저 뜨는 건 무시하고, 3초 넘게 서버에 못 붙으면 오프라인 표시
    _offlineTimer = setTimeout(()=>{ _offlineTimer = null; state.online = false; updateStatus(); }, 3000);
  }
}
const _reportedDbErrors = new Set();
function reportDbError(e){
  const code = (e && e.code) || 'unknown';
  console.error('[firestore]', e);
  if(_reportedDbErrors.has(code)) return;
  _reportedDbErrors.add(code);
  if(code === 'permission-denied'){
    toast('저장소 접근이 거부됐어요. Firestore 규칙을 게시했는지 확인해주세요.', 'fail');
  }else{
    toast('저장소 연결에 문제가 있어요 (' + code + ')', 'fail');
  }
}
function withTimeout(p, ms){
  return Promise.race([p, new Promise((_, rej)=>setTimeout(()=>rej(new Error('timeout')), ms))]);
}

let _fb = null;          // {fs, fdb, auth, authMod}
let _unsubs = [];        // 로그인한 사람 데이터의 실시간 구독 해제 함수들
let _dataGen = 0;        // 계정이 바뀐 뒤 늦게 도착한 예전 계정 스냅샷을 무시하기 위한 번호

async function initDb(){
  if(!firebaseConfigured()){ finishBoot('preview'); return; }
  try{ _fb = await withTimeout(connectFirebase(), 20000); }
  catch(e){ console.error('[firebase]', e); finishBoot('error'); return; }
  state.rootDb = makeFirestoreAdapter(_fb.fs, _fb.fdb, '');
  _fb.authMod.onAuthStateChanged(_fb.auth, user=>{
    try{ onAuthUser(user); }
    catch(e){ console.error('[auth]', e); toast('로그인 처리 중 오류가 발생했어요: ' + (e && e.message ? e.message : String(e)), 'fail'); }
  });
}
function onAuthUser(user){
  stopUserData();
  if(!user){ state.user = null; finishBoot('signedOut'); return; }
  state.user = { uid: user.uid, name: user.displayName || '', email: user.email || '', photoURL: user.photoURL || '' };
  state.db = makeFirestoreAdapter(_fb.fs, _fb.fdb, 'users/' + user.uid);
  state.dbAvailable = true;
  startUserData();
  startGroups();
  checkLegacyAvailable();
  // 계정 정보(이름·이메일·사진)는 로그인할 때마다 최신으로 남김
  const u = state.user;
  safePersist(()=>state.rootDb.doc('users/' + u.uid).set({ name: u.name, email: u.email, photoURL: u.photoURL, updatedAt: new Date().toISOString() }));
  finishBoot('shared');
}

function stopUserData(){
  _dataGen++;
  _unsubs.forEach(fn=>{ try{ fn && fn(); }catch(e){} });
  _unsubs = [];
  stopGroups();
  state.db = null; state.dbAvailable = false;
  _reportedDbErrors.clear();
  resetUserState();
}
function startUserData(){
  const db = state.db, gen = _dataGen;
  const onErr = e => { if(gen===_dataGen) reportDbError(e); };
  const live = fn => snap => { if(gen===_dataGen) fn(snap); };

  _unsubs.push(db.collection('campingLogs').onSnapshot(live(snap=>{
    state.campingLogs = snap.docs.map(d=>({id:d.id, ...unfreeze(d.data())}));
    state.campingLogsLoaded = true;
    cleanupSharedGroupIds();
    if(['home','camping'].includes(state.currentView)) renderView();
  }), onErr));
  _unsubs.push(db.collection('gear').onSnapshot(live(snap=>{
    state.gear = snap.docs.map(d=>({id:d.id, ...unfreeze(d.data())}));
    if(['home','gear'].includes(state.currentView)) renderView();
  }), onErr));
  _unsubs.push(db.collection('checklists').onSnapshot(live(snap=>{
    state.checklists = snap.docs.map(d=>({id:d.id, ...unfreeze(d.data())}));
    if(['home','checklist'].includes(state.currentView)) renderView();
  }), onErr));
  _unsubs.push(db.collection('trips').onSnapshot(live(snap=>{
    state.trips = snap.docs.map(d=>({id:d.id, ...unfreeze(d.data())}));
    if(['home','checklist'].includes(state.currentView)) renderView();
  }), onErr));
  _unsubs.push(db.collection('checklistTemplates').onSnapshot(live(snap=>{
    state.checklistTemplates = snap.docs.map(d=>({id:d.id, ...unfreeze(d.data())}));
    refreshTripModalTemplates();
  }), onErr));
  _unsubs.push(db.doc(SETTINGS_DOC).onSnapshot(live(snap=>{
    if(snap.exists){
      const d = unfreeze(snap.data()) || {};
      if(d.weatherLocation) state.weatherLocation = d.weatherLocation;
      if(d.gearCategories && d.gearCategories.length) state.gearCategories = d.gearCategories;
      if(d.homeWidgets && typeof d.homeWidgets==='object') state.homeWidgets = normalizeHomeWidgets(d.homeWidgets);
    }
    if(['home','settings','gear'].includes(state.currentView)) renderView();
  }), onErr));
  _unsubs.push(db.collection('cookingChecks').onSnapshot(live(snap=>{
    const map = {};
    snap.docs.forEach(d=>{ map[d.id] = unfreeze(d.data()); });
    state.cookingChecks = map;
    if(state.currentView==='cooking') renderView();
  }), onErr));
}
function finishBoot(mode){
  state.bootMode = mode;
  // 예시 데이터는 저장소 없이 미리보기할 때만 화면에 채움(저장소에는 절대 쓰지 않음)
  if(mode==='preview' && state.campingLogs.length===0){ seedDefaults(); }
  updateStatus();
  if(mode==='signedOut'){ showLoginScreen(); return; }
  document.body.classList.remove('signed-out');
  renderNav(); renderView();
}
function updateStatus(){
  let cls = 'local', text;
  if(state.bootMode==='shared'){
    if(state.online){ cls = ''; text = '자동 저장 켜짐 · 내 계정에 저장'; }
    else { text = '오프라인 · 연결되면 자동 동기화'; }
  }else if(state.bootMode==='preview'){ text = '로컬 미리보기 모드 · 저장 안 됨'; }
  else if(state.bootMode==='error'){ cls = 'err'; text = '연결 안 됨 · 저장 안 됨'; }
  else if(state.bootMode==='signedOut'){ text = '로그인 필요'; }
  else { text = '연결 확인 중…'; }
  const html = `<span class="dot-status ${cls}"></span>${text}`;
  ['db-status','db-status-top'].forEach(id=>{ const el = document.getElementById(id); if(el) el.innerHTML = html; });
}
function bootBanner(){
  if(state.bootMode==='preview') return `<div class="preview-banner"><b>미리보기 모드예요.</b> Firebase 설정값이 아직 없어서 로그인 없이 열렸고, 지금 바꾸는 내용은 저장되지 않아요. 안내서의 Firebase 설정 단계를 마치면 구글 로그인 후 내 계정에 저장돼요.</div>`;
  if(state.bootMode==='error') return `<div class="preview-banner"><b>저장소에 연결하지 못했어요.</b> 인터넷 연결을 확인한 뒤 앱을 다시 열어주세요. 지금 바꾸는 내용은 저장되지 않아요.</div>`;
  return '';
}

/* ---- 로그인 / 로그아웃 ---- */
function setLoginMsg(msg, isErr){
  const el = document.getElementById('login-msg');
  if(!el) return;
  el.textContent = msg || '';
  el.classList.toggle('err', !!isErr);
}
function setLoginBusy(busy){
  const btn = document.getElementById('login-btn');
  if(btn) btn.disabled = !!busy;
}
function showLoginScreen(msg, isErr){
  closeModal();
  document.body.classList.add('signed-out');
  setLoginBusy(false);
  setLoginMsg(msg || '', isErr);
}
function loginErrorMessage(e){
  const code = String((e && e.code) || '');
  const text = code + ' ' + String((e && e.message) || '');
  if(/popup-closed-by-user|cancelled-popup-request|user-cancelled|cancel/i.test(text)) return '로그인을 취소했어요.';
  if(/unauthorized-domain/.test(code)) return '이 주소는 아직 로그인 허용 목록에 없어요. (Firebase 콘솔 → Authentication → 설정 → 승인된 도메인)';
  if(/operation-not-allowed/.test(code)) return 'Firebase에서 Google 로그인이 아직 켜져 있지 않아요.';
  if(/popup-blocked/.test(code)) return '로그인 창(팝업)이 막혔어요. 브라우저에서 팝업을 허용한 뒤 다시 눌러주세요.';
  if(/network-request-failed|network/i.test(text)) return '인터넷 연결을 확인한 뒤 다시 시도해주세요.';
  if(/native\/plugin-missing/.test(code)) return '앱의 로그인 기능을 찾지 못했어요. 최신 APK로 다시 설치해주세요.';
  if(/DEVELOPER_ERROR|(^|\D)10:/.test(text)) return '구글 로그인 설정(SHA-1 등록)이 맞지 않아요. 안내서의 Firebase 설정을 확인해주세요.';
  return '로그인하지 못했어요. 다시 시도해주세요.' + (code ? ' (' + code + ')' : '');
}
let _signingIn = false;
async function signInWithGoogle(){
  if(_signingIn || !_fb) return;
  _signingIn = true;
  setLoginBusy(true); setLoginMsg('구글 계정 확인 중…');
  const A = _fb.authMod;
  try{
    if(isNativeApp()){
      // APK: 폰의 구글 계정 선택 창(네이티브) → 받은 idToken으로 웹 SDK에 로그인
      const plugin = nativeAuthPlugin();
      if(!plugin) throw Object.assign(new Error('FirebaseAuthentication plugin missing'), {code:'native/plugin-missing'});
      const res = await plugin.signInWithGoogle();
      const idToken = res && res.credential && res.credential.idToken;
      if(!idToken) throw Object.assign(new Error('no idToken'), {code:'native/no-id-token'});
      await A.signInWithCredential(_fb.auth, A.GoogleAuthProvider.credential(idToken));
    }else{
      const provider = new A.GoogleAuthProvider();
      if(provider.setCustomParameters) provider.setCustomParameters({ prompt: 'select_account' });
      try{ await A.signInWithPopup(_fb.auth, provider); }
      catch(e){
        if(e && e.code==='auth/popup-blocked' && A.signInWithRedirect){ await A.signInWithRedirect(_fb.auth, provider); return; }
        throw e;
      }
    }
    // 성공하면 onAuthStateChanged → onAuthUser가 앱 화면으로 바꿔줌
  }catch(e){
    console.error('[auth]', e);
    setLoginBusy(false);
    setLoginMsg(loginErrorMessage(e), true);
  }finally{
    _signingIn = false;
  }
}
async function signOutNow(){
  if(!_fb) return;
  const plugin = isNativeApp() ? nativeAuthPlugin() : null;
  if(plugin && plugin.signOut){ try{ await plugin.signOut(); }catch(e){ console.warn('[auth] native signOut', e); } }
  try{
    await _fb.authMod.signOut(_fb.auth);
    toast('로그아웃했어요.');
  }catch(e){
    console.error('[auth]', e);
    toast('로그아웃하지 못했어요. 다시 시도해주세요.', 'fail');
  }
}

/* ---- 기존 공유 데이터(최상위 legacy 경로) → 내 개인 공간으로 복사 ----
 * 원본은 그대로 두고, 내 공간에 이미 같은 id가 있으면 덮어쓰지 않고 건너뛴다. */
const LEGACY_LABELS = {campingLogs:'캠핑 기록', gear:'장비', checklists:'체크리스트', cookingChecks:'요리 재료 체크'};
let _legacyBusy = false;
state.legacyAvailable = false;   // 예전 공유 데이터가 남아 있을 때만 Settings에 가져오기 버튼을 보임
function legacySettingsUseful(d){ return !!d && ((Array.isArray(d.gearCategories) && d.gearCategories.length > 0) || !!d.weatherLocation); }
async function checkLegacyAvailable(){
  const gen = _dataGen;
  let found = false;
  try{
    for(const c of USER_COLLECTIONS){
      const snap = await state.rootDb.collection(c).limit(1).get();
      if(snap.docs.length){ found = true; break; }
    }
    if(!found){
      const st = await state.rootDb.doc(LEGACY_SETTINGS_DOC).get();
      found = st.exists && legacySettingsUseful(unfreeze(st.data()));
    }
  }catch(e){ found = false; }   // 규칙으로 닫혔거나(2단계) 연결 문제 → 버튼 숨김
  if(gen !== _dataGen) return;
  state.legacyAvailable = found;
  if(state.currentView==='settings') renderView();
}
async function readUserCollections(db){
  const out = {};
  for(const c of USER_COLLECTIONS){
    const snap = await db.collection(c).get();
    out[c] = snap.docs.map(d=>({ id: d.id, data: unfreeze(d.data()) || {} }));
  }
  return out;
}
function mergeGearCategories(mine, theirs){
  const merged = [...(mine || [])];
  (theirs || []).forEach(c=>{
    if(!c || merged.includes(c)) return;
    const etc = merged.indexOf('기타');
    if(etc >= 0) merged.splice(etc, 0, c); else merged.push(c);
  });
  return merged;
}
async function startLegacyImport(){
  if(!state.dbAvailable || !state.rootDb){ toast('로그인한 뒤에 가져올 수 있어요.'); return; }
  if(_legacyBusy) return;
  _legacyBusy = true;
  toast('기존 공유 데이터를 확인하는 중…');
  try{
    const legacy = await readUserCollections(state.rootDb);
    const mine = await readUserCollections(state.db);
    const legacySettingsSnap = await state.rootDb.doc(LEGACY_SETTINGS_DOC).get();
    const legacySettings = legacySettingsSnap.exists ? (unfreeze(legacySettingsSnap.data()) || {}) : {};
    const plan = { copy:{}, total:0, skipped:0, counts:{}, settings: legacySettings };
    USER_COLLECTIONS.forEach(c=>{
      const have = new Set(mine[c].map(d=>d.id));
      plan.counts[c] = legacy[c].length;
      plan.total += legacy[c].length;
      plan.copy[c] = legacy[c].filter(d=>!have.has(d.id));
      plan.skipped += legacy[c].length - plan.copy[c].length;
    });
    const hasSettings = legacySettingsUseful(legacySettings);
    if(plan.total === 0 && !hasSettings){ toast('가져올 기존 공유 데이터가 없어요.'); return; }
    const countText = USER_COLLECTIONS.map(c=>`${LEGACY_LABELS[c]} ${plan.counts[c]}개`).join(', ');
    const skipText = plan.skipped ? ` 내 공간에 이미 있는 ${plan.skipped}개는 덮어쓰지 않고 건너뛰어요.` : '';
    confirmModal(`기존 공유 데이터(${countText})를 내 개인 공간으로 복사할까요?${skipText} 공유 데이터 원본은 그대로 남아요.`, '가져오기', ()=>applyLegacyImport(plan));
  }catch(e){
    console.error('[legacy-import]', e);
    const code = (e && e.code) || '';
    toast(code==='permission-denied' ? '기존 공유 데이터를 읽을 수 없어요. (공유 저장소가 이미 닫혔어요)' : '기존 공유 데이터를 불러오지 못했어요.' + (code ? ' (' + code + ')' : ''), 'fail');
  }finally{
    _legacyBusy = false;
  }
}
function applyLegacyImport(plan){
  if(!state.dbAvailable){ toast('로그인한 뒤에 가져올 수 있어요.'); return; }
  const db = state.db;
  let copied = 0, skipped = plan.skipped;
  ['campingLogs','gear','checklists'].forEach(c=>{
    const have = new Set(state[c].map(x=>x.id));   // 확인 창을 띄운 사이에 생긴 항목도 건너뜀
    plan.copy[c].forEach(d=>{
      if(have.has(d.id)){ skipped++; return; }
      const data = stripId(d.data);
      state[c].push({ id: d.id, ...data });
      safePersist(()=>db.collection(c).doc(d.id).set(data));
      copied++;
    });
  });
  plan.copy.cookingChecks.forEach(d=>{
    if(d.id in state.cookingChecks){ skipped++; return; }
    state.cookingChecks[d.id] = d.data;
    safePersist(()=>db.collection('cookingChecks').doc(d.id).set(d.data));
    copied++;
  });
  const s = plan.settings || {};
  let settingsChanged = false;
  if(Array.isArray(s.gearCategories) && s.gearCategories.length){
    const merged = mergeGearCategories(state.gearCategories, s.gearCategories);
    if(merged.length !== state.gearCategories.length){ state.gearCategories = merged; settingsChanged = true; }
  }
  if(s.weatherLocation && !state.weatherLocation){ state.weatherLocation = s.weatherLocation; settingsChanged = true; }
  if(settingsChanged) persistAppSettings();
  renderView();
  toast(`${copied}개를 내 공간으로 가져왔어요.` + (skipped ? ` (이미 있던 ${skipped}개는 건너뜀)` : ''), 'ok');
}

/* ---- 그룹 ----
 * groups/{gid} = { name, ownerUid, memberUids, members:{uid:{name,photoURL,role}}, createdAt, gearCategories }
 * groups/{gid}/checklists|gear/{id} — 멤버 모두가 함께 보고 고침.
 * Checklist·Gear 탭만 공간(내 공간 | 그룹)을 바꿔 볼 수 있고, 나머지 탭(Home 포함)은 항상 개인 공간.
 * 선택한 공간은 기기에 기억(localStorage campbase.space.<uid>). 권한은 firestore.rules가 지킨다. */
state.groups = [];                 // 내가 속한 그룹(실시간)
state.space = 'me';                // 'me' 또는 그룹 id
state.groupChecklists = [];        // 선택한 그룹의 체크리스트
state.groupTemplates = [];         // 선택한 그룹의 체크리스트 템플릿
state.groupTrips = {};             // gid → 그 그룹의 캠핑 일정 (내가 속한 모든 그룹, Home "다음 캠핑" 카드용으로 항상 구독)
state.groupTripLists = {};         // gid → 그 그룹의 체크리스트 (일정 준비 진행률 계산용)
state.groupGear = [];              // 선택한 그룹의 장비
let _groupsUnsub = null, _spaceUnsubs = [], _spaceGen = 0, _pendingSpace = null;
let _groupBg = {};                 // gid → 일정·체크리스트 구독 해제 함수들
const SPACE_KEY_PREFIX = 'campbase.space.';
const INVITE_DAYS = 7;
const GROUP_SUBCOLLECTIONS = ['checklists','gear','trips','checklistTemplates'];   // firestore.rules의 허용 목록과 같아야 함
const INVITE_CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';   // 헷갈리는 0/O/1/I 제외
const INVITE_LEN = 6;

function currentGroup(){ return state.space==='me' ? null : (state.groups.find(g=>g.id===state.space) || null); }
function inGroupSpace(){ return !!currentGroup(); }
function isGroupOwner(g){ return !!(g && state.user && g.ownerUid===state.user.uid); }
function groupById(gid){ return state.groups.find(g=>g.id===gid) || null; }
function groupDb(gid){ return makeFirestoreAdapter(_fb.fs, _fb.fdb, 'groups/' + gid); }
function spaceDb(){ const g = currentGroup(); return g ? groupDb(g.id) : state.db; }
function memberName(g, uid){ const m = g && g.members && g.members[uid]; return (m && m.name) || '나간 멤버'; }
function memberAvatarHtml(g, uid){
  const m = (g && g.members && g.members[uid]) || {};
  if(m.photoURL) return `<img class="mini-avatar" src="${esc(m.photoURL)}" alt="" referrerpolicy="no-referrer">`;
  return `<span class="mini-avatar">${esc((memberName(g, uid).trim().charAt(0) || '?').toUpperCase())}</span>`;
}
// 그룹 멤버 목록(그룹장 먼저, 이름순)
function sortedMemberUids(g){
  return [...(g.memberUids||[])].sort((a,b)=> (a===g.ownerUid?-1:b===g.ownerUid?1:0) || memberName(g,a).localeCompare(memberName(g,b),'ko'));
}

// Checklist·Gear 코드가 보는 "지금 공간"의 데이터
const SP = {
  get checklists(){ return inGroupSpace() ? state.groupChecklists : state.checklists; },
  set checklists(v){ if(inGroupSpace()) state.groupChecklists = v; else state.checklists = v; },
  get gear(){ return inGroupSpace() ? state.groupGear : state.gear; },
  set gear(v){ if(inGroupSpace()) state.groupGear = v; else state.gear = v; },
  get trips(){ const g = currentGroup(); return g ? (state.groupTrips[g.id] || []) : state.trips; },
  set trips(v){ const g = currentGroup(); if(g) state.groupTrips[g.id] = v; else state.trips = v; },
  get templates(){ return inGroupSpace() ? state.groupTemplates : state.checklistTemplates; },
  set templates(v){ if(inGroupSpace()) state.groupTemplates = v; else state.checklistTemplates = v; },
  get gearCategories(){ const g = currentGroup(); return g ? g.gearCategories : state.gearCategories; },
  set gearCategories(v){ const g = currentGroup(); if(g) g.gearCategories = v; else state.gearCategories = v; },
};

function normalizeGroup(id, d){
  d = d || {};
  return {
    ...d, id,
    name: d.name || '이름 없는 그룹',
    memberUids: Array.isArray(d.memberUids) ? d.memberUids : [],
    members: (d.members && typeof d.members==='object') ? d.members : {},
    gearCategories: (Array.isArray(d.gearCategories) && d.gearCategories.length) ? d.gearCategories : [...DEFAULT_GEAR_CATEGORIES],
  };
}
function loadSavedSpace(uid){ try{ return localStorage.getItem(SPACE_KEY_PREFIX + uid) || 'me'; }catch(e){ return 'me'; } }
function saveSpace(){ if(!state.user) return; try{ localStorage.setItem(SPACE_KEY_PREFIX + state.user.uid, state.space); }catch(e){} }

function startGroups(){
  const gen = _dataGen, u = state.user.uid;
  const saved = loadSavedSpace(u);
  _pendingSpace = saved !== 'me' ? saved : null;
  const savedView = loadSavedCampView(u);
  _pendingCampView = savedView !== 'me' ? savedView : null;
  _groupsUnsub = state.rootDb.collection('groups').where('memberUids', 'array-contains', u).onSnapshot(snap=>{
    if(gen !== _dataGen) return;
    state.groups = snap.docs.map(d=>normalizeGroup(d.id, unfreeze(d.data())))
      .sort((a,b)=> String(a.createdAt||'').localeCompare(String(b.createdAt||'')) || a.name.localeCompare(b.name, 'ko'));
    syncGroupBackground();
    if(!snap.fromCache) state.groupsServerLoaded = true;
    cleanupSharedGroupIds();
    syncCampView(snap.fromCache);
    // 기기에 기억해 둔 그룹 공간으로 복귀
    if(_pendingSpace && state.groups.some(g=>g.id===_pendingSpace)){ const p = _pendingSpace; _pendingSpace = null; selectSpace(p, true); return; }
    // 보고 있던 그룹에서 나가졌거나 그룹이 삭제됨
    if(state.space!=='me' && !state.groups.some(g=>g.id===state.space)){
      selectSpace('me', true);
      toast('그룹에 더 이상 속해 있지 않아서 내 공간으로 돌아왔어요.');
      return;
    }
    if(['home','camping','checklist','gear','settings'].includes(state.currentView)) renderView();
  }, e=>{ if(gen===_dataGen) reportDbError(e); });
}
// 내가 속한 모든 그룹의 일정·체크리스트를 항상 구독(Home "다음 캠핑" 카드, 그룹 공간의 일정 줄).
// 그룹에서 빠지면(나가기·내보내짐·삭제) 구독을 끊고 데이터도 지운다. 권한 거부는 조용히 무시.
function syncGroupBackground(){
  const gen = _dataGen;
  const ids = new Set(state.groups.map(g=>g.id));
  Object.keys(_groupBg).forEach(gid=>{
    if(ids.has(gid)) return;
    _groupBg[gid].forEach(fn=>{ try{ fn && fn(); }catch(e){} });
    delete _groupBg[gid]; delete state.groupTrips[gid]; delete state.groupTripLists[gid];
  });
  ids.forEach(gid=>{
    if(_groupBg[gid]) return;
    const db = groupDb(gid);
    const quiet = e=>{ if(gen===_dataGen && !(e && e.code==='permission-denied')) reportDbError(e); };
    const ok = ()=> gen===_dataGen && !!_groupBg[gid];

      db.collection('trips').onSnapshot(snap=>{
        if(!ok()) return;
        state.groupTrips[gid] = snap.docs.map(d=>({id:d.id, ...unfreeze(d.data())}));
        if(['home','checklist'].includes(state.currentView)) renderView();
      }, quiet),
      db.collection('checklists').onSnapshot(snap=>{
        if(!ok()) return;
        state.groupTripLists[gid] = snap.docs.map(d=>({id:d.id, ...unfreeze(d.data())}));
        if(state.currentView==='home') renderView();
      }, quiet),
    ];
  });

function stopSpaceData(){

function startSpaceData(gid){

function makeInviteCode(){
  const bytes = new Uint8Array(INVITE_LEN);
  if(window.crypto && crypto.getRandomValues) crypto.getRandomValues(bytes);
  else for(let i=0;i<bytes.length;i++) bytes[i] = Math.floor(Math.random()*256);
  return Array.from(bytes, b=>INVITE_CHARS[b % INVITE_CHARS.length]).join('');
}

function copyText(text, okMsg){
  const done = ()=>toast(okMsg || '복사했어요.', 'ok');
  const fallback = ()=>{
    try{
      const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select();
      document.execCommand('copy'); ta.remove(); done();
    }catch(e){ toast('자동 복사가 안 돼요. 코드를 길게 눌러 직접 복사해주세요.'); }
  };
  if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done).catch(fallback);
  else fallback();
}

function normalizeCode(v){ return String(v||'').toUpperCase().replace(/[\s-]/g, ''); }

async function checkJoinCode(){
  const el = document.getElementById('join-code');
  const code = normalizeCode(el ? el.value : '');
  if(!new RegExp('^[' + INVITE_CHARS + ']{6,8}$').test(code)){ toast('코드를 다시 확인해주세요. (영문 대문자와 숫자 6자리)'); return; }

  try{

    if(!snap.exists){ toast('없는 코드예요. 코드를 다시 확인해주세요.', 'fail'); return; }
    const inv = unfreeze(snap.data()) || {};
    if(!(Number(inv.expiresAt) > Date.now())){ toast('만료된 코드예요. 그룹 멤버에게 새 코드를 받아주세요.', 'fail'); return; }

    confirmModal(`'${inv.groupName || '이름 없는 그룹'}' 그룹에 참여할까요? 참여하면 그룹의 체크리스트와 장비를 함께 보고 고칠 수 있어요.`, '참여', ()=>joinGroup(code, inv));
  }catch(e){
    console.error('[join]', e);
    toast('코드를 확인하지 못했어요.' + (e && e.code ? ' (' + e.code + ')' : ''), 'fail');
  }finally{ _joinBusy = false; }
}

async function deleteGroup(gid){
  const g = groupById(gid);
  if(!g || !isGroupOwner(g)) return;
  if(state.space===gid) selectSpace('me');
  toast('그룹을 삭제하는 중…');
  try{
    const gdb = groupDb(gid);
    for(const c of [...GROUP_SUBCOLLECTIONS, 'sharedReviews']){

    }
    try{
      const inv = await state.rootDb.collection('groupInvites').where('gid', '==', gid).get();
      await Promise.all(inv.docs.map(d=>state.rootDb.doc('groupInvites/' + d.id).delete()));

// 백업 JSON 보여주기: 웹이면 파일로도 내려받고, APK는 복사용 텍스트만(파일 저장이 막혀 있음)
function showExportModal(title, json, fname){
  let downloaded = false;
  if(!window.Capacitor){
    try{
      const url = URL.createObjectURL(new Blob([json], {type:'application/json'}));
      const a = document.createElement('a');
      a.href = url; a.download = fname; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(url), 3000);
      downloaded = true;
    }catch(e){}
  }
  openModal(`
    <h3>${esc(title)}</h3>
    <p style="margin:0 0 10px;color:var(--text-dim);font-size:13px;line-height:1.6;">
      ${downloaded ? `<b>${esc(fname)}</b> 파일로 저장했어요. 파일이 안 보이면 ` : ''}아래 내용을 복사해서 메모 앱이나 메신저의 나와의 대화 등에 붙여넣어 보관하세요.
    </p>
    <textarea id="backup-text" class="backup-text" readonly>${esc(json)}</textarea>
    <div class="modal-actions">
      <button class="btn" data-action="modal-close">닫기</button>
      <button class="btn btn-primary" data-action="backup-copy">${icon('save')} 복사</button>
    </div>
  `);
}
function copyBackupText(){

  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(ta.value).then(()=>toast('복사했어요.', 'ok')).catch(fallback);
  }else fallback();
}
function importBackupModal(){
  openModal(`
    <h3>백업 가져오기</h3>
    <p style="margin:0 0 10px;color:var(--text-dim);font-size:13px;line-height:1.6;">
      백업 파일을 고르거나, 복사해 둔 백업 내용을 붙여넣으세요.
      <b style="color:var(--text);">가져오면 지금 내 계정의 데이터가 백업 내용으로 모두 바뀌어요.</b>
    </p>
    <div class="field"><label>백업 파일</label><input type="file" id="backup-file" accept=".json,application/json,text/plain"></div>
    <div class="field"><label>또는 붙여넣기</label><textarea id="backup-text-in" class="backup-text" placeholder='{"app":"campbase", ...}'></textarea></div>
    <div class="modal-actions">
      <button class="btn" data-action="modal-close">취소</button>
      <button class="btn btn-danger-solid" data-action="backup-import-go">가져오기</button>
    </div>
  `);
}
function parseBackup(text){
  let data;
  try{ data = JSON.parse(text); }catch(e){ return {error:'백업 내용을 읽지 못했어요. 전체를 빠짐없이 붙여넣었는지 확인해주세요.'}; }
  if(data && data.app==='campbase-group') return {error:'그룹 백업 파일이에요. Settings → 내 그룹에서 그룹장이 가져올 수 있어요.'};
  if(!data || typeof data!=='object' || data.app!=='campbase') return {error:'캠프베이스 백업 파일이 아니에요.'};
  const arr = v => Array.isArray(v) ? v.filter(x=>x && typeof x==='object') : [];
  const withIds = (list, prefix) => list.map(x=>({...x, id: String(x.id || uid(prefix))}));
  return { data: {
    campingLogs: withIds(arr(data.campingLogs), 'c'),
    gear: withIds(arr(data.gear), 'g'),
    checklists: withIds(arr(data.checklists), 'cl').map(cl=>({...cl, items: Array.isArray(cl.items) ? cl.items : []})),
    // 일정·템플릿은 새 백업에만 있음 → 예전 백업(필드 없음)을 가져오면 지금 것을 그대로 둔다
    trips: Array.isArray(data.trips) ? withIds(arr(data.trips), 'trip') : null,
    checklistTemplates: Array.isArray(data.checklistTemplates) ? withIds(arr(data.checklistTemplates), 'tpl').map(t=>({...t, items: Array.isArray(t.items) ? t.items : []})) : null,
    cookingChecks: (data.cookingChecks && typeof data.cookingChecks==='object' && !Array.isArray(data.cookingChecks)) ? data.cookingChecks : {},
    settings: (data.settings && typeof data.settings==='object') ? data.settings : {},
  }};
}
function startImportBackup(){
  const ta = document.getElementById('backup-text-in');
  const text = ta ? ta.value.trim() : '';
  if(!text){ toast('백업 파일을 고르거나 내용을 붙여넣어 주세요.'); return; }
  const res = parseBackup(text);
  if(res.error){ toast(res.error, 'fail'); return; }
  const d = res.data;
  confirmModal(`백업 내용(캠핑 기록 ${d.campingLogs.length}개, 장비 ${d.gear.length}개, 체크리스트 ${d.checklists.length}개)으로 바꿀까요? 지금 내 계정의 데이터는 모두 이 내용으로 바뀌어요. (다른 사람의 데이터에는 영향이 없어요)`, '바꾸기', ()=>applyBackup(d));
}
function applyBackup(d){
  const cols = ['campingLogs','gear','checklists', ...['trips','checklistTemplates'].filter(c=>Array.isArray(d[c]))];
  const prev = { campingLogs: state.campingLogs, gear: state.gear, checklists: state.checklists, cookingChecks: state.cookingChecks,
    trips: state.trips, checklistTemplates: state.checklistTemplates };
  state.campingLogs = d.campingLogs; state.gear = d.gear; state.checklists = d.checklists; state.cookingChecks = d.cookingChecks;
  if(Array.isArray(d.trips)) state.trips = d.trips;
  if(Array.isArray(d.checklistTemplates)) state.checklistTemplates = d.checklistTemplates;
  const s = d.settings;
  if(s.homeWidgets && typeof s.homeWidgets==='object'){ state.homeWidgets = normalizeHomeWidgets(s.homeWidgets); }
  if(Array.isArray(s.gearCategories) && s.gearCategories.length){
    state.gearCategories = s.gearCategories.includes('기타') ? s.gearCategories.slice() : [...s.gearCategories, '기타'];
  }
  if(s.weatherLocation) state.weatherLocation = s.weatherLocation;
  if(state.dbAvailable){
    const db = state.db;
    cols.forEach(c=>{
      const keep = new Set(d[c].map(x=>x.id));
      prev[c].forEach(old=>{ if(!keep.has(old.id)) safePersist(()=>db.collection(c).doc(old.id).delete()); });
      d[c].forEach(x=>safePersist(()=>db.collection(c).doc(x.id).set(stripId(x))));
    });
    // 그룹 후기 사본도 백업의 sharedGroupIds 기준으로 다시 맞춤(없어진 기록의 사본은 삭제)
    const prevLogs = new Map(prev.campingLogs.map(x=>[x.id, x]));
    const nextLogIds = new Set(d.campingLogs.map(x=>x.id));
    prev.campingLogs.forEach(o=>{ if(!nextLogIds.has(o.id)) syncReviewCopies(o, null); });
    d.campingLogs.forEach(x=>syncReviewCopies(prevLogs.get(x.id) || null, x));
    Object.keys(prev.cookingChecks||{}).forEach(id=>{ if(!(id in d.cookingChecks)) safePersist(()=>db.collection('cookingChecks').doc(id).delete()); });
    Object.entries(d.cookingChecks).forEach(([id, v])=>safePersist(()=>db.collection('cookingChecks').doc(id).set(v)));
    persistAppSettings();
  }
  renderView();
  toast(state.dbAvailable ? '백업을 가져왔어요. 내 계정의 모든 기기에 반영돼요.' : '백업을 불러왔어요. (미리보기 모드라 저장되지는 않아요)', 'ok');
}

/* ---- 그룹 백업 (그룹장만): 그룹의 체크리스트·장비·장비 카테고리 ----
 * { app:'campbase-group', version:1, exportedAt, groupName, gearCategories, checklists, gear }
 * 가져오기는 그 그룹의 체크리스트·장비·카테고리를 백업 내용으로 교체(멤버·그룹 이름은 그대로). */
async function readGroupData(gid){
  const gdb = groupDb(gid), out = {};
  for(const c of ['checklists','gear']){
    const snap = await gdb.collection(c).get();
    out[c] = snap.docs.map(d=>({ id: d.id, ...unfreeze(d.data()) }));
  }
  return out;
}
let _groupBackupBusy = false;
async function exportGroupBackup(gid){
  const g = groupById(gid);
  if(!g || !isGroupOwner(g) || !state.dbAvailable || _groupBackupBusy) return;
  _groupBackupBusy = true;
  try{
    const d = await readGroupData(gid);
    const json = JSON.stringify({
      app:'campbase-group', version:1, exportedAt: new Date().toISOString(),
      groupName: g.name, gearCategories: g.gearCategories, checklists: d.checklists, gear: d.gear,
    }, null, 2);
    const safeName = g.name.replace(/[\\/:*?"<>|\s]+/g, '_').slice(0, 30) || 'group';
    showExportModal(`'${g.name}' 그룹 백업 내보내기`, json, 'campbase-group-' + safeName + '-' + new Date().toISOString().slice(0,10) + '.json');
  }catch(e){
    console.error('[group-backup]', e);
    toast('그룹 데이터를 불러오지 못했어요.' + (e && e.code ? ' (' + e.code + ')' : ''), 'fail');
  }finally{ _groupBackupBusy = false; }
}

function parseGroupBackup(text){
  let data;
  try{ data = JSON.parse(text); }catch(e){ return {error:'백업 내용을 읽지 못했어요. 전체를 빠짐없이 붙여넣었는지 확인해주세요.'}; }
  if(data && data.app==='campbase') return {error:'개인 백업 파일이에요. 그룹 백업 파일(campbase-group)을 골라주세요.'};
  if(!data || typeof data!=='object' || data.app!=='campbase-group') return {error:'캠프베이스 그룹 백업 파일이 아니에요.'};
  const arr = v => Array.isArray(v) ? v.filter(x=>x && typeof x==='object' && !Array.isArray(x)) : [];
  const withIds = (list, prefix) => list.map(x=>({...x, id: String(x.id || uid(prefix))}));
  let cats = Array.isArray(data.gearCategories) ? data.gearCategories.filter(c=>typeof c==='string' && c.trim()) : [];
  if(!cats.length) cats = [...DEFAULT_GEAR_CATEGORIES];
  if(!cats.includes('기타')) cats.push('기타');
  return { data: {
    groupName: typeof data.groupName==='string' ? data.groupName : '',
    gearCategories: cats,
    checklists: withIds(arr(data.checklists), 'cl').map(cl=>({...cl, items: Array.isArray(cl.items) ? cl.items : []})),

}
function startImportGroupBackup(gid){

}
async function applyGroupBackup(gid, d){
  const g = groupById(gid);
  if(!g || !isGroupOwner(g) || !state.dbAvailable) return;
  const gdb = groupDb(gid);
  try{
    const cur = await readGroupData(gid);
    for(const c of ['checklists','gear']){
      const keep = new Set(d[c].map(x=>x.id));
      cur[c].forEach(old=>{ if(!keep.has(old.id)) safePersist(()=>gdb.collection(c).doc(old.id).delete()); });
      d[c].forEach(x=>safePersist(()=>gdb.collection(c).doc(x.id).set(stripId(x))));
    }
    g.gearCategories = d.gearCategories.slice();
    safePersist(()=>state.rootDb.doc('groups/' + gid).update({ gearCategories: g.gearCategories }));
    if(state.space===gid){ state.groupChecklists = unfreeze(d.checklists); state.groupGear = unfreeze(d.gear); state.gearCategory = 'all'; }
    renderView();

  }catch(e){

function onSaveFail(e){
  console.error('[save]', e);
  if(e && e.code==='permission-denied'){ toast('저장 권한이 없어요. Firestore 규칙을 게시했는지, 아직 그 그룹 멤버인지 확인해주세요.', 'fail'); return; }
  toast('저장에 실패했어요. 다시 시도해주세요.' + (e&&e.code?' ('+e.code+')':''), 'fail');
}
// safePersist: never lets a persistence call block the caller. Any SYNCHRONOUS throw
// (e.g. from building a bad path) or ASYNC rejection is caught here and turned into a
// toast — the caller's own state update + re-render + success toast always run regardless.
function safePersist(fn){
  try{
    const p = fn();
    if(p && typeof p.catch === 'function') p.catch(onSaveFail);
  }catch(e){ onSaveFail(e); }
}

/* ============================ PIE CHART ============================ */
function pieChartSvg(segments, size){
  size = size || 120;
  const r = size/2;
  const total = segments.reduce((s,x)=>s+x.value,0);
  if(!total){
    return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}"><circle cx="${r}" cy="${r}" r="${r-1}" fill="none" stroke="var(--border)" stroke-width="2"/></svg>`;
  }
  let cum = 0;
  const parts = segments.filter(s=>s.value>0).map(seg=>{
    const startAng = cum/total*2*Math.PI - Math.PI/2;
    cum += seg.value;
    const endAng = cum/total*2*Math.PI - Math.PI/2;
    if(seg.value === total){
      return `<circle cx="${r}" cy="${r}" r="${r}" fill="${seg.color}"/>`;
    }
    const x1 = r + r*Math.cos(startAng), y1 = r + r*Math.sin(startAng);
    const x2 = r + r*Math.cos(endAng), y2 = r + r*Math.sin(endAng);
    const large = (endAng-startAng) > Math.PI ? 1 : 0;
    return `<path d="M${r},${r} L${x1.toFixed(2)},${y1.toFixed(2)} A${r},${r} 0 ${large} 1 ${x2.toFixed(2)},${y2.toFixed(2)} Z" fill="${seg.color}"/>`;
  }).join('');
  return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}">${parts}</svg>`;
}

/* ============================ 그룹 후기 공유 ============================
 * 내 개인 캠핑 기록(users/{uid}/campingLogs/{id})의 선택 필드 sharedGroupIds: [gid, ...]
 * 공유를 켠 그룹마다 사본 groups/{gid}/sharedReviews/{내uid}_{기록id} = 후기 필드 + { authorUid, sourceLogId, updatedAt }.
 * 작성·수정·삭제는 내 기록에서만(사본은 자동으로 따라감). Camping 탭의 그룹 쪽은 읽기 전용 후기 모음.
 * 그룹을 나가도 내가 올린 사본은 그룹에 남고, 내 기록의 sharedGroupIds에서 그 gid만 조용히 정리. */
const REVIEW_FIELDS = ['name','date','region','siteType','siteSize','rating','checkinTime','checkoutTime','toiletCondition','storeCondition','notes','tripRef'];
const CAMP_VIEW_KEY_PREFIX = 'campbase.campView.';
state.campView = 'me';             // Camping 탭 보기: 'me'(내 기록) 또는 그룹 id (Checklist·Gear의 공간 전환과 따로, 기기에 기억)
state.groupReviews = [];           // 보고 있는 그룹의 후기 사본
state.groupsServerLoaded = false;  // 그룹 목록을 서버에서 한 번 받았는지(캐시만 보고 공유 정리를 하지 않으려고)
let _campShare = new Set(), _reviewUnsub = null, _reviewGen = 0, _pendingCampView = null;

function memberGids(ids){ return (Array.isArray(ids) ? ids : []).filter(g=>state.groups.some(x=>x.id===g)); }
function sharedGroupNames(log){ return memberGids(log && log.sharedGroupIds).map(g=>groupById(g).name); }
function reviewCopyId(logId){ return state.user.uid + '_' + logId; }
function reviewCopyData(log){
  const out = {};
  REVIEW_FIELDS.forEach(k=>{ if(log[k]!==undefined) out[k] = unfreeze(log[k]); });
  return { ...out, authorUid: state.user.uid, sourceLogId: log.id, updatedAt: new Date().toISOString() };
}
function persistReviewCopy(gid, log){ if(!state.dbAvailable || !state.user) return; const data = reviewCopyData(log); safePersist(()=>groupDb(gid).collection('sharedReviews').doc(reviewCopyId(log.id)).set(data)); }
function deleteReviewCopyRemote(gid, logId){ if(!state.dbAvailable || !state.user) return; safePersist(()=>groupDb(gid).collection('sharedReviews').doc(reviewCopyId(logId)).delete()); }
// 기록이 바뀌면(prev → next, 없으면 null) 공유 중인 그룹의 사본을 맞춘다: 켠 그룹은 저장(갱신), 끈 그룹은 삭제
function syncReviewCopies(prev, next){
  if(!state.dbAvailable || !state.user) return;
  const before = new Set(memberGids(prev && prev.sharedGroupIds));
  const after = new Set(memberGids(next && next.sharedGroupIds));
  const logId = (next || prev).id;
  before.forEach(g=>{ if(!after.has(g)) deleteReviewCopyRemote(g, logId); });
  after.forEach(g=>persistReviewCopy(g, next));
}
// 이미 없어진 그룹(삭제됨·내가 나감)의 gid는 내 기록에서 조용히 지움(그룹에 남은 사본은 그대로)
function cleanupSharedGroupIds(){
  if(!state.dbAvailable || !state.groupsServerLoaded || !state.campingLogsLoaded) return;
  state.campingLogs.forEach(c=>{
    if(!Array.isArray(c.sharedGroupIds)) return;
    const keep = memberGids(c.sharedGroupIds);
    if(keep.length !== c.sharedGroupIds.length){ c.sharedGroupIds = keep; persistCamping(c); }
  });
}

/* ---- Camping 탭 보기 전환: [내 기록 | 그룹A 후기 | …] ---- */
function loadSavedCampView(uid){ try{ return localStorage.getItem(CAMP_VIEW_KEY_PREFIX + uid) || 'me'; }catch(e){ return 'me'; } }
function saveCampView(){ if(!state.user) return; try{ localStorage.setItem(CAMP_VIEW_KEY_PREFIX + state.user.uid, state.campView); }catch(e){} }
function syncCampView(fromCache){
  if(_pendingCampView && state.groups.some(g=>g.id===_pendingCampView)){ const v = _pendingCampView; _pendingCampView = null; selectCampView(v, true); return; }
  if(!fromCache) _pendingCampView = null;
  if(state.campView!=='me' && !state.groups.some(g=>g.id===state.campView)) selectCampView('me', true);
}
function selectCampView(view, quiet){
  if(view!=='me' && !state.groups.some(g=>g.id===view)) view = 'me';
  if(!quiet) _pendingCampView = null;
  const changed = view !== state.campView;
  stopReviewData();
  state.campView = view;
  saveCampView();
  if(changed){ state.groupReviewFilter = 'all'; }
  if(view!=='me') startReviewData(view);
  if(state.currentView==='camping') renderView();
}
function stopReviewData(){
  _reviewGen++;
  if(_reviewUnsub){ try{ _reviewUnsub(); }catch(e){} }
  _reviewUnsub = null;
  state.groupReviews = [];
}
function startReviewData(gid){
  if(!_fb) return;
  const gen = _reviewGen;
  _reviewUnsub = groupDb(gid).collection('sharedReviews').onSnapshot(snap=>{
    if(gen !== _reviewGen) return;
    state.groupReviews = snap.docs.map(d=>({ id: d.id, ...unfreeze(d.data()) }));
    if(state.currentView==='camping') renderView();
    refreshReviewModal();
  }, e=>{
    if(gen !== _reviewGen) return;
    if(e && e.code==='permission-denied') selectCampView('me', true);
    else reportDbError(e);
  });
}
function campViewChipsHtml(){
  if(!state.user || !state.groups.length) return '';
  const chips = [{ id:'me', label:'내 기록' }, ...state.groups.map(g=>({ id:g.id, label: g.name + ' 후기' }))];
  return `<div class="space-bar"><div class="seg-group camp-view-chips">
    ${chips.map(c=>`<div class="seg-btn camp-view-chip ${c.id===state.campView?'active':''}" data-action="camp-view" data-view="${esc(c.id)}">${c.id==='me'?icon('home'):icon('users')} ${esc(c.label)}</div>`).join('')}
  </div></div>`;
}

/* ---- 그룹 후기 모음(읽기 전용): 캠핑장별로 묶음(이름 공백·대소문자 무시) ---- */
function modeOf(values){
  const n = {}; let best = '', bn = 0;
  values.filter(Boolean).forEach(v=>{ n[v] = (n[v]||0) + 1; if(n[v] > bn){ best = v; bn = n[v]; } });
  return best;
}
// 묶을 때만 normName으로 정규화하고, 보여줄 이름은 그 묶음에서 가장 많이 쓰인 원래 이름(같으면 최근 것). rs는 최근 순.
function displayNameOf(rs){
  const count = {}, firstAt = {};
  rs.forEach((r, i)=>{ const n = String(r.name || '').trim(); if(!n) return; count[n] = (count[n] || 0) + 1; if(!(n in firstAt)) firstAt[n] = i; });
  return Object.keys(count).sort((a,b)=> count[b] - count[a] || firstAt[a] - firstAt[b])[0] || '';
}
function groupReviewCards(reviews){
  const by = {};
  reviews.forEach(r=>{ const k = normName(r.name) || '-'; (by[k] = by[k] || []).push(r); });
  return Object.entries(by).map(([key, rs])=>{
    rs = [...rs].sort((a,b)=> String(b.date||'').localeCompare(String(a.date||'')));
    const rated = rs.filter(r=>Number(r.rating) > 0);
    return {
      key, name: displayNameOf(rs) || '이름 없음', region: (rs.find(r=>r.region && String(r.region).trim()) || {}).region || '',
      reviews: rs, count: rs.length,
      avg: rated.length ? rated.reduce((s,r)=>s + Number(r.rating), 0) / rated.length : 0,
      latest: (rs.find(r=>r.date) || {}).date || '',
      authors: [...new Set(rs.map(r=>r.authorUid).filter(Boolean))],
      toilet: modeOf(rs.map(r=>r.toiletCondition)), store: modeOf(rs.map(r=>r.storeCondition)),
    };
  });
}
const GROUP_REVIEW_SORTS = [ {key:'date_desc', label:'최신순'}, {key:'rating_desc', label:'평점 높은순'}, {key:'rating_asc', label:'평점 낮은순'} ];
function groupCardComparator(key){
  const byLatest = (a,b)=> String(b.latest).localeCompare(String(a.latest)) || a.name.localeCompare(b.name, 'ko');
  if(key==='rating_desc') return (a,b)=> (b.avg - a.avg) || byLatest(a,b);
  if(key==='rating_asc') return (a,b)=> (a.avg - b.avg) || byLatest(a,b);
  return byLatest;
}
function fmtAvg(v){ return v ? (Math.round(v * 10) / 10).toFixed(1) : '-'; }
function renderGroupReviews(g){
  const cards = groupReviewCards(state.groupReviews);
  const filter = state.groupReviewFilter || 'all';
  const sortKey = GROUP_REVIEW_SORTS.some(o=>o.key===state.groupReviewSort) ? state.groupReviewSort : 'date_desc';
  const byRegion = {};
  cards.forEach(c=>{ const r = regionOf(c); byRegion[r] = (byRegion[r]||0) + 1; });
  const regions = Object.keys(byRegion).sort((a,b)=> byRegion[b]-byRegion[a] || a.localeCompare(b,'ko'));
  const shown = cards.filter(c=> filter==='all' || regionOf(c)===filter).sort(groupCardComparator(sortKey));
  return `
    <div class="section-head">
      <div><h1>${esc(g.name)} 후기</h1><div class="section-desc">멤버들이 공유한 캠핑장 후기 모음이에요(읽기 전용). 내 후기는 내 기록에서 "그룹에 공유"를 켜면 올라가요.</div></div>
    </div>
    <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px;flex-wrap:wrap;">
      <div class="seg-group" style="flex:1;">
        ${['all', ...regions].map(r=>`<div class="seg-btn ${r===filter?'active':''}" data-action="group-review-filter" data-cat="${esc(r)}">${r==='all'?'전체':esc(r)}${r!=='all'?` <span class="num" style="opacity:.65;">${byRegion[r]}</span>`:''}</div>`).join('')}
      </div>
      <select data-action="group-review-sort" style="padding:7px 9px;border:1px solid var(--border);border-radius:8px;background:var(--bg);font-size:12.5px;flex:none;">
        ${GROUP_REVIEW_SORTS.map(o=>`<option value="${o.key}" ${o.key===sortKey?'selected':''}>${esc(o.label)}</option>`).join('')}
      </select>
    </div>
    ${shown.length ? `<div class="grid review-grid">${shown.map(c=>`
      <div class="card review-card" data-action="review-open" data-key="${esc(c.key)}">
        <div class="camp-line1"><span class="name">${esc(c.name)}</span><span class="review-avg" aria-label="평균 평점 ${fmtAvg(c.avg)}"><span class="review-star">★</span> <span class="num">${fmtAvg(c.avg)}</span></span></div>
        <div class="meta">${[c.region ? esc(c.region) : '', c.latest ? '최근 방문 ' + esc(c.latest) : ''].filter(Boolean).join(' · ')}</div>
        <div class="review-summary">
          <span class="tag">후기 ${c.count}개</span>
          ${c.toilet ? `<span class="tag">화장실 ${esc(c.toilet)}</span>` : ''}
          ${c.store ? `<span class="tag">매점 ${esc(c.store)}</span>` : ''}
          <span class="review-authors">${c.authors.map(u=>`<span title="${esc(memberName(g,u))}">${memberAvatarHtml(g,u)}</span>`).join('')}</span>
        </div>
      </div>`).join('')}</div>`
      : `<div class="card empty">${cards.length ? '이 지역의 후기가 없어요.' : '아직 공유된 후기가 없어요. 내 기록을 수정해서 "그룹에 공유"를 켜보세요.'}</div>`}
  `;
}

// 그룹장: 부적절한 후기를 그룹에서 내리기(작성자의 개인 기록은 그대로)
function removeReviewConfirm(rid){
  const g = groupById(state.campView);
  const r = state.groupReviews.find(x=>x.id===rid);
  if(!g || !r || !isGroupOwner(g)) return;
  confirmModal(`${memberName(g, r.authorUid)} 님의 '${r.name || '후기'}' 후기를 '${g.name}' 그룹에서 내릴까요? 작성자의 개인 기록은 그대로 남고, 그룹에서는 되돌릴 수 없어요.`, '그룹에서 내리기', ()=>{
    _reviewModalKey = null;
    state.groupReviews = state.groupReviews.filter(x=>x.id!==rid);
    if(state.dbAvailable){ const db = groupDb(g.id); safePersist(()=>db.collection('sharedReviews').doc(rid).delete()); }
    renderView(); toast('그룹에서 후기를 내렸어요.');
  });
}
// 3-7 캠핑 기록·그룹 후기 줄: 1줄 이름 + 오른쪽 별점, 2줄 날짜 · 지역, 3줄 태그와 후기 요약
function starsHtml(r){
  r = Math.max(0, Math.min(5, Math.round(Number(r) || 0)));
  if(!r) return '';
  return `<span class="stars" role="img" aria-label="평점 ${r}/5">${'★'.repeat(r)}<span class="stars-off">${'☆'.repeat(5 - r)}</span></span>`;
}
function campSummary(c){
  if(c.notes) return c.notes;
  return [ (c.checkinTime||c.checkoutTime) ? ('입/퇴실 ' + (c.checkinTime||'?') + '~' + (c.checkoutTime||'?')) : '',
    c.toiletCondition ? ('화장실 ' + c.toiletCondition) : '', c.storeCondition ? ('매점 ' + c.storeCondition) : '' ].filter(Boolean).join(' · ');
}
// 3-6 별점 입력: 별 5개를 눌러 선택(같은 별을 다시 누르면 0), 키보드는 radiogroup(←→↑↓·Home·End). 값은 숨은 #cf-rating에.
function starInputHtml(v){
  v = Math.max(0, Math.min(5, Math.round(Number(v) || 0)));
  return `<input type="hidden" id="cf-rating" value="${v}">
    <div class="star-input" id="cf-stars" role="radiogroup" aria-labelledby="cf-rating-label">
      ${[1,2,3,4,5].map(n=>`<button type="button" role="radio" class="star-btn ${n<=v?'on':''}" aria-checked="${n===v}" aria-label="${n}점" data-action="cf-star" data-val="${n}" tabindex="${(v ? n===v : n===1) ? 0 : -1}">${n<=v ? '★' : '☆'}</button>`).join('')}
      <span class="star-text" aria-hidden="true">${v ? v + '점' : '평점 없음'}</span>
    </div>`;
}
function setStarValue(v, focus){
  const box = document.getElementById('cf-stars'), input = document.getElementById('cf-rating');
  if(!box || !input) return;
  v = Math.max(0, Math.min(5, v));
  input.value = String(v);
  box.querySelectorAll('.star-btn').forEach(b=>{
    const n = Number(b.getAttribute('data-val'));
    b.classList.toggle('on', n <= v);
    b.textContent = n <= v ? '★' : '☆';
    b.setAttribute('aria-checked', String(n === v));
    b.tabIndex = (v ? n === v : n === 1) ? 0 : -1;
  });
  box.querySelector('.star-text').textContent = v ? v + '점' : '평점 없음';
  if(focus){ const t = box.querySelector(`.star-btn[data-val="${v || 1}"]`); if(t) t.focus(); }
}

  // 수정할 때는 폼에 없는 필드(tripRef 등)를 그대로 둠
  const prev = id ? (state.campingLogs.find(x=>x.id===id) || {}) : {};
  const item = {
    ...prev,
    id: id || uid('c'),
    name,
    date: document.getElementById('cf-date').value || '',
    region: document.getElementById('cf-region').value.trim(),
    siteType: document.getElementById('cf-sitetype-val').value || SITE_TYPES[0],
    siteSize: document.getElementById('cf-size').value.trim(),
    rating: Number(document.getElementById('cf-rating').value)||0,
    checkinTime: document.getElementById('cf-checkin').value || '',
    checkoutTime: document.getElementById('cf-checkout').value || '',
    toiletCondition: document.getElementById('cf-toilet-val').value || '',
    storeCondition: document.getElementById('cf-store-val').value || '',
    notes: document.getElementById('cf-notes').value.trim(),
  };
  const fromTrip = !id && _campTripRef;
  if(fromTrip) item.tripRef = { space: _campTripRef.space, tripId: _campTripRef.tripId };
  _campTripRef = null;
  const share = memberGids([..._campShare]);
  if(share.length || Array.isArray(prev.sharedGroupIds)) item.sharedGroupIds = share;
  const prevLog = id ? (state.campingLogs.find(x=>x.id===id) || null) : null;
  if(id){ state.campingLogs = state.campingLogs.map(c=>c.id===id?item:c); }
  else{ state.campingLogs.push(item); }
  persistCamping(item);
  syncReviewCopies(prevLog, item);   // 공유 중인 그룹 사본 갱신·추가, 끈 그룹 사본 삭제
  closeModal(); renderView(); toast(fromTrip ? '후기를 내 캠핑 기록에 저장했어요.' : '저장했어요.');
}

/* ============================ GEAR ============================ */
function renderGear(){
  const filter = state.gearCategory || 'all';
  const gearCats = ['all', ...SP.gearCategories];
  const gearCatLabels = {all:'전체'};
  const byCat = {};
  SP.gear.forEach(g=>{ byCat[g.category]=(byCat[g.category]||0)+1; });
  const grp = currentGroup();
  // 그룹 공간: 주인(누구 장비인지)으로 거르기. 'all' | 'none'(공용) | uid
  const ownerFilter = grp ? (state.gearOwnerFilter || 'all') : 'all';
  const byOwner = {};
  if(grp) SP.gear.forEach(g=>{ const k = g.ownerUid || 'none'; byOwner[k] = (byOwner[k]||0) + 1; });
  const filtered = SP.gear.filter(g=> (filter==='all' || g.category===filter)
    && (ownerFilter==='all' || (ownerFilter==='none' ? !g.ownerUid : g.ownerUid===ownerFilter)));
  // 3-3: 개수가 0인 카테고리 칩은 숨김(선택 중인 칩은 예외), 주인 필터 줄은 주인 있는 장비가 있을 때만
  const shownCats = gearCats.filter(c=> c==='all' || c===filter || (byCat[c]||0) > 0);
  const showOwnerRow = !!grp && (SP.gear.some(g=>g.ownerUid) || ownerFilter!=='all');
  const selecting = state.gearSelecting;
  const sel = state.gearSelected;
  const ownerChips = grp ? [
    {key:'all', label:'모든 주인'},
    ...sortedMemberUids(grp).map(u=>({key:u, label:memberName(grp,u), n:byOwner[u]||0, avatar:true})),
    ...Object.keys(byOwner).filter(k=>k!=='none' && !grp.memberUids.includes(k)).map(u=>({key:u, label:memberName(grp,u), n:byOwner[u]})),
    {key:'none', label:'공용(주인 없음)', n:byOwner.none||0},
  ] : [];
  return `
    ${spaceChipsHtml()}
    <div class="section-head">
      <div><h1>${grp ? esc(grp.name) + ' 장비' : '내 장비'}</h1><div class="section-desc">${grp ? '그룹 멤버 모두가 함께 보고 고치는 장비 목록이에요.' : '보유 장비를 카테고리별로 등록하고 한눈에 확인하세요.'}</div></div>
      <div class="gear-head-actions">
        ${SP.gear.length ? `<button class="btn ${selecting?'active-toggle':''}" data-action="gear-select" aria-pressed="${selecting}">${icon('check')} ${selecting ? '선택 끝' : '선택'}</button>` : ''}
        <button class="btn btn-accent" data-action="gear-new">${icon('plus')} 장비 추가</button>
        ${moreMenuHtml('gear-head', [{ action:'gear-cat-manage', attrs:{}, icon:'edit', label:'카테고리 관리' }], '장비 메뉴')}
      </div>
    </div>
    <div class="seg-group gear-cat-row">
      ${shownCats.map(c=>`<div class="seg-btn ${c===filter?'active':''}" data-action="gear-filter" data-cat="${esc(c)}">${esc(gearCatLabels[c]||c)}${c!=='all'?` <span class="num" style="opacity:.65;">${byCat[c]||0}</span>`:''}</div>`).join('')}
    </div>
    ${showOwnerRow ? `<div class="seg-group owner-filter" style="margin:-6px 0 16px;">
      ${ownerChips.map(c=>`<div class="seg-btn ${c.key===ownerFilter?'active':''}" data-action="gear-owner-filter" data-owner="${esc(c.key)}">${c.avatar?memberAvatarHtml(grp,c.key):''}${esc(c.label)}${c.n!==undefined?` <span class="num" style="opacity:.65;">${c.n}</span>`:''}</div>`).join('')}
    </div>` : ''}
    <div class="card">
      ${filtered.length ? filtered.map(g=>`
        <div class="list-row gear-row ${selecting && sel.has(g.id) ? 'picked' : ''}" ${selecting ? `data-action="gear-pick" data-id="${esc(g.id)}" role="checkbox" aria-checked="${sel.has(g.id)}" tabindex="0"` : ''}>
          ${selecting ? `<span class="pick-box" aria-hidden="true">${sel.has(g.id) ? icon('check') : ''}</span>` : ''}
          <div style="flex:1;min-width:0;">
            <div class="name">${esc(g.name)}${grp && g.ownerUid ? ` <span class="owner-tag">${memberAvatarHtml(grp, g.ownerUid)}${esc(memberName(grp, g.ownerUid))}</span>` : ''}</div>
            <div class="meta">${esc(g.brand||'')} · ${esc(g.category)}${g.price?' · '+Number(g.price).toLocaleString()+'원':''}${g.weight?' · '+g.weight+'kg':''}${g.date?' · '+esc(g.date):''}${grp && g.addedBy ? ' · ' + esc(memberName(grp, g.addedBy)) + ' 추가' : ''}</div>
          </div>
          ${selecting ? '' : `<div class="row-actions">
            <button class="icon-btn" data-action="gear-edit" data-id="${g.id}" title="수정" aria-label="'${esc(g.name)}' 수정">${icon('edit')}</button>
            ${moreMenuHtml('gear:' + g.id, [
              { action:'gear-del', attrs:{'data-id':g.id}, icon:'trash', label:'장비 삭제', danger:true },
            ], `'${g.name}' 장비 메뉴`)}
          </div>`}
        </div>
      `).join('') : `<div class="empty">${filter==='all' && ownerFilter==='all' ? '등록된 장비가 없어요.' : '이 조건에 맞는 장비가 없어요.'}</div>`}
    </div>
    ${selecting ? `
    <div class="select-bar" role="toolbar" aria-label="선택한 장비로 할 일">
      <span class="select-count" aria-live="polite"><b class="num">${sel.size}</b>개 선택</span>
      ${!grp && state.groups.length ? `<button class="btn btn-sm" data-action="gear-send" ${sel.size ? '' : 'disabled'}>${icon('send')} 그룹으로 보내기</button>` : ''}
      <button class="btn btn-sm btn-primary" data-action="gear-to-checklist" ${sel.size ? '' : 'disabled'}>${icon('checklist')} 체크리스트에 추가</button>
      <button class="btn btn-sm btn-ghost" data-action="gear-select-cancel">취소</button>
    </div>` : ''}
  `;
}
// 3-3 장비 선택 모드: "선택" → 줄을 눌러 고르고, 아래 액션 바(선택 개수·그룹으로 보내기·체크리스트에 추가·취소)
function setGearSelecting(on){
  state.gearSelecting = !!on;
  state.gearSelected = new Set();
  document.body.classList.toggle('gear-selecting', !!on && state.currentView==='gear');
}
function toggleGearPick(id){
  if(!state.gearSelecting) return;
  if(state.gearSelected.has(id)) state.gearSelected.delete(id); else state.gearSelected.add(id);
  renderView();
  const row = document.querySelector(`.gear-row[data-id="${CSS.escape(id)}"]`);
  if(row) row.focus({ preventScroll: true });
}
function gearFormModal(id){
  const g = id ? SP.gear.find(x=>x.id===id) : null;
  const grp = currentGroup();
  openModal(`
    <h3>${g?'장비 수정':'장비 추가'}</h3>
    <div class="field"><label>이름</label><input id="gf-name" value="${g?esc(g.name):''}" placeholder="예: 스텔스 5 텐트"></div>
    <div class="field-row">
      <div class="field"><label>브랜드</label>
        <select id="gf-brand">${GEAR_BRANDS.map(b=>`<option ${g&&g.brand===b?'selected':''}>${b}</option>`).join('')}</select>
      </div>
      <div class="field"><label>카테고리</label>
        <select id="gf-category">${SP.gearCategories.map(c=>`<option ${g&&g.category===c?'selected':''}>${c}</option>`).join('')}</select>
