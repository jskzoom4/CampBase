<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>캠프베이스</title>
<meta name="theme-color" content="#2f6f4f">
<meta name="description" content="캠핑 준비물·장비·후기를 내 계정에 기록하는 캠핑 노트">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="캠프베이스">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --brand:#2f6f4f; --brand-dark:#1f4d36; --accent:#d98e2f; --good:#2f9e5e; --warn:#c98a2c; --bad:#c1503f;
    --bg:#f7f6f2; --surface:#ffffff; --surface-2:#f0eee7; --border:#e4e1d8; --text:#1f2420; --text-dim:#6b6f68;
    --radius:14px;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#141815; --surface:#1c211d; --surface-2:#232821; --border:#333a32; --text:#eceae3; --text-dim:#9aa199;
      --brand:#4d9b74; --brand-dark:#3a7f5c; --accent:#e3a54f;
    }
  }
  :root[data-theme="dark"]{
    --bg:#141815; --surface:#1c211d; --surface-2:#232821; --border:#333a32; --text:#eceae3; --text-dim:#9aa199;
    --brand:#4d9b74; --brand-dark:#3a7f5c; --accent:#e3a54f;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:"Work Sans","Apple SD Gothic Neo","Malgun Gothic",sans-serif;}
  .disp{font-family:"Fraunces",serif;}
  .num{font-family:"JetBrains Mono",monospace;}
  button, input, select, textarea{font-family:inherit;color:inherit;}
  #app{display:flex;height:100vh;overflow:hidden;}

  /* ---- sidebar ---- */
  #sidebar{width:216px;min-width:216px;background:var(--surface);border-right:1px solid var(--border);
    display:flex;flex-direction:column;padding:16px 12px;}
  .brand{display:flex;align-items:center;gap:9px;padding:6px 8px 18px;}
  .brand-badge{width:30px;height:30px;border-radius:9px;background:var(--brand);color:#fff;
    display:flex;align-items:center;justify-content:center;flex:none;}
  .brand-badge svg{width:18px;height:18px;}
  .brand-name{font-family:"Fraunces",serif;font-weight:700;font-size:16px;}
  .brand-sub{font-size:10.5px;color:var(--text-dim);}
  nav#nav{display:flex;flex-direction:column;gap:2px;}
  .nav-item{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:9px;
    color:var(--text-dim);cursor:pointer;border:1px solid transparent;font-size:14px;font-weight:500;
    transition:background .12s ease,color .12s ease;}
  .nav-item svg{width:18px;height:18px;flex:none;}
  .nav-item:hover{background:var(--surface-2);color:var(--text);}
  .nav-item.active{background:var(--brand);color:#fff;}
  .nav-spacer{flex:1;}
  .nav-foot{font-size:11px;color:var(--text-dim);padding:10px 10px 2px;line-height:1.5;}
  .dot-status{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--good);margin-right:5px;position:relative;top:-1px;}
  .dot-status.local{background:var(--warn);}
  .dot-status.err{background:var(--bad);}

  /* ---- main ---- */
  #main-wrap{flex:1;min-width:0;display:flex;flex-direction:column;}
  #topbar{display:flex;align-items:center;gap:14px;padding:16px 26px;border-bottom:1px solid var(--border);
    background:var(--bg);position:sticky;top:0;z-index:5;}
  #topbar h2{margin:0;font-size:21px;}
  #main{flex:1;overflow-y:auto;padding:22px 26px 60px;}
  .section-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:16px;flex-wrap:wrap;}
  .section-head h1{font-size:20px;margin:0 0 4px;}
  .section-desc{font-size:12.5px;color:var(--text-dim);margin:0;line-height:1.5;}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;}
  .grid{display:grid;gap:14px;}
  .empty{color:var(--text-dim);font-size:13px;padding:18px 4px;text-align:center;}

  .btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--surface);
    color:var(--text);border-radius:9px;padding:8px 13px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;}
  .btn svg{width:15px;height:15px;}
  .btn:hover{background:var(--surface-2);}
  .btn-accent{background:var(--accent);border-color:var(--accent);color:#fff;}
  .btn-primary{background:var(--brand);border-color:var(--brand);color:#fff;}
  .btn-ghost{background:transparent;}
  .btn-sm{padding:6px 10px;font-size:12px;}
  .btn-danger{color:var(--bad);}
  .btn-danger-solid{background:var(--bad);border-color:var(--bad);color:#fff;}
  .btn-danger-solid:hover{opacity:.9;}

  .tag{display:inline-block;background:var(--surface-2);color:var(--text-dim);border-radius:6px;padding:2px 8px;font-size:11px;font-weight:600;}
  .tag.accent{background:color-mix(in srgb, var(--accent) 20%, transparent);color:var(--accent);}

  /* ---- home ---- */
  .weather-widget{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg, color-mix(in srgb, var(--brand) 14%, transparent), transparent);
    border:1px solid var(--border);border-radius:var(--radius);padding:14px 18px;margin-bottom:18px;flex-wrap:wrap;}
  .weather-widget .temp{font-family:"Fraunces",serif;font-size:32px;font-weight:600;}
  .weather-widget .loc{font-weight:700;font-size:14px;}
  .weather-widget .desc{font-size:12px;color:var(--text-dim);}
  .weather-widget .spacer{flex:1;}
  .stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:6px;}
  .stat-card{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;}
  .stat-card h3{margin:0;font-size:13.5px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:3px;}
  .stat-card .legend{display:flex;flex-direction:column;gap:3px;width:100%;font-size:11.5px;color:var(--text-dim);}
  .legend-row{display:flex;align-items:center;gap:6px;}
  .legend-dot{width:8px;height:8px;border-radius:50%;flex:none;}
  .legend-row .lv{flex:1;text-align:left;}
  .stat-card .big-num{font-family:"JetBrains Mono",monospace;font-size:22px;font-weight:700;}
  .home-cat-link{cursor:pointer;border-radius:6px;transition:background .12s ease;}
  .legend-row.home-cat-link{padding:3px 4px;margin:0 -4px;}
  .home-cat-link:hover{background:var(--surface-2);color:var(--brand);}
  .chev-mini{width:12px!important;height:12px!important;opacity:.6;}

  /* ---- forms/modal ---- */
  .modal-backdrop{position:fixed;inset:0;background:rgba(20,24,20,.5);display:flex;align-items:center;justify-content:center;
    padding:20px;z-index:50;}
  .modal{background:var(--surface);border-radius:16px;padding:22px;width:100%;max-width:440px;max-height:88vh;overflow-y:auto;
    box-shadow:0 20px 60px rgba(0,0,0,.3);}
  .modal h3{margin:0 0 14px;font-size:17px;}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:12px;font-weight:600;color:var(--text-dim);margin-bottom:5px;}
  .field input, .field select, .field textarea{width:100%;padding:9px 10px;border:1px solid var(--border);
    border-radius:9px;background:var(--bg);font-size:13.5px;}
  .field textarea{resize:vertical;min-height:64px;}
  .field-row{display:flex;gap:10px;}
  .field-row .field{flex:1;}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;}
  .seg-group{display:flex;gap:6px;flex-wrap:wrap;}
  .seg-btn{padding:7px 12px;border-radius:8px;border:1px solid var(--border);background:var(--bg);font-size:12.5px;cursor:pointer;}
  .seg-btn.active{background:var(--brand);border-color:var(--brand);color:#fff;}
  .form-subhead{font-size:12px;font-weight:700;color:var(--text-dim);margin:16px 0 8px;padding-top:12px;border-top:1px solid var(--border);}

  /* ---- lists ---- */
  .list-row{display:flex;align-items:flex-start;gap:10px;padding:12px 4px;border-bottom:1px solid var(--border);}
  .list-row:last-child{border-bottom:none;}
  .list-row .name{font-weight:700;font-size:14px;}
  .list-row .meta{font-size:12px;color:var(--text-dim);margin-top:2px;}
  .list-row .notes{font-size:12.5px;color:var(--text-dim);margin-top:4px;line-height:1.5;}
  .list-row .row-actions{display:flex;gap:6px;flex:none;}
  .icon-btn{background:none;border:none;padding:4px;cursor:pointer;color:var(--text-dim);border-radius:6px;}
  .icon-btn:hover{background:var(--surface-2);color:var(--text);}
  .icon-btn svg{width:16px;height:16px;}

  .banner{display:flex;align-items:flex-start;gap:10px;background:var(--surface-2);border:1px solid var(--border);
    border-radius:10px;padding:10px 12px;font-size:12.5px;color:var(--text-dim);margin-bottom:14px;}
  .banner svg{width:16px;height:16px;flex:none;margin-top:1px;}

  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(10px);background:var(--text);
    color:var(--bg);padding:10px 16px;border-radius:9px;font-size:13px;opacity:0;pointer-events:none;
    transition:opacity .18s ease, transform .18s ease;z-index:80;border-left:3px solid transparent;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .toast.fail{border-left-color:var(--bad);}
  .toast.ok{border-left-color:var(--good);}

  .switch{position:relative;display:inline-block;width:40px;height:23px;flex:none;}
  .switch input{opacity:0;width:0;height:0;}
  .switch .slider{position:absolute;inset:0;cursor:pointer;background:var(--border);border-radius:23px;transition:.15s ease;}
  .switch .slider:before{position:absolute;content:"";height:17px;width:17px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.15s ease;}
  .switch input:checked + .slider{background:var(--brand);}
  .switch input:checked + .slider:before{transform:translateX(17px);}

  .checklist-group{margin-bottom:18px;}
  .checklist-group h3{font-family:"Fraunces",serif;font-size:16.5px;font-weight:700;margin:0 0 10px;display:flex;align-items:center;gap:8px;}
  .cl-subgroup{margin-bottom:10px;padding-left:14px;border-left:2px solid var(--border);}
  .cl-subgroup:last-child{margin-bottom:0;}
  .cl-subgroup-head{display:flex;align-items:center;gap:2px;padding:5px 2px 6px;border-bottom:1px dashed var(--border);margin-bottom:2px;}
  .cl-subgroup-head .spacer{flex:1;}
  .cl-subgroup-name{font-size:11.5px;font-weight:700;color:var(--text-dim);letter-spacing:.3px;text-transform:uppercase;}
  .check-row{display:flex;align-items:center;gap:9px;padding:8px 2px;border-bottom:1px solid var(--border);}
  .check-row:last-child{border-bottom:none;}
  .check-row .label{flex:1;font-size:13.5px;}
  .check-row .label.done{text-decoration:line-through;color:var(--text-dim);}
  .check-row .label.skip{color:var(--text-dim);font-style:italic;}
  .cl-status-group{display:flex;gap:4px;flex:none;}
  .cl-status-btn{width:26px;height:26px;border-radius:7px;border:1px solid var(--border);background:var(--bg);
    display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-dim);padding:0;}
  .cl-status-btn svg{width:14px;height:14px;}
  .cl-status-btn:hover{background:var(--surface-2);}
  .cl-status-btn.packed.active{background:var(--good);border-color:var(--good);color:#fff;}
  .cl-status-btn.skip.active{background:var(--text-dim);border-color:var(--text-dim);color:#fff;}
  .tag.done-tag{background:color-mix(in srgb, var(--good) 20%, transparent);color:var(--good);}
  .tag.skip-tag{margin-left:6px;}

  .placeholder-card{text-align:center;padding:48px 20px;}
  .placeholder-card svg{width:44px;height:44px;color:var(--text-dim);margin-bottom:12px;}
  .placeholder-card h2{margin:0 0 8px;}
  .placeholder-card p{color:var(--text-dim);font-size:13.5px;max-width:440px;margin:0 auto;line-height:1.6;}
  .placeholder-card-sm{text-align:center;padding:22px 14px;cursor:pointer;}
  .placeholder-icon-sm{width:26px;height:26px;color:var(--text-dim);margin-bottom:8px;}

  #mobile-topbar{display:none;}
  @media (max-width:820px){
    #sidebar{display:none;}
    #mobile-topbar{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;background:var(--surface);
      border-bottom:1px solid var(--border);}
    .mnav-item{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:var(--text-dim);
      padding:6px 12px;border-radius:10px;flex:none;cursor:pointer;}
    .mnav-item.active{background:var(--brand);color:#fff;}
    .mnav-item svg{width:17px;height:17px;}
    #topbar{padding:12px 16px;}
    #main{padding:16px 14px 60px;}
    .stat-grid{grid-template-columns:1fr;}
    .field-row{flex-direction:column;}
  }
  /* ---- 공유 앱(웹/APK) 전용 ---- */
  #db-status-top{display:none;margin-left:auto;align-items:center;font-size:11px;color:var(--text-dim);
    background:var(--surface-2);border:1px solid var(--border);border-radius:999px;padding:4px 10px;white-space:nowrap;}
  @media (max-width:820px){ #db-status-top{display:inline-flex;} }
  .preview-banner{background:color-mix(in srgb, var(--warn) 16%, transparent);border:1px solid color-mix(in srgb, var(--warn) 45%, transparent);
    color:var(--text);border-radius:10px;padding:10px 12px;font-size:12.5px;line-height:1.5;margin-bottom:14px;}
  .backup-text{width:100%;min-height:160px;font-family:"JetBrains Mono",monospace;font-size:11.5px;padding:9px 10px;
    border:1px solid var(--border);border-radius:9px;background:var(--bg);color:var(--text);resize:vertical;}
  html,body{height:100%;}
  #app{height:100vh;height:100dvh;}
  /* ---- 로그인 화면 / 내 계정 ---- */
  body.signed-out #app{display:none;}
  #login-screen{display:none;}
  body.signed-out #login-screen{display:flex;min-height:100vh;min-height:100dvh;align-items:center;justify-content:center;padding:24px 16px;}
  .login-card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:30px 24px;width:100%;max-width:380px;text-align:center;
    box-shadow:0 12px 40px rgba(0,0,0,.08);}
  .login-card .brand-badge{width:52px;height:52px;border-radius:15px;margin:0 auto 14px;}
  .login-card .brand-badge svg{width:30px;height:30px;}
  .login-card h1{font-family:"Fraunces",serif;font-size:26px;margin:0 0 8px;}
  .login-card p{color:var(--text-dim);font-size:13.5px;line-height:1.65;margin:0 0 22px;}
  .btn-google{width:100%;justify-content:center;padding:12px 14px;font-size:14.5px;border-radius:11px;}
  .btn-google svg{width:18px;height:18px;}
  .btn-google[disabled]{opacity:.6;cursor:default;}
  .login-msg{min-height:20px;margin-top:12px;font-size:12.5px;color:var(--text-dim);line-height:1.5;}
  .login-msg.err{color:var(--bad);}
  .account-row{display:flex;align-items:center;gap:12px;}
  .account-photo.small{width:32px;height:32px;font-size:13px;}
  /* ---- 그룹 공간 ---- */
  .space-bar{margin-bottom:14px;}
  .space-chips .seg-btn{display:inline-flex;align-items:center;gap:5px;}
  .space-chips svg{width:14px;height:14px;}
  .space-note{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:12.5px;color:var(--text-dim);
    background:color-mix(in srgb, var(--brand) 10%, transparent);border:1px solid color-mix(in srgb, var(--brand) 30%, transparent);border-radius:9px;padding:7px 10px;}
  .space-note svg{width:15px;height:15px;flex:none;color:var(--brand);}
  .invite-code{font-family:"JetBrains Mono",monospace;font-size:30px;font-weight:700;letter-spacing:6px;text-align:center;
    padding:14px;border:1px dashed var(--border);border-radius:12px;background:var(--bg);user-select:all;}
  .send-list{max-height:260px;overflow-y:auto;border:1px solid var(--border);border-radius:9px;padding:4px 8px;background:var(--bg);}
  .send-row{display:flex;align-items:center;gap:8px;padding:7px 2px;font-size:13.5px;border-bottom:1px solid var(--border);cursor:pointer;}
  .send-row:last-child{border-bottom:none;}
  .send-row span:first-of-type{flex:1;}
  .link-btn{color:var(--brand);cursor:pointer;font-weight:600;}
  /* ---- 담당자·장비 주인 ---- */
  .mini-avatar{width:20px;height:20px;border-radius:50%;object-fit:cover;flex:none;display:inline-flex;align-items:center;justify-content:center;
    background:var(--surface-2);color:var(--text-dim);font-size:10.5px;font-weight:700;vertical-align:middle;}
  .member-pick .mini-avatar{width:28px;height:28px;font-size:12px;}
  .member-pick.active{background:color-mix(in srgb, var(--brand) 10%, transparent);border-radius:8px;}
  .member-pick .pick-check{width:18px;height:18px;color:var(--brand);}
  .assignee-chip{display:inline-flex;align-items:center;gap:5px;max-width:110px;flex:none;border:1px dashed var(--border);background:transparent;
    color:var(--text-dim);border-radius:999px;padding:3px 9px 3px 4px;font-size:11.5px;cursor:pointer;}
  .assignee-chip svg{width:14px;height:14px;margin-left:3px;}
  .assignee-chip span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .assignee-chip.set{border-style:solid;color:var(--text);background:var(--surface-2);}
  .owner-tag{display:inline-flex;align-items:center;gap:4px;margin-left:6px;font-size:11.5px;font-weight:600;color:var(--text-dim);
    background:var(--surface-2);border-radius:999px;padding:2px 8px 2px 2px;vertical-align:middle;}
  .owner-filter .seg-btn{display:inline-flex;align-items:center;gap:5px;}
  .account-photo{width:44px;height:44px;border-radius:50%;object-fit:cover;flex:none;background:var(--surface-2);
    display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--text-dim);}
</style>
</head>
<body class="signed-out">
<div id="login-screen">
  <div class="login-card">
    <div class="brand-badge">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20l6-11 4 6.5L16.5 8 21 20z"/><circle cx="8.2" cy="6.5" r="1.6" fill="currentColor" stroke="none"/></svg>
    </div>
    <h1>캠프베이스</h1>
    <p>캠핑 준비물 체크, 내 캠핑 장비, 다녀온 캠핑장 후기를 한곳에 모아두는 캠핑 노트예요.<br>구글 계정으로 시작하면 어느 기기에서 열어도 내 기록이 그대로 이어져요.</p>
    <button class="btn btn-google" id="login-btn" data-action="login-google" disabled>
      <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.5 12.3c0-.8-.1-1.5-.2-2.2H12v4.2h5.9a5 5 0 0 1-2.2 3.3v2.7h3.6c2-1.9 3.2-4.7 3.2-8z"/><path fill="#34A853" d="M12 23c3 0 5.5-1 7.3-2.7l-3.6-2.7c-1 .7-2.2 1.1-3.7 1.1-2.9 0-5.3-1.9-6.2-4.5H2.1v2.8A11 11 0 0 0 12 23z"/><path fill="#FBBC05" d="M5.8 14.2a6.6 6.6 0 0 1 0-4.3V7.1H2.1a11 11 0 0 0 0 9.9z"/><path fill="#EA4335" d="M12 5.4c1.6 0 3 .6 4.2 1.6l3.1-3.1A11 11 0 0 0 2.1 7.1l3.7 2.8C6.7 7.3 9.1 5.4 12 5.4z"/></svg>
      <span>Google로 시작하기</span>
    </button>
    <div class="login-msg" id="login-msg">로그인 상태 확인 중…</div>
  </div>
</div>
<div id="app">
  <aside id="sidebar">
    <div class="brand">
      <div class="brand-badge">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20l6-11 4 6.5L16.5 8 21 20z"/><circle cx="8.2" cy="6.5" r="1.6" fill="currentColor" stroke="none"/></svg>
      </div>
      <div>
        <div class="brand-name">캠프베이스</div>
        <div class="brand-sub">나의 캠핑 노트</div>
      </div>
    </div>

/* ---- 저장소: Firebase Firestore / 로그인: Firebase Auth(구글) ----
 * 로그인한 사람마다 개인 공간 users/{uid}/... 에 저장한다.
 * 앱의 나머지 코드는 예전(claude.ai) 저장 인터페이스
 *   db.collection(name).onSnapshot/doc(id).set/delete/get, db.doc(path)...
 * 를 그대로 쓰고, makeFirestoreAdapter(fs, fdb, base)가 경로 앞에 base('users/{uid}')를 붙여
 * Firestore 호출로 바꿔준다. (base가 ''이면 최상위 = 예전 공유 저장소, 가져오기에만 사용)
 * 로그인 상태는 웹 SDK(auth) 하나만 본다. APK는 네이티브 구글 로그인 → idToken으로 웹 SDK에 로그인.
 * 설정값(firebase-config.js)이 비어 있으면 '미리보기 모드'(로그인·저장 없음)로 동작. */
const FIREBASE_SDK_VERSION = '10.12.2';
const FIREBASE_CDN = 'https://www.gstatic.com/firebasejs/' + FIREBASE_SDK_VERSION + '/';
state.bootMode = 'connecting';   // 'shared'(로그인됨) | 'signedOut' | 'preview' | 'error'

state.rootDb = null;             // 최상위(예전 공유 저장소) 어댑터 — 기존 데이터 가져오기 전용
const USER_COLLECTIONS = ['campingLogs','gear','checklists','cookingChecks'];
const SETTINGS_DOC = 'settings/app';            // users/{uid}/settings/app
const LEGACY_SETTINGS_DOC = 'app/settings';     // 예전 공유 설정(최상위)
const DEFAULT_HOME_WIDGETS = {location:true, camping:true, gear:true, checklist:true};

function firebaseConfigured(){
  const c = window.FIREBASE_CONFIG;
  if(!c || !c.apiKey || !c.projectId) return false;
  return !/붙여넣|YOUR_|PASTE|여기에/i.test(String(c.apiKey) + String(c.projectId));
}
// APK(Capacitor) 안에서 열렸는지. 웹(GitHub Pages)에서는 window.Capacitor가 없음.
function isNativeApp(){
  const C = window.Capacitor;
  if(!C) return false;
  return typeof C.isNativePlatform === 'function' ? !!C.isNativePlatform() : true;
}
function nativeAuthPlugin(){
  const C = window.Capacitor;
  return (C && C.Plugins && C.Plugins.FirebaseAuthentication) || null;
}
async function loadFirebaseModules(bases){
  if(window.__FIREBASE_MODULES__) return {...window.__FIREBASE_MODULES__, base:'injected'}; // 테스트용 주입
  let lastErr;
  for(const base of bases){
    try{
      const app = await import(base + 'firebase-app.js');
      const firestore = await import(base + 'firebase-firestore.js');
      const auth = await import(base + 'firebase-auth.js');
      return {app, firestore, auth, base};
    }catch(e){ lastErr = e; }
  }
  throw lastErr || new Error('Firebase SDK를 불러오지 못했어요');
}
function buildFirebase(mods){
  const appMod = mods.app, fs = mods.firestore, authMod = mods.auth;
  const apps = appMod.getApps ? appMod.getApps() : [];
  const app = apps.length ? apps[0] : appMod.initializeApp(window.FIREBASE_CONFIG);
  let fdb;
  try{
    fdb = fs.initializeFirestore(app, {
      ignoreUndefinedProperties: true,
      // 캠핑장처럼 신호가 약한 곳에서도 열리고, 체크한 내용은 연결되면 자동 동기화
      localCache: fs.persistentLocalCache({ tabManager: fs.persistentMultipleTabManager() }),
    });
  }catch(e){
    fdb = fs.getFirestore(app);
  }
  let auth;
  if(isNativeApp()){
    // APK: 팝업 로그인을 쓰지 않으므로(구글이 WebView 로그인을 막음) 팝업 도우미 없이
    // 로그인 상태만 기기(IndexedDB)에 보관 → 다시 열어도 로그인 유지
    try{ auth = authMod.initializeAuth(app, { persistence: [authMod.indexedDBLocalPersistence, authMod.browserLocalPersistence] }); }
    catch(e){ auth = authMod.getAuth(app); }
  }else{
    auth = authMod.getAuth(app);   // 웹: 기본값이 로그인 유지(IndexedDB) + 팝업 로그인 지원
  }
  // 테스트 전용(tests/emulator-e2e.test.js): Firebase 에뮬레이터로 연결. 실제 앱에서는 설정되지 않음.
  const emu = window.__FIREBASE_EMULATOR__;
  if(emu){
    fs.connectFirestoreEmulator(fdb, emu.host, emu.firestorePort);
    authMod.connectAuthEmulator(auth, 'http://' + emu.host + ':' + emu.authPort, { disableWarnings: true });
  }
  return {fs, fdb, auth, authMod};
}
async function connectFirebase(){
  // APK에는 SDK가 앱 안(vendor/)에 들어 있어 오프라인 첫 실행도 가능. 웹에서는 CDN 사용.
  let mods = await loadFirebaseModules(['./vendor/firebase/', FIREBASE_CDN]);
  try{ return buildFirebase(mods); }
  catch(e){
    if(mods.base !== FIREBASE_CDN && mods.base !== 'injected'){
      mods = await loadFirebaseModules([FIREBASE_CDN]);
      return buildFirebase(mods);
    }
    throw e;
  }
}
function makeFirestoreAdapter(fs, fdb, base){
  const full = p => base ? base + '/' + p : p;
  const wrapQuery = snap => ({ empty: snap.empty, docs: snap.docs.map(d=>({ id: d.id, data: ()=>d.data() })) });
  const wrapDoc = snap => ({ exists: snap.exists(), data: ()=>snap.data() });
  function listen(ref, isDoc, cb, errCb){
    let first = true, prevJson = null;
    return fs.onSnapshot(ref, { includeMetadataChanges: true }, snap=>{
      setOnlineStatus(!(snap.metadata && snap.metadata.fromCache));
      if(isDoc){
        const json = JSON.stringify(snap.exists() ? snap.data() : null);
        if(first || json !== prevJson){ first = false; prevJson = json; cb(wrapDoc(snap)); }
      }else if(first || snap.docChanges().length > 0){
        first = false; cb(wrapQuery(snap));
      }
    }, errCb);
  }
  const docApi = d => ({
    set: data => fs.setDoc(d, data),
    update: data => fs.updateDoc(d, data),   // 일부 필드만 변경('members.uid' 같은 경로, arrayUnion 등 사용 가능)
    delete: () => fs.deleteDoc(d),
    get: () => fs.getDoc(d).then(wrapDoc),
    onSnapshot: (cb, errCb) => listen(d, true, cb, errCb),
  });
  const queryApi = q => ({
    onSnapshot: (cb, errCb) => listen(q, false, cb, errCb),
    get: () => fs.getDocs(q).then(wrapQuery),
  });
  return {
    collection(name){
      const path = full(name);
      const ref = fs.collection(fdb, path);
      return {
        onSnapshot: (cb, errCb) => listen(ref, false, cb, errCb),
        doc: id => docApi(fs.doc(fdb, path, id)),
        get: () => fs.getDocs(ref).then(wrapQuery),
        // 조건 조회. 예) where('memberUids','array-contains', uid)
        where: (field, op, value) => queryApi(fs.query(ref, fs.where(field, op, value))),
      };
    },
    doc: path => docApi(fs.doc(fdb, full(path))),
    // update()에 쓰는 특수 값
    arrayUnion: (...v) => fs.arrayUnion(...v),
    arrayRemove: (...v) => fs.arrayRemove(...v),
    deleteField: () => fs.deleteField(),
  };
}
let _offlineTimer = null;
function setOnlineStatus(isOnline){
  if(isOnline){
    if(_offlineTimer){ clearTimeout(_offlineTimer); _offlineTimer = null; }
    if(!state.online){ state.online = true; updateStatus(); }
  }else if(state.online && !_offlineTimer){
    // 앱을 막 열었을 때 잠깐 캐시로 먼저 뜨는 건 무시하고, 3초 넘게 서버에 못 붙으면 오프라인 표시
    _offlineTimer = setTimeout(()=>{ _offlineTimer = null; state.online = false; updateStatus(); }, 3000);
  }
}
const _reportedDbErrors = new Set();
function reportDbError(e){
  const code = (e && e.code) || 'unknown';
  console.error('[firestore]', e);
  if(_reportedDbErrors.has(code)) return;
  _reportedDbErrors.add(code);
  if(code === 'permission-denied'){
    toast('저장소 접근이 거부됐어요. Firestore 규칙을 게시했는지 확인해주세요.', 'fail');
  }else{
    toast('저장소 연결에 문제가 있어요 (' + code + ')', 'fail');
  }
}
function withTimeout(p, ms){
  return Promise.race([p, new Promise((_, rej)=>setTimeout(()=>rej(new Error('timeout')), ms))]);
}

let _fb = null;          // {fs, fdb, auth, authMod}
let _unsubs = [];        // 로그인한 사람 데이터의 실시간 구독 해제 함수들
let _dataGen = 0;        // 계정이 바뀐 뒤 늦게 도착한 예전 계정 스냅샷을 무시하기 위한 번호

async function initDb(){
  if(!firebaseConfigured()){ finishBoot('preview'); return; }
  try{ _fb = await withTimeout(connectFirebase(), 20000); }
  catch(e){ console.error('[firebase]', e); finishBoot('error'); return; }
  state.rootDb = makeFirestoreAdapter(_fb.fs, _fb.fdb, '');
  _fb.authMod.onAuthStateChanged(_fb.auth, user=>{
    try{ onAuthUser(user); }
    catch(e){ console.error('[auth]', e); toast('로그인 처리 중 오류가 발생했어요: ' + (e && e.message ? e.message : String(e)), 'fail'); }
  });
}
function onAuthUser(user){
  stopUserData();
  if(!user){ state.user = null; finishBoot('signedOut'); return; }
  state.user = { uid: user.uid, name: user.displayName || '', email: user.email || '', photoURL: user.photoURL || '' };
  state.db = makeFirestoreAdapter(_fb.fs, _fb.fdb, 'users/' + user.uid);
  state.dbAvailable = true;
  startUserData();
  startGroups();
  // 계정 정보(이름·이메일·사진)는 로그인할 때마다 최신으로 남김
  const u = state.user;
  safePersist(()=>state.rootDb.doc('users/' + u.uid).set({ name: u.name, email: u.email, photoURL: u.photoURL, updatedAt: new Date().toISOString() }));
  finishBoot('shared');
}
function resetUserState(){
  state.campingLogs = []; state.gear = []; state.checklists = []; state.cookingChecks = {};
  state.weatherLocation = null;
  state.gearCategories = [...DEFAULT_GEAR_CATEGORIES];
  state.homeWidgets = {...DEFAULT_HOME_WIDGETS};
  loadLocalHomeWidgets();
  state.campingFilter = 'all'; state.gearCategory = 'all'; state.checklistFilter = 'all'; state.gearOwnerFilter = 'all';
  state.currentView = 'home';
}
function stopUserData(){
  _dataGen++;
  _unsubs.forEach(fn=>{ try{ fn && fn(); }catch(e){} });
  _unsubs = [];
  stopGroups();
  state.db = null; state.dbAvailable = false;
  _reportedDbErrors.clear();
  resetUserState();
}
function startUserData(){
  const db = state.db, gen = _dataGen;
  const onErr = e => { if(gen===_dataGen) reportDbError(e); };
  const live = fn => snap => { if(gen===_dataGen) fn(snap); };

  _unsubs.push(db.collection('campingLogs').onSnapshot(live(snap=>{
    state.campingLogs = snap.docs.map(d=>({id:d.id, ...unfreeze(d.data())}));
    if(['home','camping'].includes(state.currentView)) renderView();
  }), onErr));
  _unsubs.push(db.collection('gear').onSnapshot(live(snap=>{
    state.gear = snap.docs.map(d=>({id:d.id, ...unfreeze(d.data())}));
    if(['home','gear'].includes(state.currentView)) renderView();
  }), onErr));
  _unsubs.push(db.collection('checklists').onSnapshot(live(snap=>{
    state.checklists = snap.docs.map(d=>({id:d.id, ...unfreeze(d.data())}));
    if(['home','checklist'].includes(state.currentView)) renderView();
  }), onErr));
  _unsubs.push(db.doc(SETTINGS_DOC).onSnapshot(live(snap=>{
    if(snap.exists){
      const d = unfreeze(snap.data()) || {};
      if(d.weatherLocation) state.weatherLocation = d.weatherLocation;
      if(d.gearCategories && d.gearCategories.length) state.gearCategories = d.gearCategories;

function setLoginMsg(msg, isErr){

function loginErrorMessage(e){
  const code = String((e && e.code) || '');
  const text = code + ' ' + String((e && e.message) || '');
  if(/popup-closed-by-user|cancelled-popup-request|user-cancelled|cancel/i.test(text)) return '로그인을 취소했어요.';
  if(/unauthorized-domain/.test(code)) return '이 주소는 아직 로그인 허용 목록에 없어요. (Firebase 콘솔 → Authentication → 설정 → 승인된 도메인)';
  if(/operation-not-allowed/.test(code)) return 'Firebase에서 Google 로그인이 아직 켜져 있지 않아요.';
  if(/popup-blocked/.test(code)) return '로그인 창(팝업)이 막혔어요. 브라우저에서 팝업을 허용한 뒤 다시 눌러주세요.';
  if(/network-request-failed|network/i.test(text)) return '인터넷 연결을 확인한 뒤 다시 시도해주세요.';
  if(/native\/plugin-missing/.test(code)) return '앱의 로그인 기능을 찾지 못했어요. 최신 APK로 다시 설치해주세요.';
  if(/DEVELOPER_ERROR|(^|\D)10:/.test(text)) return '구글 로그인 설정(SHA-1 등록)이 맞지 않아요. 안내서의 Firebase 설정을 확인해주세요.';
  return '로그인하지 못했어요. 다시 시도해주세요.' + (code ? ' (' + code + ')' : '');
}
let _signingIn = false;
async function signInWithGoogle(){
  if(_signingIn || !_fb) return;
  _signingIn = true;
  setLoginBusy(true); setLoginMsg('구글 계정 확인 중…');
  const A = _fb.authMod;
  try{
    if(isNativeApp()){
      // APK: 폰의 구글 계정 선택 창(네이티브) → 받은 idToken으로 웹 SDK에 로그인
      const plugin = nativeAuthPlugin();
      if(!plugin) throw Object.assign(new Error('FirebaseAuthentication plugin missing'), {code:'native/plugin-missing'});
      const res = await plugin.signInWithGoogle();
      const idToken = res && res.credential && res.credential.idToken;
      if(!idToken) throw Object.assign(new Error('no idToken'), {code:'native/no-id-token'});
      await A.signInWithCredential(_fb.auth, A.GoogleAuthProvider.credential(idToken));
    }else{
      const provider = new A.GoogleAuthProvider();
      if(provider.setCustomParameters) provider.setCustomParameters({ prompt: 'select_account' });
      try{ await A.signInWithPopup(_fb.auth, provider); }
      catch(e){
        if(e && e.code==='auth/popup-blocked' && A.signInWithRedirect){ await A.signInWithRedirect(_fb.auth, provider); return; }
        throw e;
      }
    }
    // 성공하면 onAuthStateChanged → onAuthUser가 앱 화면으로 바꿔줌
  }catch(e){
    console.error('[auth]', e);
    setLoginBusy(false);
    setLoginMsg(loginErrorMessage(e), true);
  }finally{
    _signingIn = false;
  }
}
async function signOutNow(){
  if(!_fb) return;
  const plugin = isNativeApp() ? nativeAuthPlugin() : null;
  if(plugin && plugin.signOut){ try{ await plugin.signOut(); }catch(e){ console.warn('[auth] native signOut', e); } }
  try{
    await _fb.authMod.signOut(_fb.auth);
    toast('로그아웃했어요.');
  }catch(e){
    console.error('[auth]', e);
    toast('로그아웃하지 못했어요. 다시 시도해주세요.', 'fail');
  }
}

/* ---- 기존 공유 데이터(최상위 legacy 경로) → 내 개인 공간으로 복사 ----
 * 원본은 그대로 두고, 내 공간에 이미 같은 id가 있으면 덮어쓰지 않고 건너뛴다. */
const LEGACY_LABELS = {campingLogs:'캠핑 기록', gear:'장비', checklists:'체크리스트', cookingChecks:'요리 재료 체크'};
let _legacyBusy = false;
async function readUserCollections(db){
  const out = {};
  for(const c of USER_COLLECTIONS){
    const snap = await db.collection(c).get();
    out[c] = snap.docs.map(d=>({ id: d.id, data: unfreeze(d.data()) || {} }));
  }
  return out;
}
function mergeGearCategories(mine, theirs){
  const merged = [...(mine || [])];
  (theirs || []).forEach(c=>{
    if(!c || merged.includes(c)) return;
    const etc = merged.indexOf('기타');
    if(etc >= 0) merged.splice(etc, 0, c); else merged.push(c);
  });
  return merged;
}
async function startLegacyImport(){
  if(!state.dbAvailable || !state.rootDb){ toast('로그인한 뒤에 가져올 수 있어요.'); return; }
  if(_legacyBusy) return;
  _legacyBusy = true;
  toast('기존 공유 데이터를 확인하는 중…');
  try{
    const legacy = await readUserCollections(state.rootDb);
    const mine = await readUserCollections(state.db);
    const legacySettingsSnap = await state.rootDb.doc(LEGACY_SETTINGS_DOC).get();
    const legacySettings = legacySettingsSnap.exists ? (unfreeze(legacySettingsSnap.data()) || {}) : {};
    const plan = { copy:{}, total:0, skipped:0, counts:{}, settings: legacySettings };
    USER_COLLECTIONS.forEach(c=>{
      const have = new Set(mine[c].map(d=>d.id));
      plan.counts[c] = legacy[c].length;
      plan.total += legacy[c].length;
      plan.copy[c] = legacy[c].filter(d=>!have.has(d.id));
      plan.skipped += legacy[c].length - plan.copy[c].length;
    });
    const hasSettings = (Array.isArray(legacySettings.gearCategories) && legacySettings.gearCategories.length) || !!legacySettings.weatherLocation;
    if(plan.total === 0 && !hasSettings){ toast('가져올 기존 공유 데이터가 없어요.'); return; }
    const countText = USER_COLLECTIONS.map(c=>`${LEGACY_LABELS[c]} ${plan.counts[c]}개`).join(', ');
    const skipText = plan.skipped ? ` 내 공간에 이미 있는 ${plan.skipped}개는 덮어쓰지 않고 건너뛰어요.` : '';
    confirmModal(`기존 공유 데이터(${countText})를 내 개인 공간으로 복사할까요?${skipText} 공유 데이터 원본은 그대로 남아요.`, '가져오기', ()=>applyLegacyImport(plan));
  }catch(e){
    console.error('[legacy-import]', e);
    const code = (e && e.code) || '';
    toast(code==='permission-denied' ? '기존 공유 데이터를 읽을 수 없어요. (공유 저장소가 이미 닫혔어요)' : '기존 공유 데이터를 불러오지 못했어요.' + (code ? ' (' + code + ')' : ''), 'fail');
  }finally{
    _legacyBusy = false;
  }
}
function applyLegacyImport(plan){
  if(!state.dbAvailable){ toast('로그인한 뒤에 가져올 수 있어요.'); return; }
  const db = state.db;
  let copied = 0, skipped = plan.skipped;
  ['campingLogs','gear','checklists'].forEach(c=>{
    const have = new Set(state[c].map(x=>x.id));   // 확인 창을 띄운 사이에 생긴 항목도 건너뜀
    plan.copy[c].forEach(d=>{
      if(have.has(d.id)){ skipped++; return; }
      const data = stripId(d.data);
      state[c].push({ id: d.id, ...data });
      safePersist(()=>db.collection(c).doc(d.id).set(data));
      copied++;
    });
  });
  plan.copy.cookingChecks.forEach(d=>{
    if(d.id in state.cookingChecks){ skipped++; return; }
    state.cookingChecks[d.id] = d.data;
    safePersist(()=>db.collection('cookingChecks').doc(d.id).set(d.data));
    copied++;
  });
  const s = plan.settings || {};
  let settingsChanged = false;
  if(Array.isArray(s.gearCategories) && s.gearCategories.length){
    const merged = mergeGearCategories(state.gearCategories, s.gearCategories);
    if(merged.length !== state.gearCategories.length){ state.gearCategories = merged; settingsChanged = true; }
  }
  if(s.weatherLocation && !state.weatherLocation){ state.weatherLocation = s.weatherLocation; settingsChanged = true; }
  if(settingsChanged) persistAppSettings();
  renderView();
  toast(`${copied}개를 내 공간으로 가져왔어요.` + (skipped ? ` (이미 있던 ${skipped}개는 건너뜀)` : ''), 'ok');
}

/* ---- 그룹 ----

 * groups/{gid}/checklists|gear/{id} — 멤버 모두가 함께 보고 고침.
 * Checklist·Gear 탭만 공간(내 공간 | 그룹)을 바꿔 볼 수 있고, 나머지 탭(Home 포함)은 항상 개인 공간.
 * 선택한 공간은 기기에 기억(localStorage campbase.space.<uid>). 권한은 firestore.rules가 지킨다. */

function currentGroup(){ return state.space==='me' ? null : (state.groups.find(g=>g.id===state.space) || null); }
function inGroupSpace(){ return !!currentGroup(); }

function normalizeGroup(id, d){

function loadSavedSpace(uid){ try{ return localStorage.getItem(SPACE_KEY_PREFIX + uid) || 'me'; }catch(e){ return 'me'; } }

function startGroups(){
  const gen = _dataGen, u = state.user.uid;

    if(gen !== _dataGen) return;
    state.groups = snap.docs.map(d=>normalizeGroup(d.id, unfreeze(d.data())))
      .sort((a,b)=> String(a.createdAt||'').localeCompare(String(b.createdAt||'')) || a.name.localeCompare(b.name, 'ko'));
    // 기기에 기억해 둔 그룹 공간으로 복귀
    if(_pendingSpace && state.groups.some(g=>g.id===_pendingSpace)){ const p = _pendingSpace; _pendingSpace = null; selectSpace(p, true); return; }
    // 보고 있던 그룹에서 나가졌거나 그룹이 삭제됨

function stopSpaceData(){

function startSpaceData(gid){

function makeInviteCode(){
  const bytes = new Uint8Array(INVITE_LEN);
  if(window.crypto && crypto.getRandomValues) crypto.getRandomValues(bytes);
  else for(let i=0;i<bytes.length;i++) bytes[i] = Math.floor(Math.random()*256);
  return Array.from(bytes, b=>INVITE_CHARS[b % INVITE_CHARS.length]).join('');
}
function fmtDate(ms){ const d = new Date(ms); return `${d.getFullYear()}.${d.getMonth()+1}.${d.getDate()}`; }
async function createInvite(gid){

  const expiresAt = Date.now() + INVITE_DAYS * 24 * 60 * 60 * 1000;
  let lastErr = null;
  for(let attempt=0; attempt<4; attempt++){
    const code = makeInviteCode();
    try{
      await state.rootDb.doc('groupInvites/' + code).set({ gid, groupName: g.name, createdBy: state.user.uid, expiresAt, createdAt: new Date().toISOString() });
      openModal(`

        <p style="margin:8px 0 0;color:var(--text-dim);font-size:12px;text-align:center;">${fmtDate(expiresAt)}까지 쓸 수 있어요 (${INVITE_DAYS}일)</p>

          <button class="btn" data-action="modal-close">닫기</button>
          <button class="btn btn-primary" data-action="invite-copy" data-code="${code}">${icon('save')} 코드 복사</button>
        </div>`);
      return;
    }catch(e){ lastErr = e; }   // 같은 코드가 이미 있으면(드물게) 새 코드로 다시 시도
  }
  console.error('[invite]', lastErr);
  toast('초대 코드를 만들지 못했어요.' + (lastErr && lastErr.code ? ' (' + lastErr.code + ')' : ''), 'fail');
}
function copyText(text, okMsg){
  const done = ()=>toast(okMsg || '복사했어요.', 'ok');
  const fallback = ()=>{
    try{
      const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select();
      document.execCommand('copy'); ta.remove(); done();
    }catch(e){ toast('자동 복사가 안 돼요. 코드를 길게 눌러 직접 복사해주세요.'); }
  };
  if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done).catch(fallback);
  else fallback();
}

function normalizeCode(v){ return String(v||'').toUpperCase().replace(/[\s-]/g, ''); }
let _joinBusy = false;
async function checkJoinCode(){
  const el = document.getElementById('join-code');
  const code = normalizeCode(el ? el.value : '');
  if(!new RegExp('^[' + INVITE_CHARS + ']{6,8}$').test(code)){ toast('코드를 다시 확인해주세요. (영문 대문자와 숫자 6자리)'); return; }
  if(!state.dbAvailable || _joinBusy) return;
  _joinBusy = true;
  try{
    const snap = await state.rootDb.doc('groupInvites/' + code).get();
    if(!snap.exists){ toast('없는 코드예요. 코드를 다시 확인해주세요.', 'fail'); return; }
    const inv = unfreeze(snap.data()) || {};
    if(!(Number(inv.expiresAt) > Date.now())){ toast('만료된 코드예요. 그룹 멤버에게 새 코드를 받아주세요.', 'fail'); return; }
    if(state.groups.some(g=>g.id===inv.gid)){ toast(`이미 '${inv.groupName || ''}' 그룹 멤버예요.`); closeModal(); return; }
    confirmModal(`'${inv.groupName || '이름 없는 그룹'}' 그룹에 참여할까요? 참여하면 그룹의 체크리스트와 장비를 함께 보고 고칠 수 있어요.`, '참여', ()=>joinGroup(code, inv));
  }catch(e){
    console.error('[join]', e);
    toast('코드를 확인하지 못했어요.' + (e && e.code ? ' (' + e.code + ')' : ''), 'fail');
  }finally{ _joinBusy = false; }
}

function sendGear(){
  const sel = document.getElementById('send-group');
  const g = sel && groupById(sel.value);
  const ids = Array.from(document.querySelectorAll('.send-gear:checked')).map(el=>el.value);
  if(!g){ toast('보낼 그룹을 골라주세요.'); return; }
  if(!ids.length){ toast('보낼 장비를 골라주세요.'); return; }
  const u = state.user.uid, gdb = groupDb(g.id);
  const picked = state.gear.filter(x=>ids.includes(x.id));
  picked.forEach(item=>{
    const copy = { ...unfreeze(stripId(item)), addedBy: u, updatedBy: u };
    const newId = uid('g');
    safePersist(()=>gdb.collection('gear').doc(newId).set(copy));
  });
  // 그룹 카테고리에 없는 장비 카테고리는 그룹에 추가('기타' 앞에)
  const merged = mergeGearCategories(g.gearCategories, picked.map(x=>x.category || '기타'));
  if(merged.length !== g.gearCategories.length){
    g.gearCategories = merged;
    safePersist(()=>state.rootDb.doc('groups/' + g.id).update({ gearCategories: merged }));
  }
  closeModal();
  toast(`장비 ${picked.length}개를 '${g.name}' 그룹으로 복사했어요.`, 'ok');
}

function parseBackup(text){
  let data;
  try{ data = JSON.parse(text); }catch(e){ return {error:'백업 내용을 읽지 못했어요. 전체를 빠짐없이 붙여넣었는지 확인해주세요.'}; }
  if(!data || typeof data!=='object' || data.app!=='campbase') return {error:'캠프베이스 백업 파일이 아니에요.'};
  const arr = v => Array.isArray(v) ? v.filter(x=>x && typeof x==='object') : [];
  const withIds = (list, prefix) => list.map(x=>({...x, id: String(x.id || uid(prefix))}));
  return { data: {
    campingLogs: withIds(arr(data.campingLogs), 'c'),
    gear: withIds(arr(data.gear), 'g'),
    checklists: withIds(arr(data.checklists), 'cl').map(cl=>({...cl, items: Array.isArray(cl.items) ? cl.items : []})),
    cookingChecks: (data.cookingChecks && typeof data.cookingChecks==='object' && !Array.isArray(data.cookingChecks)) ? data.cookingChecks : {},
    settings: (data.settings && typeof data.settings==='object') ? data.settings : {},
  }};
}
function startImportBackup(){
  const ta = document.getElementById('backup-text-in');
  const text = ta ? ta.value.trim() : '';
  if(!text){ toast('백업 파일을 고르거나 내용을 붙여넣어 주세요.'); return; }
  const res = parseBackup(text);
  if(res.error){ toast(res.error, 'fail'); return; }
  const d = res.data;
  confirmModal(`백업 내용(캠핑 기록 ${d.campingLogs.length}개, 장비 ${d.gear.length}개, 체크리스트 ${d.checklists.length}개)으로 바꿀까요? 지금 내 계정의 데이터는 모두 이 내용으로 바뀌어요. (다른 사람의 데이터에는 영향이 없어요)`, '바꾸기', ()=>applyBackup(d));
}
function applyBackup(d){
  const cols = ['campingLogs','gear','checklists'];
  const prev = { campingLogs: state.campingLogs, gear: state.gear, checklists: state.checklists, cookingChecks: state.cookingChecks };
  state.campingLogs = d.campingLogs; state.gear = d.gear; state.checklists = d.checklists; state.cookingChecks = d.cookingChecks;
  const s = d.settings;
  if(s.homeWidgets && typeof s.homeWidgets==='object'){ state.homeWidgets = {...state.homeWidgets, ...s.homeWidgets}; }
  if(Array.isArray(s.gearCategories) && s.gearCategories.length){
    state.gearCategories = s.gearCategories.includes('기타') ? s.gearCategories.slice() : [...s.gearCategories, '기타'];
  }
  if(s.weatherLocation) state.weatherLocation = s.weatherLocation;
  if(state.dbAvailable){
    const db = state.db;
    cols.forEach(c=>{
      const keep = new Set(d[c].map(x=>x.id));
      prev[c].forEach(old=>{ if(!keep.has(old.id)) safePersist(()=>db.collection(c).doc(old.id).delete()); });
      d[c].forEach(x=>safePersist(()=>db.collection(c).doc(x.id).set(stripId(x))));
    });
    Object.keys(prev.cookingChecks||{}).forEach(id=>{ if(!(id in d.cookingChecks)) safePersist(()=>db.collection('cookingChecks').doc(id).delete()); });
    Object.entries(d.cookingChecks).forEach(([id, v])=>safePersist(()=>db.collection('cookingChecks').doc(id).set(v)));
    persistAppSettings();
  }
  renderView();
  toast(state.dbAvailable ? '백업을 가져왔어요. 내 계정의 모든 기기에 반영돼요.' : '백업을 불러왔어요. (미리보기 모드라 저장되지는 않아요)', 'ok');
}

function onSaveFail(e){
  console.error('[save]', e);
  if(e && e.code==='permission-denied'){ toast('저장 권한이 없어요. Firestore 규칙을 게시했는지, 아직 그 그룹 멤버인지 확인해주세요.', 'fail'); return; }
  toast('저장에 실패했어요. 다시 시도해주세요.' + (e&&e.code?' ('+e.code+')':''), 'fail');
}
// safePersist: never lets a persistence call block the caller. Any SYNCHRONOUS throw
// (e.g. from building a bad path) or ASYNC rejection is caught here and turned into a
// toast — the caller's own state update + re-render + success toast always run regardless.
function safePersist(fn){
  try{
    const p = fn();
    if(p && typeof p.catch === 'function') p.catch(onSaveFail);
  }catch(e){ onSaveFail(e); }
}

/* ============================ PIE CHART ============================ */
function pieChartSvg(segments, size){
  size = size || 120;
  const r = size/2;
  const total = segments.reduce((s,x)=>s+x.value,0);
  if(!total){
    return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}"><circle cx="${r}" cy="${r}" r="${r-1}" fill="none" stroke="var(--border)" stroke-width="2"/></svg>`;
  }
  let cum = 0;
  const parts = segments.filter(s=>s.value>0).map(seg=>{
    const startAng = cum/total*2*Math.PI - Math.PI/2;
    cum += seg.value;
    const endAng = cum/total*2*Math.PI - Math.PI/2;
    if(seg.value === total){
      return `<circle cx="${r}" cy="${r}" r="${r}" fill="${seg.color}"/>`;
    }
    const x1 = r + r*Math.cos(startAng), y1 = r + r*Math.sin(startAng);
    const x2 = r + r*Math.cos(endAng), y2 = r + r*Math.sin(endAng);
    const large = (endAng-startAng) > Math.PI ? 1 : 0;
    return `<path d="M${r},${r} L${x1.toFixed(2)},${y1.toFixed(2)} A${r},${r} 0 ${large} 1 ${x2.toFixed(2)},${y2.toFixed(2)} Z" fill="${seg.color}"/>`;
  }).join('');
  return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}">${parts}</svg>`;
}

function addGearCategory(name){
  if(!name){ toast('카테고리 이름을 입력해주세요.'); return; }
  if(SP.gearCategories.includes(name)){ toast('이미 있는 카테고리예요.'); return; }
  SP.gearCategories.push(name);
  persistGearCategories();
  categoryManageModal();
  renderView();
  toast('카테고리를 추가했어요.');
}
function renameGearCategory(oldName, newName){
  if(!newName){ toast('이름을 입력해주세요.'); return; }
  if(newName===oldName) return;
  if(SP.gearCategories.includes(newName)){ toast('이미 있는 이름이에요.'); return; }
  SP.gearCategories = SP.gearCategories.map(c=>c===oldName?newName:c);
  SP.gear.forEach(g=>{ if(g.category===oldName){ g.category=newName; persistGear(g); } });
  if(state.gearCategory===oldName) state.gearCategory=newName;
  persistGearCategories();
  categoryManageModal();
  renderView();
  toast('카테고리 이름을 바꿨어요.');
}
function deleteGearCategory(cat){
  if(cat==='기타'){ toast("'기타'는 삭제할 수 없어요."); return; }
  SP.gearCategories = SP.gearCategories.filter(c=>c!==cat);
  if(!SP.gearCategories.includes('기타')) SP.gearCategories.push('기타');
  const moved = SP.gear.filter(g=>g.category===cat);
  moved.forEach(g=>{ g.category='기타'; persistGear(g); });
  if(state.gearCategory===cat) state.gearCategory='all';
  persistGearCategories();
  categoryManageModal();
  renderView();
  toast(moved.length ? `카테고리를 삭제했어요. 장비 ${moved.length}개는 기타로 옮겨졌어요.` : '카테고리를 삭제했어요.');
}

/* ============================ CHECKLIST ============================ */
function groupChecklistItems(items){
  const order = []; const map = {};
  items.forEach(it=>{
    const g = it.group || '기타';
    if(!map[g]){ map[g]=[]; order.push(g); }
    map[g].push(it);
  });
  const ordered = order.filter(g=>g!=='기타');
  if(map['기타']) ordered.push('기타');
  return ordered.map(g=>({group:g, items:map[g]}));
}

/* ============================ MODAL / TOAST ============================ */
function openModal(html){
  document.getElementById('modal-root').innerHTML = `
    <div class="modal-backdrop" id="modal-backdrop">
      <div class="modal">${html}</div>
    </div>`;
  document.getElementById('modal-backdrop').addEventListener('click', e=>{ if(e.target.id==='modal-backdrop') closeModal(); });
}
function closeModal(){ document.getElementById('modal-root').innerHTML=''; _confirmCallback = null; }
// confirmModal: replaces window.confirm() for destructive actions. The
// sandboxed iframe this Artifact runs in silently blocks native confirm()/
// alert() dialogs (no popup ever appears and it just resolves as cancelled)
// — clicking a delete icon would then do nothing at all ("선택 시 무반응"),
// with no error either, since `if(!confirm(...)) break;` just quietly took
// the cancel branch. This draws the same confirmation as a normal in-app
// modal instead, which always renders.
let _confirmCallback = null;
function confirmModal(message, confirmLabel, onConfirm){
  _confirmCallback = onConfirm;
  openModal(`
    <h3>확인</h3>
    <p style="margin:0 0 4px;color:var(--text-dim);font-size:13.5px;line-height:1.6;">${esc(message)}</p>
    <div class="modal-actions">
      <button class="btn" data-action="modal-close">취소</button>
      <button class="btn btn-danger-solid" data-action="confirm-yes">${esc(confirmLabel||'확인')}</button>
    </div>
  `);
}
function toast(msg, kind){
  const t=document.getElementById('toast'); t.textContent=msg;
  t.classList.remove('fail','ok'); if(kind) t.classList.add(kind);
  t.classList.add('show');
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'), 1800);
}

/* ============================ GLOBAL EVENT DELEGATION ============================ */
function wireGlobalActions(){
  document.addEventListener('click', (e)=>{
   try{
    const navEl = e.target.closest('[data-nav]');
    if(navEl && navEl.closest('#nav, #mobile-topbar')){
      state.currentView = navEl.getAttribute('data-nav');
      renderNav(); renderView();
      return;
    }
    const a = e.target.closest('[data-action]');
    if(!a) return;
    const action = a.getAttribute('data-action');
    const id = a.getAttribute('data-id');

    switch(action){
      case 'modal-close': closeModal(); break;

      case 'camp-new': campFormModal(); break;
      case 'camp-edit': campFormModal(id); break;
      case 'camp-del': {
        const target = state.campingLogs.find(c=>c.id===id);
        confirmModal(`'${target?target.name:'이 기록'}'을 삭제할까요? 되돌릴 수 없어요.`, '삭제', ()=>{
          state.campingLogs = state.campingLogs.filter(c=>c.id!==id);
          deleteCampingRemote(id); renderView(); toast('기록을 삭제했어요.');
        });
        break;
      }
      case 'camp-save': saveCampForm(id); break;

      case 'gear-new': gearFormModal(); break;
      case 'gear-edit': gearFormModal(id); break;
      case 'gear-del': {
        const target = SP.gear.find(g=>g.id===id);
        confirmModal(`'${target?target.name:'이 장비'}'를 삭제할까요? 되돌릴 수 없어요.`, '삭제', ()=>{
          SP.gear = SP.gear.filter(g=>g.id!==id);
          deleteGearRemote(id); renderView(); toast('장비를 삭제했어요.');
        });
        break;
      }
      case 'gear-save': saveGearForm(id); break;

      case 'gear-cat-manage': categoryManageModal(); break;
      case 'gear-cat-add': {
        const input = document.getElementById('cat-new-name');
        addGearCategory(input.value.trim());
        break;
      }
      case 'gear-cat-rename': {
        const oldName = a.getAttribute('data-old');
        const row = a.closest('.list-row');
        const input = row.querySelector('.cat-edit-input');
        renameGearCategory(oldName, input.value.trim());
        break;
      }
      case 'gear-cat-del':
        deleteGearCategory(a.getAttribute('data-cat'));
        break;

      case 'home-loc-save': saveBaseLocation(); break;

      case 'goto-settings':
        state.currentView = 'settings';
        renderNav(); renderView();
        break;

      case 'cook-filter':
        state.cookingCategory = a.getAttribute('data-cat');
        renderView();
        break;

      case 'camp-filter':
        state.campingFilter = a.getAttribute('data-cat');
        renderView();
        break;

      case 'gear-filter':
        state.gearCategory = a.getAttribute('data-cat');
        renderView();
        break;

      case 'cl-filter':
        state.checklistFilter = a.getAttribute('data-filter');
        renderView();
        break;

      case 'home-cat-nav': {
        const tab = a.getAttribute('data-tab');
        const filterVal = a.getAttribute('data-filter');
        if(state.space!=='me') selectSpace('me');   // Home 통계는 개인 공간 기준
        if(tab==='camping') state.campingFilter = filterVal;
        if(tab==='gear') state.gearCategory = filterVal;
        if(tab==='checklist') state.checklistFilter = filterVal;
        state.currentView = tab;
        renderNav(); renderView();
        break;
      }

      case 'cl-new-list': newChecklistModal(); break;
      case 'cl-new-list-save': saveNewChecklist(); break;
      case 'cl-del-list': {
        const target = SP.checklists.find(c=>c.id===id);
        confirmModal(`'${target?target.title:'이 리스트'}' 전체를 삭제할까요? 안의 항목도 모두 사라지고 되돌릴 수 없어요.`, '삭제', ()=>{
          SP.checklists = SP.checklists.filter(c=>c.id!==id);
          deleteChecklistRemote(id); renderView(); toast('리스트를 삭제했어요.');
        });
        break;
      }
      case 'cl-list-reset': resetChecklist(id); break;
      case 'cl-list-rename': renameListModal(id); break;
      case 'backup-export': exportBackupModal(); break;
      case 'backup-copy': copyBackupText(); break;
      case 'backup-import': importBackupModal(); break;
      case 'backup-import-go': startImportBackup(); break;
      case 'login-google': signInWithGoogle(); break;
      case 'logout': confirmModal('로그아웃할까요? 다시 로그인하면 내 기록이 그대로 보여요.', '로그아웃', ()=>signOutNow()); break;
      case 'legacy-import': startLegacyImport(); break;
      case 'space-pick': selectSpace(a.getAttribute('data-space')); break;
      case 'group-new': newGroupModal(); break;
      case 'group-new-save': createGroup(); break;
      case 'group-join': joinGroupModal(); break;
      case 'group-join-check': checkJoinCode(); break;
      case 'group-invite': createInvite(a.getAttribute('data-gid')); break;
      case 'invite-copy': copyText(a.getAttribute('data-code'), '초대 코드를 복사했어요.'); break;
      case 'group-members': groupMembersModal(a.getAttribute('data-gid')); break;
      case 'group-kick': kickMember(a.getAttribute('data-gid'), a.getAttribute('data-uid')); break;
      case 'group-leave': leaveGroup(a.getAttribute('data-gid')); break;
      case 'group-rename': renameGroupModalOpen(a.getAttribute('data-gid')); break;
      case 'group-rename-save': renameGroup(a.getAttribute('data-gid')); break;
      case 'group-delete': deleteGroupConfirm(a.getAttribute('data-gid')); break;
      case 'cl-send': sendChecklistModal(id); break;
      case 'cl-assign': assignModal(a.getAttribute('data-list'), a.getAttribute('data-item')); break;
      case 'cl-assign-set': setAssignee(a.getAttribute('data-list'), a.getAttribute('data-item'), a.getAttribute('data-uid')); break;
      case 'gear-owner-filter':
        state.gearOwnerFilter = a.getAttribute('data-owner') || 'all';
        renderView();
        break;
      case 'cl-send-go': sendChecklist(id); break;
      case 'gear-send': sendGearModal(); break;
      case 'gear-send-all': document.querySelectorAll('.send-gear').forEach(el=>{ el.checked = true; }); break;
      case 'gear-send-go': sendGear(); break;
      case 'cl-list-rename-save': {
        const input = document.getElementById('cl-title-name');
        renameChecklistTitle(id, input ? input.value : '');
        break;
      }
      case 'confirm-yes': {
        const cb = _confirmCallback; _confirmCallback = null;
        closeModal();
        if(cb) cb();
        break;
      }
      case 'cl-add-item': addChecklistItemModal(id); break;
      case 'cl-add-item-save': saveChecklistItem(id); break;
      case 'cli-group-pick': {
        const groupEl = document.getElementById('cli-group');
        if(groupEl) groupEl.value = a.getAttribute('data-val');
        break;
      }
      case 'cl-item-status': {
        const listId = a.getAttribute('data-list'), itemId = a.getAttribute('data-item'), val = a.getAttribute('data-val');
        const list = SP.checklists.find(c=>c.id===listId);
        if(list){
          const it = (list.items||[]).find(i=>i.id===itemId);
          if(it){
            const cur = itemStatus(it);
            it.status = (cur===val) ? 'pending' : val; // clicking the active state again resets to 미정
            delete it.checked; // migrate off the legacy boolean field going forward
            persistChecklist(list);
            renderView();
          }
        }
        break;
      }
      case 'cl-del-item': {
        const listId = a.getAttribute('data-list'), itemId = a.getAttribute('data-item');
        const list = SP.checklists.find(c=>c.id===listId);
        if(list){ list.items = (list.items||[]).filter(i=>i.id!==itemId); persistChecklist(list); renderView(); }
        break;
      }
      case 'cl-group-add': {
        const listId = a.getAttribute('data-list'), group = a.getAttribute('data-group');
        addChecklistItemModal(listId, group);
        break;
      }
      case 'cl-group-rename': {
        const listId = a.getAttribute('data-list'), group = a.getAttribute('data-group');
        renameGroupModal(listId, group);
        break;
      }
      case 'cl-group-rename-save': {
        const listId = a.getAttribute('data-list'), oldName = a.getAttribute('data-old');
        const input = document.getElementById('clg-name');
        renameChecklistGroup(listId, oldName, input.value);
        break;
      }
    }
   }catch(err){
     console.error('[wireGlobalActions:click]', err);
     toast('작업 중 오류가 발생했어요: ' + (err && err.message ? err.message : String(err)), 'fail');
   }
  });
  document.addEventListener('change', (e)=>{

      const rid = cc.getAttribute('data-recipe');
      const idx = Number(cc.getAttribute('data-idx'));
      const cur = new Set((state.cookingChecks[rid] && state.cookingChecks[rid].checked) || []);
      if(cc.checked) cur.add(idx); else cur.delete(idx);
      state.cookingChecks[rid] = {checked:[...cur]};
      persistCookingCheck(rid, state.cookingChecks[rid]);
      renderView();
      return;
    }
    if(e.target && e.target.id === 'backup-file'){
      const f = e.target.files && e.target.files[0];
      if(f){
        const r = new FileReader();
        r.onload = ()=>{
          const ta = document.getElementById('backup-text-in');
          if(ta) ta.value = String(r.result || '');
          toast('파일을 불러왔어요. 가져오기를 눌러주세요.');
        };
        r.readAsText(f);
      }
      return;
    }
    const tw = e.target.closest('[data-action="toggle-widget"]');
    if(tw){
      toggleHomeWidget(tw.getAttribute('data-key'));
    }
    const cs = e.target.closest('[data-action="camp-sort"]');
    if(cs){
      state.campingSort = cs.value;
      renderView();
    }
   }catch(err){
     console.error('[wireGlobalActions:change]', err);
     toast('작업 중 오류가 발생했어요: ' + (err && err.message ? err.message : String(err)), 'fail');
   }
  });
}

/* ============================ BOOT ============================ */
function boot(){
  loadLocalHomeWidgets();
  renderNav();
  updateStatus();
  wireGlobalActions();
  initDb();
  // 웹(홈 화면 설치)용 오프라인 캐시. APK 안에서는 앱에 파일이 들어 있으므로 쓰지 않음.
  if('serviceWorker' in navigator && !window.Capacitor && location.protocol === 'https:'){
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  }
}
boot();
</script>
