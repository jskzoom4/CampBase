    <div class="field-row">
      <div class="field"><label>가격(원)</label><input type="number" id="gf-price" value="${g?(g.price||''):''}"></div>
      <div class="field"><label>무게(kg)</label><input type="number" step="0.1" id="gf-weight" value="${g?(g.weight||''):''}"></div>
    </div>
    <div class="field"><label>구매일</label><input type="date" id="gf-date" value="${g?(g.date||''):''}"></div>
    ${grp ? `<div class="field"><label>주인 (누구 장비인지)</label>
      <select id="gf-owner">
        <option value="">공용 · 주인 없음</option>
        ${sortedMemberUids(grp).map(u=>`<option value="${esc(u)}" ${g&&g.ownerUid===u?'selected':''}>${esc(memberName(grp,u))}${state.user&&u===state.user.uid?' (나)':''}</option>`).join('')}
        ${g && g.ownerUid && !grp.memberUids.includes(g.ownerUid) ? `<option value="${esc(g.ownerUid)}" selected>${esc(memberName(grp,g.ownerUid))}</option>` : ''}
      </select></div>` : ''}
    <div class="modal-actions">
      <button class="btn" data-action="modal-close">취소</button>
      <button class="btn btn-primary" data-action="gear-save" data-id="${id||''}">${icon('save')} 저장</button>
    </div>
  `);
}
function saveGearForm(id){
  const name = document.getElementById('gf-name').value.trim();
  if(!name){ toast('장비 이름을 입력해주세요.'); return; }
  // 수정할 때는 기존 필드(addedBy, ownerUid 등)를 그대로 두고 폼 값만 덮어씀
  const prev = id ? (SP.gear.find(x=>x.id===id) || {}) : {};
  const item = {
    ...prev,
    id: id || uid('g'),
    name,
    brand: document.getElementById('gf-brand').value,
    category: document.getElementById('gf-category').value,
    price: Number(document.getElementById('gf-price').value)||0,
    weight: Number(document.getElementById('gf-weight').value)||0,
    date: document.getElementById('gf-date').value || '',
  };
  const ownerEl = document.getElementById('gf-owner');
  if(inGroupSpace() && ownerEl){ if(ownerEl.value) item.ownerUid = ownerEl.value; else delete item.ownerUid; }
  if(id){ SP.gear = SP.gear.map(g=>g.id===id?item:g); }
  else{ SP.gear.push(item); }
  persistGear(item);
  closeModal(); renderView(); toast('저장했어요.');
}

  openModal(`

  `);

function categoryRowHtml(c){
  const locked = c === '기타';
  return `
    <div class="list-row" style="align-items:center;">
      <input class="cat-edit-input" data-old="${esc(c)}" value="${esc(c)}" style="flex:1;padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);font-size:13.5px;" ${locked?'disabled':''}>
      <div class="row-actions">
        ${locked ? `<span class="tag">기본값</span>` : `
          <button class="icon-btn" data-action="gear-cat-rename" data-old="${esc(c)}" title="이름 변경" aria-label="카테고리 이름 변경">${icon('save')}</button>
          <button class="icon-btn btn-danger" data-action="gear-cat-del" data-cat="${esc(c)}" title="삭제" aria-label="카테고리 삭제">${icon('trash')}</button>
        `}
      </div>
    </div>
  `;

function addGearCategory(name){
  if(!name){ toast('카테고리 이름을 입력해주세요.'); return; }
  if(SP.gearCategories.includes(name)){ toast('이미 있는 카테고리예요.'); return; }
  SP.gearCategories.push(name);
  persistGearCategories();
  categoryManageModal();
  renderView();
  toast('카테고리를 추가했어요.');
}
function renameGearCategory(oldName, newName){
  if(!newName){ toast('이름을 입력해주세요.'); return; }
  if(newName===oldName) return;
  if(SP.gearCategories.includes(newName)){ toast('이미 있는 이름이에요.'); return; }
  SP.gearCategories = SP.gearCategories.map(c=>c===oldName?newName:c);
  SP.gear.forEach(g=>{ if(g.category===oldName){ g.category=newName; persistGear(g); } });
  if(state.gearCategory===oldName) state.gearCategory=newName;
  persistGearCategories();
  categoryManageModal();
  renderView();
  toast('카테고리 이름을 바꿨어요.');
}
function deleteGearCategory(cat){
  if(cat==='기타'){ toast("'기타'는 삭제할 수 없어요."); return; }
  SP.gearCategories = SP.gearCategories.filter(c=>c!==cat);
  if(!SP.gearCategories.includes('기타')) SP.gearCategories.push('기타');
  const moved = SP.gear.filter(g=>g.category===cat);
  moved.forEach(g=>{ g.category='기타'; persistGear(g); });
  if(state.gearCategory===cat) state.gearCategory='all';
  persistGearCategories();
  categoryManageModal();
  renderView();
  toast(moved.length ? `카테고리를 삭제했어요. 장비 ${moved.length}개는 기타로 옮겨졌어요.` : '카테고리를 삭제했어요.');
}

/* ============================ CHECKLIST ============================ */
function groupChecklistItems(items){
  const order = []; const map = {};
  items.forEach(it=>{
    const g = it.group || '기타';
    if(!map[g]){ map[g]=[]; order.push(g); }
    map[g].push(it);
  });
  const ordered = order.filter(g=>g!=='기타');
  if(map['기타']) ordered.push('기타');
  return ordered.map(g=>({group:g, items:map[g]}));
}
function renderChecklist(){
  const grp = currentGroup();
  const myUid = state.user ? state.user.uid : null;
  // '내 담당'은 그룹 공간에서만
  const filter = (state.checklistFilter==='mine' && !grp) ? 'all' : (state.checklistFilter || 'all');
  const clFilters = [
    {key:'all', label:'전체'},
    {key:'done', label:'완료'},
    {key:'undone', label:'미완료'},
    ...(grp ? [{key:'mine', label:'내 담당'}] : []),
  ];
  const filterChips = cls => `<div class="seg-group ${cls||''}" role="group" aria-label="항목 거르기">
      ${clFilters.map(f=>`<div class="seg-btn ${f.key===filter?'active':''}" data-action="cl-filter" data-filter="${f.key}">${f.label}</div>`).join('')}
    </div>`;
  const selTrip = selectedTrip();
  const tripTitles = {};
  SP.trips.forEach(t=>{ tripTitles[t.id] = t.title; });
  const ctx = { grp, filter, myUid, selTrip, tripTitles };
  const top = `${spaceChipsHtml()}${state.user || state.bootMode==='preview' ? tripBarHtml() : ''}`;
  // 일정을 고르면: 일정 카드 + 준비물을 하나의 패널로(2-1)
  if(selTrip){
    const lists = SP.checklists.filter(cl=>cl.tripId===selTrip.id);
    return top + tripPanelHtml(selTrip, spaceKey(), grp, lists, filterChips('seg-sm'), ctx);
  }
  const lists = SP.checklists;
  return `
    ${top}
    <div class="section-head">
      <div style="min-width:0;flex:1;"><h1>${grp ? esc(grp.name) + ' 준비물' : '준비물 체크'}</h1><div class="section-desc one-line">${grp ? '멤버 모두가 함께 보고 체크하는 준비물이에요.' : '리스트 안에 소분류를 만들어 항목을 정리하세요.'}</div></div>
      <button class="btn btn-accent" data-action="cl-new-list">${icon('plus')} 새 리스트</button>
    </div>
    ${filterChips('cl-filter-row')}
    ${lists.length ? lists.map(cl=>checklistListHtml(cl, ctx, false)).join('')
      : `<div class="card empty">아직 체크리스트가 없어요. 새 리스트를 만들어보세요.</div>`}
  `;
}
// 리스트 하나(헤더 + 소분류 + 항목). inPanel이면 일정 패널 안의 구역(카드 테두리 대신 구분선 — 카드 안에 카드 금지)
function checklistListHtml(cl, ctx, inPanel){
  const { grp, filter, myUid, selTrip, tripTitles } = ctx;
  const allItems = cl.items||[];
  const decided = allItems.filter(isDecided).length;
  const total = allItems.length;
  const allDone = total>0 && decided===total;
  const visible = allItems.filter(it=> filter==='all' || (filter==='done'&&isDecided(it)) || (filter==='undone'&&!isDecided(it))
    || (filter==='mine' && !!myUid && it.assigneeUid===myUid));
  const groups = groupChecklistItems(visible);
  return `
      <div class="${inPanel ? 'panel-list' : 'card'} checklist-group">
        <h3>
          <span style="flex:1;min-width:0;">${esc(cl.title)}${!selTrip && cl.tripId && tripTitles[cl.tripId] ? ` <span class="tag trip-tag">${icon('calendar')}${esc(tripTitles[cl.tripId])}</span>` : ''}</span>
          ${allDone ? `<span class="tag done-tag">완료</span>` : `<span class="tag">${decided}/${total}</span>`}
          <button class="btn btn-sm cl-add-btn" data-action="cl-add-item" data-id="${cl.id}">${icon('plus')} 항목 추가</button>
          ${moreMenuHtml('cl:' + cl.id, [
            { action:'cl-list-rename', attrs:{'data-id':cl.id}, icon:'edit', label:'이름 변경' },
            decided>0 ? { action:'cl-list-reset', attrs:{'data-id':cl.id}, icon:'refresh', label:'전부 미정으로 초기화' } : null,
            { action:'cl-save-template', attrs:{'data-id':cl.id}, icon:'template', label:'템플릿으로 저장' },
            !grp && state.groups.length ? { action:'cl-send', attrs:{'data-id':cl.id}, icon:'send', label:'그룹으로 보내기(복사)' } : null,
            { action:'cl-del-list', attrs:{'data-id':cl.id}, icon:'trash', label:'리스트 삭제', danger:true },
          ], `'${cl.title}' 리스트 메뉴`)}
        </h3>
        ${groups.length ? groups.map(gr=>{
          const gDecided = gr.items.filter(isDecided).length;
          return `
          <div class="cl-subgroup">
            <div class="cl-subgroup-head">
              <span class="cl-subgroup-name">${esc(gr.group)}</span>
              <span class="tag">${gDecided}/${gr.items.length}</span>
              <div class="spacer"></div>
              <button class="icon-btn" data-action="cl-group-add" data-list="${cl.id}" data-group="${esc(gr.group)}" title="이 소분류에 항목 추가" aria-label="'${esc(gr.group)}'에 항목 추가">${icon('plus')}</button>
              ${gr.group!=='기타' ? moreMenuHtml('clg:' + cl.id + ':' + gr.group, [
                { action:'cl-group-rename', attrs:{'data-list':cl.id, 'data-group':gr.group}, icon:'edit', label:'소분류 이름 변경' },
              ], `'${gr.group}' 소분류 메뉴`) : ''}
            </div>
            ${gr.items.map(it=>{
              const status = itemStatus(it);
              return `
              <div class="check-row">
                <div class="cl-status-group">

      </div>`;
}
/* ============================ 캠핑 일정 ============================
 * 개인 users/{uid}/trips/{id}, 그룹 groups/{gid}/trips/{id}
 *   { title, startDate, endDate(YYYY-MM-DD), campsiteName, region, memberUids(그룹만), createdBy, createdAt, updatedBy }
 * 체크리스트의 선택 필드 tripId로 일정에 연결. 템플릿은 .../checklistTemplates/{id} = { title, items:[{label, group}] }.
 * Checklist 탭 위쪽 일정 줄(state.tripFilter)로 고르고, Home "다음 캠핑" 카드는 개인 + 내 모든 그룹 일정에서 고른다. */
function todayStr(){ const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function dayDiff(a, b){   // b - a (일)
  const pa = String(a).split('-').map(Number), pb = String(b).split('-').map(Number);
  return Math.round((Date.UTC(pb[0], pb[1]-1, pb[2]) - Date.UTC(pa[0], pa[1]-1, pa[2])) / 86400000);
}
const isYmd = v => /^\d{4}-\d{2}-\d{2}$/.test(String(v||''));
function tripEnd(t){ return isYmd(t.endDate) ? t.endDate : (t.startDate || ''); }
function tripPhase(t, today){
  today = today || todayStr();
  if(!isYmd(t.startDate)) return { kind:'nodate', label:'날짜 미정' };
  if(today < t.startDate){ const n = dayDiff(today, t.startDate); return { kind:'upcoming', label: 'D-' + n, days: n }; }
  if(today <= tripEnd(t)) return { kind:'ongoing', label:'진행 중' };
  return { kind:'past', label:'끝남', ago: dayDiff(tripEnd(t), today) };
}
function fmtTripDates(t){
  if(!isYmd(t.startDate)) return '';
  const [, m1, d1] = t.startDate.split('-').map(Number);
  const end = tripEnd(t);
  if(!end || end===t.startDate) return `${m1}월 ${d1}일`;
  const [, m2, d2] = end.split('-').map(Number);
  return m1===m2 ? `${m1}월 ${d1}일~${d2}일` : `${m1}월 ${d1}일~${m2}월 ${d2}일`;
}
function selectedTrip(){ return state.tripFilter==='all' ? null : (SP.trips.find(t=>t.id===state.tripFilter) || null); }
function tripsOf(space){ return space==='me' ? state.trips : (state.groupTrips[space] || []); }
function tripListsOf(space){ return space==='me' ? state.checklists : (state.space===space ? state.groupChecklists : (state.groupTripLists[space] || [])); }
// 연결된 리스트 항목 중 결정된 것/전체, 그룹이면 내 담당 중 남은 개수
function tripProgress(trip, lists, isGroup){
  let decided = 0, total = 0, mine = 0;
  const me = state.user ? state.user.uid : null;
  (lists||[]).filter(l=>l.tripId===trip.id).forEach(l=>(l.items||[]).forEach(it=>{
    total++; if(isDecided(it)) decided++;
    else if(isGroup && me && it.assigneeUid===me) mine++;
  }));
  return { decided, total, mine };
}
function hasMyReview(space, tripId){ return state.campingLogs.some(c=>c.tripRef && c.tripRef.space===space && c.tripRef.tripId===tripId); }
// 그룹 일정의 참가 멤버(없으면 그룹 멤버 전원)
function tripMembers(trip, g){ return (Array.isArray(trip.memberUids) && trip.memberUids.length) ? trip.memberUids : (g ? g.memberUids : []); }
function sortTrips(list){ return [...list].sort((a,b)=> String(a.startDate||'9999').localeCompare(String(b.startDate||'9999')) || String(a.title||'').localeCompare(String(b.title||''), 'ko')); }

function tripBarHtml(){
  const today = todayStr();
  const all = sortTrips(SP.trips);
  const current = all.filter(t=>tripPhase(t, today).kind!=='past');
  const past = all.filter(t=>tripPhase(t, today).kind==='past').reverse();
  const sel = state.tripFilter;
  const selIsPast = past.some(t=>t.id===sel);
  const chip = t=>`<div class="seg-btn trip-chip ${t.id===sel?'active':''}" data-action="trip-pick" data-trip="${esc(t.id)}">${esc(t.title)} <span class="num" style="opacity:.7;">${esc(tripPhase(t, today).label)}</span></div>`;
  return `
    <div class="trip-bar">
      <div class="seg-group trip-chips">
        <div class="seg-btn trip-chip ${sel==='all'?'active':''}" data-action="trip-pick" data-trip="all">전체</div>
        ${current.map(chip).join('')}
        ${past.length ? `<div class="seg-btn trip-past-toggle" data-action="trip-past-toggle">지난 일정 ${state.showPastTrips || selIsPast ? '▴' : '▾'} <span class="num" style="opacity:.7;">${past.length}</span></div>` : ''}
        ${state.showPastTrips || selIsPast ? past.map(chip).join('') : ''}
        <div class="seg-btn trip-new-chip" data-action="trip-new">${icon('plus')} 일정 만들기</div>

    </div>`;
}
// 일정 패널(2-1): 일정 카드와 그 일정의 준비물을 한 패널로. 머리(1줄)는 스크롤하면 한 줄 요약으로 위에 붙음(2-2, .stuck).
//   1줄: 달력 + 이름 · D-n(끝났으면 후기 남기기/내 후기 작성함) · ⋯(일정 수정·새 리스트·일정 삭제)
//   2줄: 날짜 · 캠핑장 · 지역 + 참가 멤버 사진 묶음   3줄: 진행 막대 + 준비 n/m · 내 담당 k   4줄: 필터 + "+ 리스트"
function tripPanelHtml(trip, space, g, lists, filtersHtml, ctx){

  return `

      <div class="trip-panel-head">
        <div class="tp-title">${icon('calendar')}<span class="tp-name">${esc(trip.title)}</span><span class="tp-mini"> · ${esc(ph.label)} · 준비 ${pr.decided}/${pr.total}</span></div>
        ${right}

        <span class="trip-progress-text">준비 <b class="num">${pr.decided}/${pr.total}</b>${g ? ` · 내 담당 <b class="num">${pr.mine}</b>` : ''}</span>

      ${lists.length ? lists.map(cl=>checklistListHtml(cl, ctx, true)).join('') : `

            <button class="btn btn-sm" data-action="trip-tpl-import" data-trip="${esc(trip.id)}">${icon('template')} 템플릿에서 가져오기</button>

function updateStickyHeads(){
  const main = document.getElementById('main');
  const head = main && main.querySelector('.trip-panel-head');
  if(!head) return;
  const panel = head.closest('.trip-panel');
  const mTop = main.getBoundingClientRect().top;
  head.classList.toggle('stuck', panel.getBoundingClientRect().top < mTop - 1 && head.getBoundingClientRect().top <= mTop + 1);
}

function newListFromTemplate(tpl, tripId){

function saveTripForm(id){
  const val = k=>{ const el = document.getElementById(k); return el ? el.value.trim() : ''; };
  const title = val('tf-title');
  const startDate = val('tf-start');
  let endDate = val('tf-end');
  if(!title){ toast('일정 이름을 입력해주세요.'); return; }
  if(!isYmd(startDate)){ toast('시작일을 골라주세요.'); return; }
  if(!isYmd(endDate)) endDate = startDate;
  if(endDate < startDate){ toast('종료일이 시작일보다 빨라요.'); return; }
  const g = currentGroup();
  const prev = id ? (SP.trips.find(t=>t.id===id) || {}) : {};
  const trip = { ...prev, id: id || uid('trip'), title, startDate, endDate, campsiteName: val('tf-campsite'), region: val('tf-region') };
  if(g){
    const picked = Array.from(document.querySelectorAll('.tf-member:checked')).map(el=>el.value);
    if(!picked.length){ toast('참가 멤버를 한 명 이상 골라주세요.'); return; }
    trip.memberUids = picked;
  }
  if(!id) trip.createdAt = new Date().toISOString();
  if(id) SP.trips = SP.trips.map(t=>t.id===id ? trip : t);
  else SP.trips = [...SP.trips, trip];
  persistTrip(trip);
  let msg = id ? '일정을 저장했어요.' : `'${title}' 일정을 만들었어요.`;
  if(!id){
    if(_tripStartMethod==='template'){
      const tplId = val('tf-template');
      const tpl = SP.templates.find(t=>t.id===tplId);
      if(tpl){ const list = newListFromTemplate(tpl, trip.id); SP.checklists.push(list); persistChecklist(list); msg += ` '${list.title}' 리스트를 템플릿에서 복사했어요.`; }
      else{ const list = { id: uid('cl'), title: title + ' 준비물', items: [], tripId: trip.id }; SP.checklists.push(list); persistChecklist(list); }
    }else if(_tripStartMethod==='link'){
      const list = SP.checklists.find(l=>l.id===val('tf-link'));

function deleteTripConfirm(id){
  const t = SP.trips.find(x=>x.id===id);

  const linked = SP.checklists.filter(l=>l.tripId===id);
  confirmModal(`'${t.title}' 일정을 삭제할까요? 연결된 리스트 ${linked.length}개는 지우지 않고 연결만 풀어요. 삭제한 뒤 잠깐 동안은 되돌릴 수 있어요.`, '삭제', ()=>{
    const space = spaceKey();
    const linkedIds = SP.checklists.filter(l=>l.tripId===id).map(l=>l.id);
    SP.checklists.forEach(l=>{ if(l.tripId===id){ delete l.tripId; persistChecklist(l); } });
    if(state.tripFilter===id) state.tripFilter = 'all';
    deleteDocWithUndo('trips', id, '일정을 삭제했어요.', db=>{
      const arr = spaceArray(space, 'checklists');
      linkedIds.forEach(lid=>{

function allMyTrips(){
  const me = state.user ? state.user.uid : null;
  const out = state.trips.map(t=>({ space:'me', group:null, trip:t }));
  state.groups.forEach(g=>{
    (state.groupTrips[g.id] || []).forEach(t=>{
      if(Array.isArray(t.memberUids) && t.memberUids.length && me && !t.memberUids.includes(me)) return;   // 참가하지 않는 그룹 일정은 빼기
      out.push({ space:g.id, group:g, trip:t });
    });
  });
  return out;
}
function nextTripHtml(){
  const today = todayStr();
  const all = allMyTrips();
  const next = all.filter(x=>['upcoming','ongoing'].includes(tripPhase(x.trip, today).kind))
    .sort((a,b)=> String(a.trip.startDate).localeCompare(String(b.trip.startDate)) || (a.space==='me' ? -1 : b.space==='me' ? 1 : 0))[0];
  const reviewDue = all.filter(x=>{ const ph = tripPhase(x.trip, today); return ph.kind==='past' && ph.ago <= 7 && !hasMyReview(x.space, x.trip.id); })
    .sort((a,b)=> String(tripEnd(b.trip)).localeCompare(String(tripEnd(a.trip))));
  let main;
  if(next){
    const t = next.trip, ph = tripPhase(t, today);
    const pr = tripProgress(t, tripListsOf(next.space), !!next.group);
    const parts = [ph.kind==='ongoing' ? '진행 중' : ph.label, fmtTripDates(t), t.campsiteName || t.region || '', `준비 ${pr.decided}/${pr.total}`];
    if(next.group) parts.push(`내 담당 ${pr.mine}개 남음`);
    main = `
      <div class="card next-trip-card" data-action="home-trip-open" data-space="${esc(next.space)}" data-trip="${esc(t.id)}">
        <div class="next-trip-icon">${icon('calendar')}</div>
        <div style="flex:1;min-width:0;">
          <div class="next-trip-label">다음 캠핑${next.group ? ` · <span class="tag">${icon('users','chev-mini')} ${esc(next.group.name)}</span>` : ''}</div>
          <div class="next-trip-title">${esc(t.title)}</div>
          <div class="next-trip-line">${parts.filter(Boolean).map(esc).join(' · ')}</div>
        </div>
        ${icon('chev', 'chev-mini')}
      </div>`;
  }else{
    main = `
      <div class="card next-trip-card next-trip-empty" data-action="home-trip-new">
        <div class="next-trip-icon">${icon('calendar')}</div>
        <div style="flex:1;"><div class="next-trip-title">다음 캠핑 일정을 만들어보세요</div><div class="next-trip-line">일정을 만들면 준비물 체크리스트와 함께 챙길 수 있어요.</div></div>

/* ---- 장비 ↔ 준비물 ----
 * 이름 비교: 공백·대소문자 무시, 한쪽이 다른 쪽을 포함하면 "비슷함"(추천용), 완전히 같으면 "같은 이름"(중복 건너뛰기용). */
function normName(s){ return String(s||'').replace(/\s+/g, '').toLowerCase(); }
function namesSimilar(a, b){ const x = normName(a), y = normName(b); return !!x && !!y && (x.includes(y) || y.includes(x)); }
// 담당자 추천: 항목 이름과 비슷한 "그룹 장비"의 주인(지금 멤버만). 다른 멤버의 개인 장비는 규칙상 볼 수 없어서 대상 아님.
function assigneeSuggestions(g, label){
  const byOwner = {};
  SP.gear.forEach(gr=>{
    if(!gr.ownerUid || !g.memberUids.includes(gr.ownerUid) || !namesSimilar(gr.name, label)) return;
    (byOwner[gr.ownerUid] = byOwner[gr.ownerUid] || []).push(gr.name);
  });
  return sortedMemberUids(g).filter(u=>byOwner[u]).map(u=>({ uid:u, gear: byOwner[u] }));
}
function assignSuggestHtml(g, listId, it){
  const sug = assigneeSuggestions(g, it.label);
  if(!sug.length) return '';
  return `<div id="assign-suggest" class="assign-suggest">
    ${sug.map(x=>`
      <div class="list-row member-pick suggest-pick ${it.assigneeUid===x.uid?'active':''}" data-action="cl-assign-set" data-list="${esc(listId)}" data-item="${esc(it.id)}" data-uid="${esc(x.uid)}" style="align-items:center;cursor:pointer;">
        ${memberAvatarHtml(g, x.uid)}
        <div style="flex:1;min-width:0;">
          <div class="name"><span class="tag suggest-tag">추천</span> ${esc(memberName(g, x.uid))} 장비 있음</div>
          <div class="meta">${x.gear.map(esc).join(', ')}</div>
        </div>
        ${it.assigneeUid===x.uid ? icon('check','pick-check') : ''}
      </div>`).join('')}
  </div>`;
}
// 장비 → 체크리스트: 지금 공간의 리스트(일정별로 묶음)를 골라 장비 이름을 항목으로, 카테고리를 소분류로 추가

function addGearToChecklist(){
  const sel = document.getElementById('g2c-list');
  const list = sel && SP.checklists.find(l=>l.id===sel.value);
  const ids = Array.from(document.querySelectorAll('.g2c-gear:checked')).map(el=>el.value);
  if(!list){ toast('넣을 리스트를 골라주세요.'); return; }
  if(!ids.length){ toast('추가할 장비를 골라주세요.'); return; }
  const grp = currentGroup(), me = state.user ? state.user.uid : null;
  list.items = Array.isArray(list.items) ? list.items : [];
  const have = new Set(list.items.map(it=>normName(it.label)));
  let added = 0, skipped = 0;
  SP.gear.filter(gr=>ids.includes(gr.id)).forEach(gr=>{
    const key = normName(gr.name);
    if(!key || have.has(key)){ skipped++; return; }
    have.add(key);
    const item = { id: uid('i'), label: gr.name, status:'pending', group: gr.category || '기타' };
    if(grp){
      if(me) item.addedBy = me;
      if(gr.ownerUid && grp.memberUids.includes(gr.ownerUid)) item.assigneeUid = gr.ownerUid;
    }
    list.items.push(item);
    added++;
  });
  if(added) persistChecklist(list);
  setGearSelecting(false);
  closeModal(); renderView();
  toast(`'${list.title}'에 ${added}개 추가` + (skipped ? `, ${skipped}개는 이미 있음` : '') + '.', added ? 'ok' : '');
}

}

/* ============================ MODAL / TOAST ============================ */
/* ---- 모달 규칙(CLAUDE.md "화면 규칙") ----
 * 모든 모달: 오른쪽 위 닫기(X), Esc로 닫기, 나타남/사라짐 효과(동작 줄이기 설정이면 없음).
 * 열리면 첫 입력칸(없으면 첫 버튼)으로 초점, Tab은 모달 안에서만 돌고, 닫히면 연 버튼으로 초점 복귀.
 * 입력칸이 있는 모달은 배경을 눌러도 닫히지 않음(입력이 날아가지 않게), 확인만 하는 모달은 배경을 누르면 닫힘. */
const FOCUSABLE = 'button:not([disabled]), [href], input:not([type="hidden"]):not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])';
let _modalOpener = null;
let _lastClick = { el: null, at: 0 };   // 마우스로 누른 버튼(포커스가 안 갈 수 있어서 따로 기억)
function reducedMotion(){ try{ return window.matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){ return false; } }
// 초점을 돌려줄 버튼을 기억. 다시 그려져서 없어져도 같은 data-action·data-id 버튼을 찾아 돌아간다.
function rememberOpener(){
  let el = (_lastClick.el && Date.now() - _lastClick.at < 1500) ? _lastClick.el : document.activeElement;
  if(!el || el===document.body || el.closest('#modal-root')) return;
  const menu = el.closest('.more');
  if(menu) el = menu.querySelector('.more-btn') || el;   // ⋯ 메뉴 항목으로 열었으면 ⋯ 버튼으로
  const sig = ['data-action','data-id','data-list','data-item','data-gid','data-trip','data-nav','data-key']
    .filter(k=>el.hasAttribute && el.hasAttribute(k)).map(k=>`[${k}="${CSS.escape(el.getAttribute(k))}"]`).join('');
  const more = el.classList && el.classList.contains('more-btn') ? el.getAttribute('data-more') : null;
  _modalOpener = { el, sig: more ? `.more-btn[data-more="${CSS.escape(more)}"]` : sig };
}
function restoreOpenerFocus(){
  const o = _modalOpener; _modalOpener = null;
  if(!o) return;
  let el = o.el && o.el.isConnected ? o.el : (o.sig ? document.querySelector(o.sig) : null);
  if(el && el.closest('.more-menu[hidden]')) el = el.closest('.more').querySelector('.more-btn');
  if(el && typeof el.focus==='function') el.focus({ preventScroll: true });
}
function modalHasInputs(root){ return !!root.querySelector('input:not([type="hidden"]), textarea, select'); }
function openModal(html){
  const root = document.getElementById('modal-root');
  if(!root.querySelector('#modal-backdrop')) rememberOpener();   // 모달에서 모달로 바뀔 때는 처음 연 버튼을 유지
  else ghostCurrentModal();
  closeAllMenus();
  root.innerHTML = `
    <div class="modal-backdrop" id="modal-backdrop">
      <div class="modal" role="dialog" aria-modal="true">
        <button type="button" class="icon-btn modal-x" data-action="modal-close" aria-label="닫기" title="닫기">${icon('close')}</button>
        <div class="modal-body">${html}</div>
      </div>
    </div>`;
  const bd = document.getElementById('modal-backdrop');
  const modal = bd.querySelector('.modal');
  // 맨 아래 버튼 줄(.modal-actions)은 본문 밖 고정 버튼 바로 옮김(3-5) — 스크롤하지 않아도 저장/취소가 보임
  const body = modal.querySelector('.modal-body');
  const acts = body.lastElementChild;
  if(acts && acts.classList.contains('modal-actions')){ acts.classList.remove('modal-actions'); acts.classList.add('modal-foot'); modal.appendChild(acts); }
  const h = modal.querySelector('h3');
  if(h){ h.id = 'modal-title'; modal.setAttribute('aria-labelledby', 'modal-title'); }
  bd.addEventListener('click', e=>{ if(e.target===bd && !modalHasInputs(modal)) closeModal(); });
  const first = modal.querySelector('input:not([type="hidden"]):not([type="checkbox"]):not([type="file"]), textarea:not([readonly]), select')
    || [...modal.querySelectorAll(FOCUSABLE)].find(el=>!el.classList.contains('modal-x'))
    || modal.querySelector('.modal-x');
  if(first) first.focus({ preventScroll: true });
}
// 닫히는 모달은 잠깐(사라지는 효과 동안) 따로 떼어 보여주기만 함 — 버튼·id를 지워 눌리거나 찾아지지 않게
function ghostCurrentModal(){
  const bd = document.getElementById('modal-backdrop');
  if(!bd) return;
  if(reducedMotion()){ bd.remove(); return; }
  bd.removeAttribute('id');
  bd.querySelectorAll('[id]').forEach(el=>el.removeAttribute('id'));
  bd.querySelectorAll('[data-action]').forEach(el=>el.removeAttribute('data-action'));
  bd.classList.add('closing');
  document.getElementById('modal-ghost').appendChild(bd);
  setTimeout(()=>bd.remove(), 170);
}
function closeModal(){
  const had = !!document.getElementById('modal-backdrop');
  ghostCurrentModal();
  document.getElementById('modal-root').innerHTML = '';
  _confirmCallback = null; _reviewModalKey = null;
  if(had) restoreOpenerFocus();
}
function trapModalTab(e){
  const modal = document.querySelector('#modal-root .modal');
  if(!modal) return;
  const items = [...modal.querySelectorAll(FOCUSABLE)].filter(el=>isShown(el) || el===document.activeElement);
  if(!items.length) return;
  const first = items[0], last = items[items.length-1];
  if(!modal.contains(document.activeElement)){ e.preventDefault(); first.focus(); return; }
  if(e.shiftKey && document.activeElement===first){ e.preventDefault(); last.focus(); }
  else if(!e.shiftKey && document.activeElement===last){ e.preventDefault(); first.focus(); }
}

/* ---- ⋯ 메뉴(공통 컴포넌트) ----
 * moreMenuHtml(key, items): items = [{ action, attrs:{data-*}, icon, label, danger }]. 위험한 항목(danger)은 빨간색으로 맨 아래.
 * 항목도 같은 data-action으로 wireGlobalActions()에서 처리. 바깥을 누르거나 Esc를 누르면 닫힘, 화살표/Home/End/Tab/Enter로 쓸 수 있음. */
function moreMenuHtml(key, items, label){
  items = (items || []).filter(Boolean);
  if(!items.length) return '';
  const safe = items.filter(it=>!it.danger), danger = items.filter(it=>it.danger);
  const btn = it=>`<button type="button" role="menuitem" tabindex="-1" class="more-item ${it.danger?'danger':''}" data-action="${it.action}" ${Object.entries(it.attrs||{}).map(([k,v])=>`${k}="${esc(v)}"`).join(' ')}>${it.icon ? icon(it.icon) : ''}<span>${esc(it.label)}</span></button>`;
  return `<div class="more">
    <button type="button" class="icon-btn more-btn" data-action="more-toggle" data-more="${esc(key)}" aria-haspopup="menu" aria-expanded="false" aria-label="${esc(label || '더 보기')}" title="${esc(label || '더 보기')}">${icon('dots')}</button>
    <div class="more-menu" role="menu" hidden>${safe.map(btn).join('')}${safe.length && danger.length ? '<div class="more-sep" role="separator"></div>' : ''}${danger.map(btn).join('')}</div>
  </div>`;
}
function closeAllMenus(except){
  document.querySelectorAll('.more-menu:not([hidden])').forEach(m=>{
    if(except && m===except) return;
    m.hidden = true;
    ['position','top','right','maxHeight','overflowY'].forEach(k=>{ m.style[k] = ''; });
    const w = m.closest('.more'); if(w){ w.classList.remove('up'); const b = w.querySelector('.more-btn'); if(b) b.setAttribute('aria-expanded','false'); }
  });
}
// 보이는지 판단: position:fixed 요소(하단 탭바 등)는 offsetParent가 항상 null이라 쓰면 안 됨 → 실제 스타일·크기로 판단
function isShown(el){
  if(!el || !el.isConnected) return false;
  const cs = getComputedStyle(el);
  if(cs.display==='none' || cs.visibility==='hidden') return false;
  const r = el.getBoundingClientRect();
  return r.width > 0 && r.height > 0;
}
// ⋯ 메뉴 위치: 아래로 펼쳐서 탭바·화면 밖으로 나가면 위로, 위로도 모자라면 화면 안(탭바 위)에 고정 위치로 맞춤
function placeMenu(wrap, menu, btn){
  wrap.classList.remove('up');
  const tab = document.getElementById('mobile-tabbar');
  const bottomLimit = (isShown(tab) ? tab.getBoundingClientRect().top : window.innerHeight) - 8;
  const topLimit = 8;
  if(menu.getBoundingClientRect().bottom <= bottomLimit) return;
  const b = btn.getBoundingClientRect(), mh = menu.offsetHeight;
  if(b.top - 4 - mh >= topLimit){ wrap.classList.add('up'); return; }
  menu.style.position = 'fixed';
  menu.style.top = Math.max(topLimit, bottomLimit - mh) + 'px';
  menu.style.right = Math.max(8, window.innerWidth - b.right) + 'px';
  menu.style.maxHeight = Math.max(80, bottomLimit - topLimit) + 'px';
  menu.style.overflowY = 'auto';
}
function toggleMenu(btn, focusLast){
  const wrap = btn.closest('.more'), menu = wrap && wrap.querySelector('.more-menu');
  if(!menu) return;
  const opening = menu.hidden;
  closeAllMenus(opening ? menu : null);
  menu.hidden = !opening;
  btn.setAttribute('aria-expanded', opening ? 'true' : 'false');
  wrap.classList.remove('up');
  if(!opening) return;
  placeMenu(wrap, menu, btn);
  const items = menu.querySelectorAll('.more-item');
  const target = focusLast ? items[items.length-1] : items[0];
  if(target) target.focus({ preventScroll: true });
}
function menuKeydown(e){
  const item = e.target.closest && e.target.closest('.more-item');
  const btn = e.target.closest && e.target.closest('.more-btn');
  if(btn && (e.key==='ArrowDown' || e.key==='ArrowUp')){
    e.preventDefault();
    const menu = btn.closest('.more').querySelector('.more-menu');
    if(menu.hidden) toggleMenu(btn, e.key==='ArrowUp');
    else{ const items = menu.querySelectorAll('.more-item'); (e.key==='ArrowUp' ? items[items.length-1] : items[0]).focus(); }
    return true;
  }
  if(!item) return false;
  const menu = item.closest('.more-menu');
  const items = [...menu.querySelectorAll('.more-item')];
  const i = items.indexOf(item);
  if(e.key==='ArrowDown'){ e.preventDefault(); items[(i+1) % items.length].focus(); return true; }
  if(e.key==='ArrowUp'){ e.preventDefault(); items[(i-1+items.length) % items.length].focus(); return true; }
  if(e.key==='Home'){ e.preventDefault(); items[0].focus(); return true; }
  if(e.key==='End'){ e.preventDefault(); items[items.length-1].focus(); return true; }
  if(e.key==='Tab'){ closeAllMenus(); return false; }
  return false;
}
// confirmModal: replaces window.confirm() for destructive actions. The
// sandboxed iframe this Artifact runs in silently blocks native confirm()/
// alert() dialogs (no popup ever appears and it just resolves as cancelled)
// — clicking a delete icon would then do nothing at all ("선택 시 무반응"),
// with no error either, since `if(!confirm(...)) break;` just quietly took
// the cancel branch. This draws the same confirmation as a normal in-app
// modal instead, which always renders.
let _confirmCallback = null;
function confirmModal(message, confirmLabel, onConfirm){
  _confirmCallback = onConfirm;
  openModal(`
    <h3>확인</h3>
    <p style="margin:0 0 4px;color:var(--text-dim);font-size:13.5px;line-height:1.6;">${esc(message)}</p>
    <div class="modal-actions">
      <button class="btn" data-action="modal-close">취소</button>
      <button class="btn btn-danger-solid" data-action="confirm-yes">${esc(confirmLabel||'확인')}</button>
    </div>
  `);
}
function showToast(msg, kind, withUndo, ms){
  const t = document.getElementById('toast');
  t.textContent = msg;
  if(withUndo){
    const b = document.createElement('button');
    b.className = 'toast-undo'; b.setAttribute('data-action', 'undo-delete'); b.textContent = '되돌리기';
    t.appendChild(b);
  }
  t.classList.remove('fail','ok','has-action'); if(kind) t.classList.add(kind);
  if(withUndo) t.classList.add('has-action');
  t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(()=>{ t.classList.remove('show'); if(withUndo) _undo = null; }, ms);
}
function toast(msg, kind){ _undo = null; showToast(msg, kind, false, 1800); }

/* ---- 삭제 되돌리기: 지운 직후 5초 동안 "삭제했어요 · 되돌리기" 토스트. 마지막 삭제 하나만 기억한다. ---- */
const UNDO_MS = 5000;
let _undo = null;   // { restore: fn }
function undoToast(msg, restore){
  _undo = { restore };
  showToast(msg, '', true, UNDO_MS);
}
function runUndo(){
  const u = _undo; _undo = null;
  if(!u) return;
  u.restore();
}
// 삭제한 그 공간('me' 또는 gid)의 화면 데이터 배열. 지금 다른 공간을 보고 있으면 null.
function spaceKey(){ return inGroupSpace() ? state.space : 'me'; }
const GROUP_SPACE_ARRAYS = { checklists:'groupChecklists', gear:'groupGear', checklistTemplates:'groupTemplates' };
function spaceArray(space, kind){
  if(space==='me') return state[kind];
  if(kind==='trips') return state.groupTrips[space] || null;
  if(state.space!==space) return null;
  return GROUP_SPACE_ARRAYS[kind] ? state[GROUP_SPACE_ARRAYS[kind]] : null;
}
function setSpaceArray(space, kind, arr){
  if(space==='me') state[kind] = arr;
  else if(kind==='trips') state.groupTrips[space] = arr;
  else if(state.space===space && GROUP_SPACE_ARRAYS[kind]) state[GROUP_SPACE_ARRAYS[kind]] = arr;
}
// 문서 하나(체크리스트·장비·캠핑 기록)를 지우고 되돌리기를 붙인다.
// 되돌리면 지우기 직전 문서를 같은 id·같은 내용(addedBy, updatedBy, ownerUid 등 포함) 그대로 다시 저장.
// after(db): 되돌린 뒤 추가로 할 일(예: 일정에 연결돼 있던 리스트 다시 연결)
function deleteDocWithUndo(kind, id, msg, after){
  const space = kind==='campingLogs' ? 'me' : spaceKey();
  const arr = spaceArray(space, kind) || [];
  const target = arr.find(x=>x.id===id);
  if(!target) return;
  const snapshot = unfreeze(target);
  const db = state.dbAvailable ? (space==='me' ? state.db : groupDb(space)) : null;
  setSpaceArray(space, kind, arr.filter(x=>x.id!==id));
  ({campingLogs: deleteCampingRemote, gear: deleteGearRemote, checklists: deleteChecklistRemote,
    trips: deleteTripRemote, checklistTemplates: deleteTemplateRemote})[kind](id);
  renderView(); refreshTripModalTemplates();
  undoToast(msg, ()=>{
    const now = spaceArray(space, kind);
    if(now && !now.some(x=>x.id===id)) now.push(unfreeze(snapshot));
    restoreDocRemote(db, kind, snapshot);
    if(after) after(db);
    renderView(); refreshTripModalTemplates(); toast('되돌렸어요.', 'ok');
  });
}
// 체크리스트 안의 항목 하나: 되돌리면 그 리스트의 원래 위치로 다시 넣는다.
function deleteChecklistItemWithUndo(listId, itemId){
  const space = spaceKey();
  const list = SP.checklists.find(c=>c.id===listId);
  const idx = list ? (list.items||[]).findIndex(i=>i.id===itemId) : -1;
  if(idx < 0) return;
  const item = unfreeze(list.items[idx]);
  const db = state.dbAvailable ? spaceDb() : null;
  list.items = list.items.filter(i=>i.id!==itemId);
  persistChecklist(list); renderView();
  const putBack = l=>{
    l.items = Array.isArray(l.items) ? l.items : [];
    if(!l.items.some(i=>i.id===itemId)) l.items.splice(Math.min(idx, l.items.length), 0, item);
    if(space!=='me' && state.user) l.updatedBy = state.user.uid;
    restoreDocRemote(db, 'checklists', l);
    renderView(); toast('되돌렸어요.', 'ok');
  };
  undoToast(`'${item.label}' 항목을 삭제했어요.`, ()=>{
    const arr = spaceArray(space, 'checklists');
    if(arr){
      const l = arr.find(c=>c.id===listId);
      if(l) putBack(l); else toast('리스트가 없어져서 되돌리지 못했어요.', 'fail');
      return;
    }
    // 그 사이 다른 공간으로 옮겨 감 → 저장소의 최신 리스트에 넣는다
    if(!db) return;
    db.collection('checklists').doc(listId).get().then(s=>{
      if(!s.exists){ toast('리스트가 없어져서 되돌리지 못했어요.', 'fail'); return; }
      putBack({ id: listId, ...unfreeze(s.data()) });
    }).catch(onSaveFail);
  });
}

/* ============================ GLOBAL EVENT DELEGATION ============================ */
function wireGlobalActions(){
  document.addEventListener('click', (e)=>{
   try{

      case 'gear-del': {

  document.addEventListener('keydown', (e)=>{
   try{

    const star = e.target.closest && e.target.closest('.star-btn');
    if(star && ['ArrowRight','ArrowUp','ArrowLeft','ArrowDown','Home','End'].includes(e.key)){
      e.preventDefault();
      const cur = Number((document.getElementById('cf-rating') || {}).value || 0);
      const next = e.key==='Home' ? 1 : e.key==='End' ? 5 : (e.key==='ArrowRight' || e.key==='ArrowUp') ? Math.min(5, cur + 1) : Math.max(0, cur - 1);
      setStarValue(next, true);
      return;

      const open = document.querySelector('.more-menu:not([hidden])');
      if(open){ e.preventDefault(); const b = open.closest('.more').querySelector('.more-btn'); closeAllMenus(); if(b) b.focus(); return; }
      if(document.getElementById('modal-backdrop')){ e.preventDefault(); closeModal(); }
      return;
    }
    if(e.key==='Tab' && document.getElementById('modal-backdrop')) trapModalTab(e);
   }catch(err){ console.error('[wireGlobalActions:keydown]', err); }
  });
  // 모바일 키보드가 올라오면(입력칸에 초점 / 화면 높이가 줄어듦) 하단 탭바를 숨김
  const kbdCheck = ()=>{
    const el = document.activeElement;
    const typing = !!el && (el.tagName==='TEXTAREA' || el.tagName==='SELECT' || (el.tagName==='INPUT' && !['checkbox','radio','button','file','submit'].includes(el.type)));
    const vv = window.visualViewport;
    const shrunk = !!vv && vv.height < window.innerHeight * 0.75;
    if(vv){ document.documentElement.style.setProperty('--vvh', vv.height + 'px'); document.documentElement.style.setProperty('--vvt', vv.offsetTop + 'px'); }
    // 모달 안 입력칸은 키보드가 올라온 뒤에도 보이게(고정 버튼 바는 본문 밖이라 가리지 않음)
    if(typing && el.closest('.modal-body')) setTimeout(()=>{ try{ el.scrollIntoView({ block:'nearest' }); }catch(e){} }, 250);
    document.body.classList.toggle('kbd-open', typing || shrunk);
  };
  // 화면 안에 고정 위치로 띄운 ⋯ 메뉴는 본문이 스크롤되면 닫음(버튼과 떨어지지 않게)
  document.getElementById('main').addEventListener('scroll', ()=>{

  }, { passive: true });
  document.addEventListener('focusin', kbdCheck);
  document.addEventListener('focusout', ()=>setTimeout(kbdCheck, 50));
  if(window.visualViewport) window.visualViewport.addEventListener('resize', kbdCheck);
  if(window.visualViewport) window.visualViewport.addEventListener('scroll', kbdCheck);

   }

/* ============================ 앱 버전 / 새 버전 안내 (APK만) ============================
 * 워크플로가 APK를 만들 때 vendor/build-info.js(저장소에는 없음)에 window.CAMPBASE_BUILD = { number: 빌드 번호 }를 넣는다.
 * APK를 열면 하루 한 번(온라인일 때만) GitHub 공개 API로 최신 Release 태그(build-N)를 보고,
 * 내 빌드보다 크면 위쪽에 "새 버전이 있어요 · 받기" 배너. 실패하면 조용히 넘어감. 웹은 확인하지 않음. */
const UPDATE_REPO = 'jskzoom4/CampBase';
const LATEST_APK_URL = 'https://github.com/' + UPDATE_REPO + '/releases/latest/download/campbase.apk';
const LATEST_RELEASE_API = 'https://api.github.com/repos/' + UPDATE_REPO + '/releases/latest';
const UPDATE_CHECK_KEY = 'campbase.updateCheck';        // { at: 밀리초, latest: 최신 빌드 번호 }
const UPDATE_DISMISS_KEY = 'campbase.updateDismissed';  // 닫은 최신 빌드 번호
const UPDATE_CHECK_MS = 24 * 60 * 60 * 1000;
function buildNumber(){
  const b = window.CAMPBASE_BUILD;
  const n = b && Number(b.number);
  return Number.isFinite(n) && n > 0 ? n : null;
}
function appVersionText(){
  if(!isNativeApp()) return '웹 버전';
  const n = buildNumber();
  return n ? '앱 버전: 빌드 ' + n : '앱 버전: 알 수 없음';
}
function loadBuildInfo(){
  return new Promise(resolve=>{
    if(window.CAMPBASE_BUILD) return resolve();
    const s = document.createElement('script');
    s.src = 'vendor/build-info.js';
    s.onload = ()=>resolve(); s.onerror = ()=>resolve();
    document.head.appendChild(s);
  });
}
function parseBuildTag(tag){ const m = /^build-(\d+)$/.exec(String(tag||'').trim()); return m ? Number(m[1]) : null; }
function readJsonLS(key){ try{ return JSON.parse(localStorage.getItem(key) || 'null'); }catch(e){ return null; } }
function showUpdateBanner(latest){
  const el = document.getElementById('update-banner');
  if(!el) return;
  el.innerHTML = `${icon('refresh')}<span>새 버전이 있어요 <span class="num" style="color:var(--text-dim);">(빌드 ${latest})</span></span><span class="spacer"></span>
    <button class="btn btn-sm btn-primary" data-action="update-get">받기</button>
    <button class="icon-btn" data-action="update-dismiss" data-latest="${latest}" title="닫기" aria-label="닫기">${icon('close')}</button>`;
  el.classList.add('show');
}
function hideUpdateBanner(){ const el = document.getElementById('update-banner'); if(el){ el.classList.remove('show'); el.innerHTML = ''; } }
async function checkForUpdate(){
  try{
    if(!isNativeApp()) return;
    await loadBuildInfo();
    if(state.currentView==='settings' && document.body.classList.contains('signed-out')===false) renderView();
    const mine = buildNumber();
    if(!mine) return;
    let cached = readJsonLS(UPDATE_CHECK_KEY);
    let latest = cached && Number(cached.latest) || null;
    const fresh = cached && Number(cached.at) && (Date.now() - Number(cached.at) < UPDATE_CHECK_MS);
    if(!fresh && navigator.onLine !== false){
      const ctrl = window.AbortController ? new AbortController() : null;
      const timer = setTimeout(()=>{ if(ctrl) ctrl.abort(); }, 8000);
      try{
        const res = await fetch(LATEST_RELEASE_API, { headers: { Accept: 'application/vnd.github+json' }, signal: ctrl ? ctrl.signal : undefined, cache: 'no-store' });
        if(res.ok){
          const n = parseBuildTag((await res.json()).tag_name);
          if(n){ latest = n; try{ localStorage.setItem(UPDATE_CHECK_KEY, JSON.stringify({ at: Date.now(), latest: n })); }catch(e){} }
        }
      }finally{ clearTimeout(timer); }
    }
    const dismissed = Number(readJsonLS(UPDATE_DISMISS_KEY)) || 0;
    if(latest && latest > mine && latest !== dismissed) showUpdateBanner(latest);
  }catch(e){ console.warn('[update-check]', e && e.message); }   // 확인 실패는 조용히 넘어감
}
function openExternal(url){
  // APK(Capacitor)는 앱 밖 주소로 이동하면 기본 브라우저로 연다(앱 화면은 그대로).
  window.location.href = url;
}

/* ============================ BOOT ============================ */
function boot(){
  loadLocalHomeWidgets();
  renderNav();
  updateStatus();
  wireGlobalActions();
  initDb();
  checkForUpdate();
  // 웹(홈 화면 설치)용 오프라인 캐시. APK 안에서는 앱에 파일이 들어 있으므로 쓰지 않음.
  if('serviceWorker' in navigator && !window.Capacitor && location.protocol === 'https:'){
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  }
}
boot();
