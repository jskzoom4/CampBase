<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>캠프베이스</title>
<meta name="theme-color" content="#2f6f4f">
<meta name="description" content="함께 쓰는 캠핑 준비물·장비·후기 기록">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="캠프베이스">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --brand:#2f6f4f; --brand-dark:#1f4d36; --accent:#d98e2f; --good:#2f9e5e; --warn:#c98a2c; --bad:#c1503f;
    --bg:#f7f6f2; --surface:#ffffff; --surface-2:#f0eee7; --border:#e4e1d8; --text:#1f2420; --text-dim:#6b6f68;
    --radius:14px;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#141815; --surface:#1c211d; --surface-2:#232821; --border:#333a32; --text:#eceae3; --text-dim:#9aa199;
      --brand:#4d9b74; --brand-dark:#3a7f5c; --accent:#e3a54f;
    }
  }
  :root[data-theme="dark"]{
    --bg:#141815; --surface:#1c211d; --surface-2:#232821; --border:#333a32; --text:#eceae3; --text-dim:#9aa199;
    --brand:#4d9b74; --brand-dark:#3a7f5c; --accent:#e3a54f;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:"Work Sans","Apple SD Gothic Neo","Malgun Gothic",sans-serif;}
  .disp{font-family:"Fraunces",serif;}
  .num{font-family:"JetBrains Mono",monospace;}
  button, input, select, textarea{font-family:inherit;color:inherit;}
  #app{display:flex;height:100vh;overflow:hidden;}

  /* ---- sidebar ---- */
  #sidebar{width:216px;min-width:216px;background:var(--surface);border-right:1px solid var(--border);
    display:flex;flex-direction:column;padding:16px 12px;}
  .brand{display:flex;align-items:center;gap:9px;padding:6px 8px 18px;}
  .brand-badge{width:30px;height:30px;border-radius:9px;background:var(--brand);color:#fff;
    display:flex;align-items:center;justify-content:center;flex:none;}
  .brand-badge svg{width:18px;height:18px;}
  .brand-name{font-family:"Fraunces",serif;font-weight:700;font-size:16px;}
  .brand-sub{font-size:10.5px;color:var(--text-dim);}
  nav#nav{display:flex;flex-direction:column;gap:2px;}
  .nav-item{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:9px;
    color:var(--text-dim);cursor:pointer;border:1px solid transparent;font-size:14px;font-weight:500;
    transition:background .12s ease,color .12s ease;}
  .nav-item svg{width:18px;height:18px;flex:none;}
  .nav-item:hover{background:var(--surface-2);color:var(--text);}
  .nav-item.active{background:var(--brand);color:#fff;}
  .nav-spacer{flex:1;}
  .nav-foot{font-size:11px;color:var(--text-dim);padding:10px 10px 2px;line-height:1.5;}
  .dot-status{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--good);margin-right:5px;position:relative;top:-1px;}
  .dot-status.local{background:var(--warn);}
  .dot-status.err{background:var(--bad);}

  /* ---- main ---- */
  #main-wrap{flex:1;min-width:0;display:flex;flex-direction:column;}
  #topbar{display:flex;align-items:center;gap:14px;padding:16px 26px;border-bottom:1px solid var(--border);
    background:var(--bg);position:sticky;top:0;z-index:5;}
  #topbar h2{margin:0;font-size:21px;}
  #main{flex:1;overflow-y:auto;padding:22px 26px 60px;}
  .section-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:16px;flex-wrap:wrap;}
  .section-head h1{font-size:20px;margin:0 0 4px;}
  .section-desc{font-size:12.5px;color:var(--text-dim);margin:0;line-height:1.5;}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;}
  .grid{display:grid;gap:14px;}
  .empty{color:var(--text-dim);font-size:13px;padding:18px 4px;text-align:center;}

  .btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--surface);
    color:var(--text);border-radius:9px;padding:8px 13px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;}
  .btn svg{width:15px;height:15px;}
  .btn:hover{background:var(--surface-2);}
  .btn-accent{background:var(--accent);border-color:var(--accent);color:#fff;}
  .btn-primary{background:var(--brand);border-color:var(--brand);color:#fff;}
  .btn-ghost{background:transparent;}
  .btn-sm{padding:6px 10px;font-size:12px;}
  .btn-danger{color:var(--bad);}
  .btn-danger-solid{background:var(--bad);border-color:var(--bad);color:#fff;}
  .btn-danger-solid:hover{opacity:.9;}

  .tag{display:inline-block;background:var(--surface-2);color:var(--text-dim);border-radius:6px;padding:2px 8px;font-size:11px;font-weight:600;}
  .tag.accent{background:color-mix(in srgb, var(--accent) 20%, transparent);color:var(--accent);}

  /* ---- home ---- */
  .weather-widget{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg, color-mix(in srgb, var(--brand) 14%, transparent), transparent);
    border:1px solid var(--border);border-radius:var(--radius);padding:14px 18px;margin-bottom:18px;flex-wrap:wrap;}
  .weather-widget .temp{font-family:"Fraunces",serif;font-size:32px;font-weight:600;}
  .weather-widget .loc{font-weight:700;font-size:14px;}
  .weather-widget .desc{font-size:12px;color:var(--text-dim);}
  .weather-widget .spacer{flex:1;}
  .stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:6px;}
  .stat-card{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;}
  .stat-card h3{margin:0;font-size:13.5px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:3px;}
  .stat-card .legend{display:flex;flex-direction:column;gap:3px;width:100%;font-size:11.5px;color:var(--text-dim);}
  .legend-row{display:flex;align-items:center;gap:6px;}
  .legend-dot{width:8px;height:8px;border-radius:50%;flex:none;}
  .legend-row .lv{flex:1;text-align:left;}
  .stat-card .big-num{font-family:"JetBrains Mono",monospace;font-size:22px;font-weight:700;}
  .home-cat-link{cursor:pointer;border-radius:6px;transition:background .12s ease;}
  .legend-row.home-cat-link{padding:3px 4px;margin:0 -4px;}
  .home-cat-link:hover{background:var(--surface-2);color:var(--brand);}
  .chev-mini{width:12px!important;height:12px!important;opacity:.6;}

  /* ---- forms/modal ---- */
  .modal-backdrop{position:fixed;inset:0;background:rgba(20,24,20,.5);display:flex;align-items:center;justify-content:center;
    padding:20px;z-index:50;}
  .modal{background:var(--surface);border-radius:16px;padding:22px;width:100%;max-width:440px;max-height:88vh;overflow-y:auto;
    box-shadow:0 20px 60px rgba(0,0,0,.3);}
  .modal h3{margin:0 0 14px;font-size:17px;}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:12px;font-weight:600;color:var(--text-dim);margin-bottom:5px;}
  .field input, .field select, .field textarea{width:100%;padding:9px 10px;border:1px solid var(--border);
    border-radius:9px;background:var(--bg);font-size:13.5px;}
  .field textarea{resize:vertical;min-height:64px;}
  .field-row{display:flex;gap:10px;}
  .field-row .field{flex:1;}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;}
  .seg-group{display:flex;gap:6px;flex-wrap:wrap;}
  .seg-btn{padding:7px 12px;border-radius:8px;border:1px solid var(--border);background:var(--bg);font-size:12.5px;cursor:pointer;}
  .seg-btn.active{background:var(--brand);border-color:var(--brand);color:#fff;}
  .form-subhead{font-size:12px;font-weight:700;color:var(--text-dim);margin:16px 0 8px;padding-top:12px;border-top:1px solid var(--border);}

  /* ---- lists ---- */
  .list-row{display:flex;align-items:flex-start;gap:10px;padding:12px 4px;border-bottom:1px solid var(--border);}
  .list-row:last-child{border-bottom:none;}
  .list-row .name{font-weight:700;font-size:14px;}
  .list-row .meta{font-size:12px;color:var(--text-dim);margin-top:2px;}
  .list-row .notes{font-size:12.5px;color:var(--text-dim);margin-top:4px;line-height:1.5;}
  .list-row .row-actions{display:flex;gap:6px;flex:none;}
  .icon-btn{background:none;border:none;padding:4px;cursor:pointer;color:var(--text-dim);border-radius:6px;}
  .icon-btn:hover{background:var(--surface-2);color:var(--text);}
  .icon-btn svg{width:16px;height:16px;}

  .banner{display:flex;align-items:flex-start;gap:10px;background:var(--surface-2);border:1px solid var(--border);
    border-radius:10px;padding:10px 12px;font-size:12.5px;color:var(--text-dim);margin-bottom:14px;}
  .banner svg{width:16px;height:16px;flex:none;margin-top:1px;}

  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(10px);background:var(--text);
    color:var(--bg);padding:10px 16px;border-radius:9px;font-size:13px;opacity:0;pointer-events:none;
    transition:opacity .18s ease, transform .18s ease;z-index:80;border-left:3px solid transparent;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .toast.fail{border-left-color:var(--bad);}
  .toast.ok{border-left-color:var(--good);}

  .switch{position:relative;display:inline-block;width:40px;height:23px;flex:none;}
  .switch input{opacity:0;width:0;height:0;}
  .switch .slider{position:absolute;inset:0;cursor:pointer;background:var(--border);border-radius:23px;transition:.15s ease;}
  .switch .slider:before{position:absolute;content:"";height:17px;width:17px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.15s ease;}
  .switch input:checked + .slider{background:var(--brand);}
  .switch input:checked + .slider:before{transform:translateX(17px);}

  .checklist-group{margin-bottom:18px;}
  .checklist-group h3{font-family:"Fraunces",serif;font-size:16.5px;font-weight:700;margin:0 0 10px;display:flex;align-items:center;gap:8px;}
  .cl-subgroup{margin-bottom:10px;padding-left:14px;border-left:2px solid var(--border);}
  .cl-subgroup:last-child{margin-bottom:0;}
  .cl-subgroup-head{display:flex;align-items:center;gap:2px;padding:5px 2px 6px;border-bottom:1px dashed var(--border);margin-bottom:2px;}
  .cl-subgroup-head .spacer{flex:1;}
  .cl-subgroup-name{font-size:11.5px;font-weight:700;color:var(--text-dim);letter-spacing:.3px;text-transform:uppercase;}
  .check-row{display:flex;align-items:center;gap:9px;padding:8px 2px;border-bottom:1px solid var(--border);}
  .check-row:last-child{border-bottom:none;}
  .check-row .label{flex:1;font-size:13.5px;}
  .check-row .label.done{text-decoration:line-through;color:var(--text-dim);}
  .check-row .label.skip{color:var(--text-dim);font-style:italic;}
  .cl-status-group{display:flex;gap:4px;flex:none;}
  .cl-status-btn{width:26px;height:26px;border-radius:7px;border:1px solid var(--border);background:var(--bg);
    display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-dim);padding:0;}
  .cl-status-btn svg{width:14px;height:14px;}
  .cl-status-btn:hover{background:var(--surface-2);}
  .cl-status-btn.packed.active{background:var(--good);border-color:var(--good);color:#fff;}
  .cl-status-btn.skip.active{background:var(--text-dim);border-color:var(--text-dim);color:#fff;}
  .tag.done-tag{background:color-mix(in srgb, var(--good) 20%, transparent);color:var(--good);}
  .tag.skip-tag{margin-left:6px;}

  .placeholder-card{text-align:center;padding:48px 20px;}
  .placeholder-card svg{width:44px;height:44px;color:var(--text-dim);margin-bottom:12px;}
  .placeholder-card h2{margin:0 0 8px;}
  .placeholder-card p{color:var(--text-dim);font-size:13.5px;max-width:440px;margin:0 auto;line-height:1.6;}
  .placeholder-card-sm{text-align:center;padding:22px 14px;cursor:pointer;}
  .placeholder-icon-sm{width:26px;height:26px;color:var(--text-dim);margin-bottom:8px;}

  #mobile-topbar{display:none;}
  @media (max-width:820px){
    #sidebar{display:none;}
    #mobile-topbar{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;background:var(--surface);
      border-bottom:1px solid var(--border);}
    .mnav-item{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:var(--text-dim);
      padding:6px 12px;border-radius:10px;flex:none;cursor:pointer;}
    .mnav-item.active{background:var(--brand);color:#fff;}
    .mnav-item svg{width:17px;height:17px;}
    #topbar{padding:12px 16px;}
    #main{padding:16px 14px 60px;}
    .stat-grid{grid-template-columns:1fr;}
    .field-row{flex-direction:column;}
  }
  /* ---- 공유 앱(웹/APK) 전용 ---- */
  #db-status-top{display:none;margin-left:auto;align-items:center;font-size:11px;color:var(--text-dim);
    background:var(--surface-2);border:1px solid var(--border);border-radius:999px;padding:4px 10px;white-space:nowrap;}
  @media (max-width:820px){ #db-status-top{display:inline-flex;} }
  .preview-banner{background:color-mix(in srgb, var(--warn) 16%, transparent);border:1px solid color-mix(in srgb, var(--warn) 45%, transparent);
    color:var(--text);border-radius:10px;padding:10px 12px;font-size:12.5px;line-height:1.5;margin-bottom:14px;}
  .backup-text{width:100%;min-height:160px;font-family:"JetBrains Mono",monospace;font-size:11.5px;padding:9px 10px;
    border:1px solid var(--border);border-radius:9px;background:var(--bg);color:var(--text);resize:vertical;}
  html,body{height:100%;}
  #app{height:100vh;height:100dvh;}
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="brand">
      <div class="brand-badge">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20l6-11 4 6.5L16.5 8 21 20z"/><circle cx="8.2" cy="6.5" r="1.6" fill="currentColor" stroke="none"/></svg>
      </div>
      <div>
        <div class="brand-name">캠프베이스</div>
        <div class="brand-sub">함께 쓰는 캠핑 노트</div>
      </div>
    </div>
    <nav id="nav"></nav>
    <div class="nav-spacer"></div>
    <div class="nav-foot" id="db-status">연결 확인 중…</div>
  </aside>

  <div id="main-wrap">
    <div id="mobile-topbar"></div>
    <div id="topbar">
      <h2 id="view-title" class="disp">Home</h2>
      <span id="db-status-top">연결 확인 중…</span>
    </div>
    <div id="main"></div>
  </div>
</div>
<div id="modal-root"></div>
<div class="toast" id="toast"></div>

<script src="firebase-config.js"></script>
<script>
/* ============================ ICONS ============================ */
const ICONS = {
  home:'<path d="M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10"/>',
  camping:'<path d="M3 20l6-11 4 6.5L16.5 8 21 20z"/><circle cx="8.2" cy="6.5" r="1.6" fill="currentColor" stroke="none"/>',
  gear:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.2a1.6 1.6 0 0 0-1-1.5 1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.2a1.6 1.6 0 0 0 1.5-1 1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3h0a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.2a1.6 1.6 0 0 0 1 1.5h0a1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8v0a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.2a1.6 1.6 0 0 0-1.5 1z"/>',
  weather:'<path d="M8 19a4 4 0 1 1 .8-7.9A5.5 5.5 0 1 1 18.5 15H8a4 4 0 0 1 0 4z"/>',
  checklist:'<rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 12l2.5 2.5L16 9"/>',
  cooking:'<path d="M4 12h16M6 12a6 6 0 0 1 12 0M4 12l1 8h14l1-8"/><path d="M9 6.5c0-1.5 1-2 1-3.5M13 6.5c0-1.5 1-2 1-3.5"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  trash:'<path d="M4 7h16M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2m2 0-.8 12.1a2 2 0 0 1-2 1.9H7.8a2 2 0 0 1-2-1.9L5 7"/>',
  edit:'<path d="M4 20h4l10-10-4-4L4 16z"/>',
  star:'<path d="M12 3l2.7 5.9 6.3.6-4.8 4.3 1.4 6.2L12 17l-5.6 3 1.4-6.2L3 9.5l6.3-.6z"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  info:'<circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 11h1v5h1"/>',
  save:'<path d="M4 4h13l3 3v13H4z"/><path d="M8 4v6h8V4M8 21v-7h8v7"/>',
  chev:'<path d="M9 6l6 6-6 6"/>',
  drop:'<path d="M12 3s7 7.5 7 12a7 7 0 0 1-14 0c0-4.5 7-12 7-12z"/>',
  settings:'<path d="M4 7h9M17 7h3M4 12h3M9 12h11M4 17h13M19 17h1"/><circle cx="15" cy="7" r="2.4"/><circle cx="7" cy="12" r="2.4"/><circle cx="17" cy="17" r="2.4"/>',
  check:'<path d="M5 12.5l4.5 4.5L19 7"/>',
  close:'<path d="M6 6l12 12M18 6L6 18"/>',
  refresh:'<path d="M4 12a8 8 0 0 1 14-5.3M20 12a8 8 0 0 1-14 5.3"/><path d="M18 3v4h-4M6 21v-4h4"/>',
};
function icon(name, cls){ return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" class="${cls||''}">${ICONS[name]||''}</svg>`; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function uid(prefix){ return prefix+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function stripId(obj){ const {id, ...rest} = obj; return rest; }
// unfreeze: db snapshot data can come back with nested arrays/objects that
// are frozen/non-extensible (only the top-level doc object is a fresh copy;
// nested fields like items[] keep the original frozen reference). Mutating
// those directly (e.g. list.items.push(...)) throws synchronously with
// "Cannot add property N, object is not extensible" — this deep-clones
// snapshot data into plain, freely-mutable objects/arrays so app code can
// safely push/assign into anything nested without knowing about this.
function unfreeze(v){ return v==null ? v : JSON.parse(JSON.stringify(v)); }

// itemStatus: checklist items are tri-state — '가져감'(packed), '안 가져감'(skip,
// intentionally left behind), or 미정(pending, default). Older items only ever
// had a boolean `checked` field; this reads the new `status` field when present
// and falls back to the legacy boolean so existing saved checklists keep working.
function itemStatus(it){
  if(it && it.status) return it.status;
  return (it && it.checked) ? 'packed' : 'pending';
}
function isDecided(it){ return itemStatus(it) !== 'pending'; }

/* ============================ STATIC DATA ============================ */
const FEATURE_DEFS = [
  {id:'home', label:'Home', icon:'home'},
  {id:'camping', label:'Camping', icon:'camping'},
  {id:'gear', label:'Gear', icon:'gear'},
  {id:'checklist', label:'Checklist', icon:'checklist'},
  {id:'cooking', label:'Cooking', icon:'cooking'},
  {id:'settings', label:'Settings', icon:'settings'},
];
const HOME_WIDGET_DEFS = [
  {key:'location', label:'기준 지역 위젯', desc:'Home 상단의 캠핑 계획용 기준 지역 선택 위젯'},

// siteSize는 자유 텍스트("5x5m", "20평" 등)라 정확한 단위 비교는 불가능하지만,
// 숫자를 뽑아 대략적인 크기로 정렬할 수 있게 함: "AxB" 형태면 A*B(면적)로,
// 숫자가 하나면 그 값 그대로, 숫자가 없으면 0으로 취급(항상 뒤로 감).
function siteSizeValue(s){
  const nums = (String(s||'').match(/\d+(\.\d+)?/g) || []).map(Number);
  if(nums.length>=2) return nums[0]*nums[1];
  if(nums.length===1) return nums[0];
  return 0;
}
function campComparator(sortKey){
  const byDateDesc = (a,b)=> (b.date||'').localeCompare(a.date||'');

    case 'rating_asc': return (a,b)=> ((a.rating||0)-(b.rating||0)) || byDateDesc(a,b);
    case 'size_desc': return (a,b)=> (siteSizeValue(b.siteSize)-siteSizeValue(a.siteSize)) || byDateDesc(a,b);
    case 'size_asc': return (a,b)=> (siteSizeValue(a.siteSize)-siteSizeValue(b.siteSize)) || byDateDesc(a,b);
    default: return byDateDesc;
  }
}

/* ---- 공유 저장소: Firebase Firestore ----
 * 앱의 나머지 코드는 예전(claude.ai) 저장 인터페이스
 *   db.collection(name).onSnapshot/doc(id).set/delete/get, db.doc(path)...
 * 를 그대로 쓰고, 아래 어댑터가 그걸 Firestore 호출로 바꿔준다.
 * 설정값(firebase-config.js)이 비어 있으면 '미리보기 모드'(저장 안 됨)로 동작. */
const FIREBASE_SDK_VERSION = '10.12.2';
const FIREBASE_CDN = 'https://www.gstatic.com/firebasejs/' + FIREBASE_SDK_VERSION + '/';
state.bootMode = 'connecting';   // 'shared' | 'preview' | 'error'
state.online = true;

function firebaseConfigured(){
  const c = window.FIREBASE_CONFIG;
  if(!c || !c.apiKey || !c.projectId) return false;
  return !/붙여넣|YOUR_|PASTE|여기에/i.test(String(c.apiKey) + String(c.projectId));
}
async function loadFirebaseModules(bases){
  if(window.__FIREBASE_MODULES__) return {...window.__FIREBASE_MODULES__, base:'injected'}; // 테스트용 주입
  let lastErr;
  for(const base of bases){
    try{
      const app = await import(base + 'firebase-app.js');
      const firestore = await import(base + 'firebase-firestore.js');
      return {app, firestore, base};
    }catch(e){ lastErr = e; }
  }
  throw lastErr || new Error('Firebase SDK를 불러오지 못했어요');
}
function buildFirestoreDb(mods){
  const appMod = mods.app, fs = mods.firestore;
  const apps = appMod.getApps ? appMod.getApps() : [];
  const app = apps.length ? apps[0] : appMod.initializeApp(window.FIREBASE_CONFIG);
  let fdb;
  try{
    fdb = fs.initializeFirestore(app, {
      ignoreUndefinedProperties: true,
      // 캠핑장처럼 신호가 약한 곳에서도 열리고, 체크한 내용은 연결되면 자동 동기화
      localCache: fs.persistentLocalCache({ tabManager: fs.persistentMultipleTabManager() }),
    });
  }catch(e){
    fdb = fs.getFirestore(app);
  }
  return makeFirestoreAdapter(fs, fdb);
}
async function connectFirestore(){
  // APK에는 SDK가 앱 안(vendor/)에 들어 있어 오프라인 첫 실행도 가능. 웹에서는 CDN 사용.
  let mods = await loadFirebaseModules(['./vendor/firebase/', FIREBASE_CDN]);
  try{ return buildFirestoreDb(mods); }
  catch(e){
    if(mods.base !== FIREBASE_CDN && mods.base !== 'injected'){
      mods = await loadFirebaseModules([FIREBASE_CDN]);
      return buildFirestoreDb(mods);
    }
    throw e;
  }
}
function makeFirestoreAdapter(fs, fdb){
  const wrapQuery = snap => ({ empty: snap.empty, docs: snap.docs.map(d=>({ id: d.id, data: ()=>d.data() })) });
  const wrapDoc = snap => ({ exists: snap.exists(), data: ()=>snap.data() });
  function listen(ref, isDoc, cb, errCb){
    let first = true, prevJson = null;
    return fs.onSnapshot(ref, { includeMetadataChanges: true }, snap=>{
      setOnlineStatus(!(snap.metadata && snap.metadata.fromCache));
      if(isDoc){
        const json = JSON.stringify(snap.exists() ? snap.data() : null);
        if(first || json !== prevJson){ first = false; prevJson = json; cb(wrapDoc(snap)); }
      }else if(first || snap.docChanges().length > 0){
        first = false; cb(wrapQuery(snap));
      }
    }, errCb);
  }
  const docApi = d => ({
    set: data => fs.setDoc(d, data),
    delete: () => fs.deleteDoc(d),
    get: () => fs.getDoc(d).then(wrapDoc),
    onSnapshot: (cb, errCb) => listen(d, true, cb, errCb),
  });
  return {
    collection(name){
      const ref = fs.collection(fdb, name);
      return {
        onSnapshot: (cb, errCb) => listen(ref, false, cb, errCb),
        doc: id => docApi(fs.doc(fdb, name, id)),
        get: () => fs.getDocs(ref).then(wrapQuery),
      };
    },
    doc: path => docApi(fs.doc(fdb, path)),
  };
}
let _offlineTimer = null;
function setOnlineStatus(isOnline){
  if(isOnline){
    if(_offlineTimer){ clearTimeout(_offlineTimer); _offlineTimer = null; }
    if(!state.online){ state.online = true; updateStatus(); }
  }else if(state.online && !_offlineTimer){
    // 앱을 막 열었을 때 잠깐 캐시로 먼저 뜨는 건 무시하고, 3초 넘게 서버에 못 붙으면 오프라인 표시
    _offlineTimer = setTimeout(()=>{ _offlineTimer = null; state.online = false; updateStatus(); }, 3000);
  }
}
const _reportedDbErrors = new Set();
function reportDbError(e){
  const code = (e && e.code) || 'unknown';
  console.error('[firestore]', e);
  if(_reportedDbErrors.has(code)) return;
  _reportedDbErrors.add(code);
  if(code === 'permission-denied'){
    toast('공유 저장소 접근이 거부됐어요. Firestore 규칙을 게시했는지 확인해주세요.', 'fail');
  }else{
    toast('공유 저장소 연결에 문제가 있어요 (' + code + ')', 'fail');
  }
}
function withTimeout(p, ms){
  return Promise.race([p, new Promise((_, rej)=>setTimeout(()=>rej(new Error('timeout')), ms))]);
}

async function initDb(){
  if(!firebaseConfigured()){ finishBoot('preview'); return; }
  let db;
  try{ db = await withTimeout(connectFirestore(), 20000); }
  catch(e){ console.error('[firebase]', e); finishBoot('error'); return; }
  state.db = db; state.dbAvailable = true;
  const onErr = e => reportDbError(e);

  db.collection('campingLogs').onSnapshot(snap=>{
    state.campingLogs = snap.docs.map(d=>({id:d.id, ...unfreeze(d.data())}));
    if(['home','camping'].includes(state.currentView)) renderView();
  }, onErr);
  db.collection('gear').onSnapshot(snap=>{
    state.gear = snap.docs.map(d=>({id:d.id, ...unfreeze(d.data())}));
    if(['home','gear'].includes(state.currentView)) renderView();
  }, onErr);
  db.collection('checklists').onSnapshot(snap=>{
    state.checklists = snap.docs.map(d=>({id:d.id, ...unfreeze(d.data())}));
    if(['home','checklist'].includes(state.currentView)) renderView();
  }, onErr);
  db.doc('app/settings').onSnapshot(snap=>{
    if(snap.exists){
      const d = unfreeze(snap.data());
      if(d.weatherLocation) state.weatherLocation = d.weatherLocation;
      if(d.gearCategories && d.gearCategories.length) state.gearCategories = d.gearCategories;
    }
    if(['home','settings','gear'].includes(state.currentView)) renderView();
  }, onErr);
  db.collection('cookingChecks').onSnapshot(snap=>{
    const map = {};
    snap.docs.forEach(d=>{ map[d.id] = unfreeze(d.data()); });
    state.cookingChecks = map;
    if(state.currentView==='cooking') renderView();
  }, onErr);

  finishBoot('shared');
}
function finishBoot(mode){
  state.bootMode = mode;
  // 예시 데이터는 저장소 없이 미리보기할 때만 화면에 채움(공유 저장소에는 절대 쓰지 않음)
  if(mode==='preview' && state.campingLogs.length===0){ seedDefaults(); }
  updateStatus();
  renderNav(); renderView();
}
function updateStatus(){
  let cls = 'local', text;
  if(state.bootMode==='shared'){
    if(state.online){ cls = ''; text = '자동 저장 켜짐 · 함께 쓰는 중'; }
    else { text = '오프라인 · 연결되면 자동 동기화'; }
  }else if(state.bootMode==='preview'){ text = '로컬 미리보기 모드 · 저장 안 됨'; }
  else if(state.bootMode==='error'){ cls = 'err'; text = '연결 안 됨 · 저장 안 됨'; }
  else { text = '연결 확인 중…'; }
  const html = `<span class="dot-status ${cls}"></span>${text}`;
  ['db-status','db-status-top'].forEach(id=>{ const el = document.getElementById(id); if(el) el.innerHTML = html; });
}
function bootBanner(){
  if(state.bootMode==='preview') return `<div class="preview-banner"><b>미리보기 모드예요.</b> Firebase 설정값이 아직 없어서 지금 바꾸는 내용은 저장되지 않고 다른 사람에게도 보이지 않아요. 안내서의 Firebase 설정 단계를 마치면 함께 쓰는 저장소로 바뀌어요.</div>`;
  if(state.bootMode==='error') return `<div class="preview-banner"><b>공유 저장소에 연결하지 못했어요.</b> 인터넷 연결을 확인한 뒤 앱을 다시 열어주세요. 지금 바꾸는 내용은 저장되지 않아요.</div>`;
  return '';
}

function parseBackup(text){
  let data;
  try{ data = JSON.parse(text); }catch(e){ return {error:'백업 내용을 읽지 못했어요. 전체를 빠짐없이 붙여넣었는지 확인해주세요.'}; }
  if(!data || typeof data!=='object' || data.app!=='campbase') return {error:'캠프베이스 백업 파일이 아니에요.'};
  const arr = v => Array.isArray(v) ? v.filter(x=>x && typeof x==='object') : [];
  const withIds = (list, prefix) => list.map(x=>({...x, id: String(x.id || uid(prefix))}));
  return { data: {
    campingLogs: withIds(arr(data.campingLogs), 'c'),
    gear: withIds(arr(data.gear), 'g'),
    checklists: withIds(arr(data.checklists), 'cl').map(cl=>({...cl, items: Array.isArray(cl.items) ? cl.items : []})),
    cookingChecks: (data.cookingChecks && typeof data.cookingChecks==='object' && !Array.isArray(data.cookingChecks)) ? data.cookingChecks : {},
    settings: (data.settings && typeof data.settings==='object') ? data.settings : {},
  }};
}
function startImportBackup(){
  const ta = document.getElementById('backup-text-in');
  const text = ta ? ta.value.trim() : '';
  if(!text){ toast('백업 파일을 고르거나 내용을 붙여넣어 주세요.'); return; }
  const res = parseBackup(text);
  if(res.error){ toast(res.error, 'fail'); return; }
  const d = res.data;
  confirmModal(`백업 내용(캠핑 기록 ${d.campingLogs.length}개, 장비 ${d.gear.length}개, 체크리스트 ${d.checklists.length}개)으로 바꿀까요? 지금 함께 쓰는 데이터는 모두 이 내용으로 바뀌고, 모든 사람 화면에 반영돼요.`, '바꾸기', ()=>applyBackup(d));
}
function applyBackup(d){
  const cols = ['campingLogs','gear','checklists'];
  const prev = { campingLogs: state.campingLogs, gear: state.gear, checklists: state.checklists, cookingChecks: state.cookingChecks };
  state.campingLogs = d.campingLogs; state.gear = d.gear; state.checklists = d.checklists; state.cookingChecks = d.cookingChecks;
  const s = d.settings;
  if(s.homeWidgets && typeof s.homeWidgets==='object'){ state.homeWidgets = {...state.homeWidgets, ...s.homeWidgets}; saveLocalHomeWidgets(); }
  if(Array.isArray(s.gearCategories) && s.gearCategories.length){
    state.gearCategories = s.gearCategories.includes('기타') ? s.gearCategories.slice() : [...s.gearCategories, '기타'];
  }
  if(s.weatherLocation) state.weatherLocation = s.weatherLocation;
  if(state.dbAvailable){
    const db = state.db;
    cols.forEach(c=>{
      const keep = new Set(d[c].map(x=>x.id));
      prev[c].forEach(old=>{ if(!keep.has(old.id)) safePersist(()=>db.collection(c).doc(old.id).delete()); });
      d[c].forEach(x=>safePersist(()=>db.collection(c).doc(x.id).set(stripId(x))));
    });
    Object.keys(prev.cookingChecks||{}).forEach(id=>{ if(!(id in d.cookingChecks)) safePersist(()=>db.collection('cookingChecks').doc(id).delete()); });
    Object.entries(d.cookingChecks).forEach(([id, v])=>safePersist(()=>db.collection('cookingChecks').doc(id).set(v)));
    persistAppSettings();
  }
  renderView();
  toast(state.dbAvailable ? '백업을 가져왔어요. 모두의 화면에 반영돼요.' : '백업을 불러왔어요. (미리보기 모드라 저장되지는 않아요)', 'ok');
}

function onSaveFail(e){ toast('저장에 실패했어요. 다시 시도해주세요.' + (e&&e.code?' ('+e.code+')':''), 'fail'); }
// safePersist: never lets a persistence call block the caller. Any SYNCHRONOUS throw
// (e.g. from building a bad path) or ASYNC rejection is caught here and turned into a
// toast — the caller's own state update + re-render + success toast always run regardless.
function safePersist(fn){
  try{
    const p = fn();
    if(p && typeof p.catch === 'function') p.catch(onSaveFail);
  }catch(e){ onSaveFail(e); }
}
function persistCamping(item){ if(state.dbAvailable) safePersist(()=>state.db.collection('campingLogs').doc(item.id).set(stripId(item))); }
function deleteCampingRemote(id){ if(state.dbAvailable) safePersist(()=>state.db.collection('campingLogs').doc(id).delete()); }
function persistGear(item){ if(state.dbAvailable) safePersist(()=>state.db.collection('gear').doc(item.id).set(stripId(item))); }
function deleteGearRemote(id){ if(state.dbAvailable) safePersist(()=>state.db.collection('gear').doc(id).delete()); }
function persistChecklist(list){ if(state.dbAvailable) safePersist(()=>state.db.collection('checklists').doc(list.id).set(stripId(list))); }
function deleteChecklistRemote(id){ if(state.dbAvailable) safePersist(()=>state.db.collection('checklists').doc(id).delete()); }
function persistAppSettings(){ if(state.dbAvailable) safePersist(()=>state.db.doc('app/settings').set({weatherLocation:state.weatherLocation, gearCategories:state.gearCategories})); }
function persistWeatherLocation(loc){ state.weatherLocation = loc; persistAppSettings(); }
function persistCookingCheck(id, data){ if(state.dbAvailable) safePersist(()=>state.db.collection('cookingChecks').doc(id).set(data)); }

/* ============================ PIE CHART ============================ */
function pieChartSvg(segments, size){
  size = size || 120;
  const r = size/2;
  const total = segments.reduce((s,x)=>s+x.value,0);
  if(!total){
    return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}"><circle cx="${r}" cy="${r}" r="${r-1}" fill="none" stroke="var(--border)" stroke-width="2"/></svg>`;
  }
  let cum = 0;
  const parts = segments.filter(s=>s.value>0).map(seg=>{
    const startAng = cum/total*2*Math.PI - Math.PI/2;
    cum += seg.value;
    const endAng = cum/total*2*Math.PI - Math.PI/2;
    if(seg.value === total){
      return `<circle cx="${r}" cy="${r}" r="${r}" fill="${seg.color}"/>`;
    }
    const x1 = r + r*Math.cos(startAng), y1 = r + r*Math.sin(startAng);
    const x2 = r + r*Math.cos(endAng), y2 = r + r*Math.sin(endAng);
    const large = (endAng-startAng) > Math.PI ? 1 : 0;
    return `<path d="M${r},${r} L${x1.toFixed(2)},${y1.toFixed(2)} A${r},${r} 0 ${large} 1 ${x2.toFixed(2)},${y2.toFixed(2)} Z" fill="${seg.color}"/>`;
  }).join('');
  return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}">${parts}</svg>`;
}

  state.checklists.forEach(cl=>(cl.items||[]).forEach(it=>{ if(isDecided(it)) done++; else notDone++; }));
  const checkSegs = [
    {label:'완료', value:done, color:'#2f6f4f'},
    {label:'미완료', value:notDone, color:'#c9c4b6'},
  ];

  function statCard(title, segs, tab, filterOf, emptyIcon, emptyMsg){
    const total = segs.reduce((s,x)=>s+x.value,0);
    if(total===0){
      return `
        <div class="card stat-card placeholder-card-sm home-cat-link" data-action="home-cat-nav" data-tab="${tab}" data-filter="all">
          ${icon(emptyIcon, 'placeholder-icon-sm')}
          <h3 style="margin:0 0 4px;font-size:13.5px;">${title}</h3>
          <p style="margin:0;font-size:12px;color:var(--text-dim);">${emptyMsg}</p>
        </div>`;
    }
    return `
      <div class="card stat-card">
        <h3 class="home-cat-link" data-action="home-cat-nav" data-tab="${tab}" data-filter="all">${title} ${icon('chev', 'chev-mini')}</h3>
        ${pieChartSvg(segs, 108)}
        <div class="big-num home-cat-link" data-action="home-cat-nav" data-tab="${tab}" data-filter="all">${total}</div>
        <div class="legend">
          ${segs.map(s=>`<div class="legend-row home-cat-link" data-action="home-cat-nav" data-tab="${tab}" data-filter="${esc(filterOf(s.label))}"><span class="legend-dot" style="background:${s.color}"></span><span class="lv">${esc(s.label)}</span><span class="num">${s.value}</span></div>`).join('')}
        </div>
      </div>`;
  }

  const cards = [];
  if(hw.camping) cards.push(statCard('캠핑 기록 · 지역', campSegs, 'camping', l=>l, 'camping', '아직 다녀온 캠핑 기록이 없어요. 눌러서 추가해보세요.'));
  if(hw.gear) cards.push(statCard('보유 장비 · 카테고리', gearSegs, 'gear', l=>l, 'gear', '등록된 장비가 없어요. 눌러서 추가해보세요.'));
  if(hw.checklist) cards.push(statCard('준비물 체크 현황', checkSegs, 'checklist', l=> l==='완료' ? 'done' : 'undone', 'checklist', '체크리스트 항목이 없어요. 눌러서 만들어보세요.'));

  const statBlock = cards.length ? `
    <div class="section-head"><div><h1>한눈에 보기</h1><div class="section-desc">캠핑 기록, 장비, 준비물 현황을 확인하세요.</div></div></div>
    <div class="stat-grid">${cards.join('')}</div>
  ` : '';

  const emptyHint = (!hw.location && cards.length===0) ? `
    <div class="empty">Home에 표시할 위젯이 모두 꺼져 있어요. <span data-action="goto-settings" style="color:var(--brand);cursor:pointer;font-weight:600;">설정</span>에서 켜보세요.</div>
  ` : '';

  return `${locHtml}${statBlock}${emptyHint}`;
}

  if(!name){ toast('카테고리 이름을 입력해주세요.'); return; }
  if(state.gearCategories.includes(name)){ toast('이미 있는 카테고리예요.'); return; }

  persistAppSettings();
  categoryManageModal();

}
function renameGearCategory(oldName, newName){
  if(!newName){ toast('이름을 입력해주세요.'); return; }
  if(newName===oldName) return;
  if(state.gearCategories.includes(newName)){ toast('이미 있는 이름이에요.'); return; }
  state.gearCategories = state.gearCategories.map(c=>c===oldName?newName:c);
  state.gear.forEach(g=>{ if(g.category===oldName){ g.category=newName; persistGear(g); } });

function deleteGearCategory(cat){

  state.gearCategories = state.gearCategories.filter(c=>c!==cat);
  if(!state.gearCategories.includes('기타')) state.gearCategories.push('기타');
  const moved = state.gear.filter(g=>g.category===cat);
  moved.forEach(g=>{ g.category='기타'; persistGear(g); });

  renderView();

function groupChecklistItems(items){
  const order = []; const map = {};
  items.forEach(it=>{
    const g = it.group || '기타';
    if(!map[g]){ map[g]=[]; order.push(g); }
    map[g].push(it);
  });
  const ordered = order.filter(g=>g!=='기타');
  if(map['기타']) ordered.push('기타');
  return ordered.map(g=>({group:g, items:map[g]}));
}

/* ============================ MODAL / TOAST ============================ */
function openModal(html){
  document.getElementById('modal-root').innerHTML = `
    <div class="modal-backdrop" id="modal-backdrop">
      <div class="modal">${html}</div>
    </div>`;
  document.getElementById('modal-backdrop').addEventListener('click', e=>{ if(e.target.id==='modal-backdrop') closeModal(); });
}
function closeModal(){ document.getElementById('modal-root').innerHTML=''; _confirmCallback = null; }
// confirmModal: replaces window.confirm() for destructive actions. The
// sandboxed iframe this Artifact runs in silently blocks native confirm()/
// alert() dialogs (no popup ever appears and it just resolves as cancelled)
// — clicking a delete icon would then do nothing at all ("선택 시 무반응"),
// with no error either, since `if(!confirm(...)) break;` just quietly took
// the cancel branch. This draws the same confirmation as a normal in-app
// modal instead, which always renders.
let _confirmCallback = null;
function confirmModal(message, confirmLabel, onConfirm){
  _confirmCallback = onConfirm;
  openModal(`
    <h3>확인</h3>
    <p style="margin:0 0 4px;color:var(--text-dim);font-size:13.5px;line-height:1.6;">${esc(message)}</p>
    <div class="modal-actions">
      <button class="btn" data-action="modal-close">취소</button>
      <button class="btn btn-danger-solid" data-action="confirm-yes">${esc(confirmLabel||'확인')}</button>
    </div>
  `);
}
function toast(msg, kind){
  const t=document.getElementById('toast'); t.textContent=msg;
  t.classList.remove('fail','ok'); if(kind) t.classList.add(kind);
  t.classList.add('show');
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'), 1800);
}

/* ============================ GLOBAL EVENT DELEGATION ============================ */
function wireGlobalActions(){
  document.addEventListener('click', (e)=>{
   try{
    const navEl = e.target.closest('[data-nav]');
    if(navEl && navEl.closest('#nav, #mobile-topbar')){
      state.currentView = navEl.getAttribute('data-nav');
      renderNav(); renderView();
      return;
    }
    const a = e.target.closest('[data-action]');
    if(!a) return;
    const action = a.getAttribute('data-action');
    const id = a.getAttribute('data-id');

    switch(action){
      case 'modal-close': closeModal(); break;

      case 'camp-new': campFormModal(); break;
      case 'camp-edit': campFormModal(id); break;
      case 'camp-del': {
        const target = state.campingLogs.find(c=>c.id===id);
        confirmModal(`'${target?target.name:'이 기록'}'을 삭제할까요? 되돌릴 수 없어요.`, '삭제', ()=>{
          state.campingLogs = state.campingLogs.filter(c=>c.id!==id);
          deleteCampingRemote(id); renderView(); toast('기록을 삭제했어요.');
        });
        break;
      }
      case 'camp-save': saveCampForm(id); break;

      case 'gear-new': gearFormModal(); break;
      case 'gear-edit': gearFormModal(id); break;
      case 'gear-del': {
        const target = state.gear.find(g=>g.id===id);
        confirmModal(`'${target?target.name:'이 장비'}'를 삭제할까요? 되돌릴 수 없어요.`, '삭제', ()=>{
          state.gear = state.gear.filter(g=>g.id!==id);
          deleteGearRemote(id); renderView(); toast('장비를 삭제했어요.');
        });
        break;
      }
      case 'gear-save': saveGearForm(id); break;

      case 'gear-cat-manage': categoryManageModal(); break;
      case 'gear-cat-add': {
        const input = document.getElementById('cat-new-name');
        addGearCategory(input.value.trim());
        break;
      }
      case 'gear-cat-rename': {
        const oldName = a.getAttribute('data-old');
        const row = a.closest('.list-row');
        const input = row.querySelector('.cat-edit-input');
        renameGearCategory(oldName, input.value.trim());
        break;
      }
      case 'gear-cat-del':
        deleteGearCategory(a.getAttribute('data-cat'));
        break;

      case 'home-loc-save': saveBaseLocation(); break;

      case 'goto-settings':
        state.currentView = 'settings';
        renderNav(); renderView();
        break;

      case 'cook-filter':
        state.cookingCategory = a.getAttribute('data-cat');
        renderView();
        break;

      case 'camp-filter':
        state.campingFilter = a.getAttribute('data-cat');
        renderView();
        break;

      case 'gear-filter':
        state.gearCategory = a.getAttribute('data-cat');
        renderView();
        break;

      case 'cl-filter':
        state.checklistFilter = a.getAttribute('data-filter');
        renderView();
        break;

      case 'home-cat-nav': {
        const tab = a.getAttribute('data-tab');
        const filterVal = a.getAttribute('data-filter');
        if(tab==='camping') state.campingFilter = filterVal;
        if(tab==='gear') state.gearCategory = filterVal;
        if(tab==='checklist') state.checklistFilter = filterVal;
        state.currentView = tab;
        renderNav(); renderView();
        break;
      }

      case 'cl-new-list': newChecklistModal(); break;
      case 'cl-new-list-save': saveNewChecklist(); break;
      case 'cl-del-list': {
        const target = state.checklists.find(c=>c.id===id);
        confirmModal(`'${target?target.title:'이 리스트'}' 전체를 삭제할까요? 안의 항목도 모두 사라지고 되돌릴 수 없어요.`, '삭제', ()=>{
          state.checklists = state.checklists.filter(c=>c.id!==id);
          deleteChecklistRemote(id); renderView(); toast('리스트를 삭제했어요.');
        });
        break;
      }
      case 'cl-list-reset': resetChecklist(id); break;
      case 'cl-list-rename': renameListModal(id); break;
      case 'backup-export': exportBackupModal(); break;
      case 'backup-copy': copyBackupText(); break;
      case 'backup-import': importBackupModal(); break;
      case 'backup-import-go': startImportBackup(); break;
      case 'cl-list-rename-save': {
        const input = document.getElementById('cl-title-name');
        renameChecklistTitle(id, input ? input.value : '');
        break;
      }
      case 'confirm-yes': {
        const cb = _confirmCallback; _confirmCallback = null;
        closeModal();
        if(cb) cb();
        break;
      }
      case 'cl-add-item': addChecklistItemModal(id); break;
      case 'cl-add-item-save': saveChecklistItem(id); break;
      case 'cli-group-pick': {
        const groupEl = document.getElementById('cli-group');
        if(groupEl) groupEl.value = a.getAttribute('data-val');
        break;
      }
      case 'cl-item-status': {
        const listId = a.getAttribute('data-list'), itemId = a.getAttribute('data-item'), val = a.getAttribute('data-val');
        const list = state.checklists.find(c=>c.id===listId);
        if(list){
          const it = (list.items||[]).find(i=>i.id===itemId);
          if(it){
            const cur = itemStatus(it);
            it.status = (cur===val) ? 'pending' : val; // clicking the active state again resets to 미정
            delete it.checked; // migrate off the legacy boolean field going forward
            persistChecklist(list);
            renderView();
          }
        }
        break;
      }
      case 'cl-del-item': {
        const listId = a.getAttribute('data-list'), itemId = a.getAttribute('data-item');
        const list = state.checklists.find(c=>c.id===listId);
        if(list){ list.items = (list.items||[]).filter(i=>i.id!==itemId); persistChecklist(list); renderView(); }
        break;
      }
      case 'cl-group-add': {
        const listId = a.getAttribute('data-list'), group = a.getAttribute('data-group');
        addChecklistItemModal(listId, group);
        break;
      }
      case 'cl-group-rename': {
        const listId = a.getAttribute('data-list'), group = a.getAttribute('data-group');
        renameGroupModal(listId, group);
        break;
      }
      case 'cl-group-rename-save': {
        const listId = a.getAttribute('data-list'), oldName = a.getAttribute('data-old');
        const input = document.getElementById('clg-name');
        renameChecklistGroup(listId, oldName, input.value);
        break;
      }
    }
   }catch(err){
     console.error('[wireGlobalActions:click]', err);
     toast('작업 중 오류가 발생했어요: ' + (err && err.message ? err.message : String(err)), 'fail');
   }
  });
  document.addEventListener('change', (e)=>{
   try{
    const cc = e.target.closest('[data-action="cook-toggle"]');
    if(cc){
      const rid = cc.getAttribute('data-recipe');
      const idx = Number(cc.getAttribute('data-idx'));
      const cur = new Set((state.cookingChecks[rid] && state.cookingChecks[rid].checked) || []);
      if(cc.checked) cur.add(idx); else cur.delete(idx);
      state.cookingChecks[rid] = {checked:[...cur]};
      persistCookingCheck(rid, state.cookingChecks[rid]);
      renderView();
      return;
    }
    if(e.target && e.target.id === 'backup-file'){
      const f = e.target.files && e.target.files[0];
      if(f){
        const r = new FileReader();
        r.onload = ()=>{
          const ta = document.getElementById('backup-text-in');
          if(ta) ta.value = String(r.result || '');
          toast('파일을 불러왔어요. 가져오기를 눌러주세요.');
        };
        r.readAsText(f);
      }
      return;
    }
    const tw = e.target.closest('[data-action="toggle-widget"]');
    if(tw){
      toggleHomeWidget(tw.getAttribute('data-key'));
    }
    const cs = e.target.closest('[data-action="camp-sort"]');
    if(cs){
      state.campingSort = cs.value;
      renderView();
    }
   }catch(err){
     console.error('[wireGlobalActions:change]', err);
     toast('작업 중 오류가 발생했어요: ' + (err && err.message ? err.message : String(err)), 'fail');
   }
  });
}

/* ============================ BOOT ============================ */
function boot(){
  loadLocalHomeWidgets();
  renderNav();
  updateStatus();
  wireGlobalActions();
  initDb();
  // 웹(홈 화면 설치)용 오프라인 캐시. APK 안에서는 앱에 파일이 들어 있으므로 쓰지 않음.
  if('serviceWorker' in navigator && !window.Capacitor && location.protocol === 'https:'){
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  }
}
boot();
</script>
