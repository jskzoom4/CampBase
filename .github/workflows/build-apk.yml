# 캠프베이스 안드로이드 APK 자동 빌드
# 저장소에 파일을 올리거나 고칠 때마다 GitHub가 APK를 새로 만들어
# "Releases"에 올려줘요. 공유 링크(항상 최신):
#   https://github.com/<아이디>/<저장소이름>/releases/latest/download/campbase.apk
name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 받기
        uses: actions/checkout@v4

      - name: Firebase 설정 확인
        run: |
          if grep -q "여기에-붙여넣기" docs/firebase-config.js; then
            echo "::warning title=Firebase 설정 전::docs/firebase-config.js에 설정값이 아직 없어요. 이대로 만든 APK는 저장되지 않는 미리보기 모드로 열려요. (안내서 3단계)"
          fi

      - name: Node 준비
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Java 준비
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 빌드 도구 설치
        run: npm install --no-audit --no-fund

      - name: Firebase SDK를 앱 안에 포함 (오프라인 첫 실행 대비)
        run: |
          V=10.12.2
          mkdir -p docs/vendor/firebase
          curl -fsSL "https://www.gstatic.com/firebasejs/$V/firebase-app.js" -o docs/vendor/firebase/firebase-app.js
          curl -fsSL "https://www.gstatic.com/firebasejs/$V/firebase-firestore.js" -o docs/vendor/firebase/firebase-firestore.js
          # firestore 모듈이 CDN의 app 모듈 대신 앱 안의 app 모듈을 쓰도록 경로 변경
          sed -i "s#https://www.gstatic.com/firebasejs/$V/firebase-app.js#./firebase-app.js#g" docs/vendor/firebase/firebase-firestore.js

      - name: 안드로이드 프로젝트 만들기
        run: npx cap add android

      - name: 앱 아이콘·시작 화면 만들기
        continue-on-error: true
        run: npx capacitor-assets generate --android

      - name: 앱 파일 복사
        run: npx cap sync android

      - name: 고정 서명키 사용 (업데이트 시 덮어 설치 가능)
        run: |
          mkdir -p ~/.android
          cp keystore/debug.keystore ~/.android/debug.keystore

      - name: APK 빌드
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 파일 이름 정리
        run: cp android/app/build/outputs/apk/debug/app-debug.apk campbase.apk

      - name: 빌드 결과 보관
        uses: actions/upload-artifact@v4
        with:
          name: campbase-apk
          path: campbase.apk

      - name: Releases에 올리기
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: 캠프베이스 빌드 ${{ github.run_number }}
          body: |
            휴대폰에서 아래 campbase.apk를 눌러 받은 뒤 설치하세요.
            항상 최신 버전 링크: https://github.com/${{ github.repository }}/releases/latest/download/campbase.apk
          files: campbase.apk
          make_latest: true
